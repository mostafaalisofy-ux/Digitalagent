<title>Tamm Mix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Option F, «Tamm Mix» (owner 2026-11-26: «a mix of the five, the best of each»).
   From Tamm OS: the start-up and the dock, and Tamm in the corner with a tip for each section.
   From Tamm Engine: the field of 45° strokes, the marketing adviser, the wired disciplines, the ring of films, the clients plane.
   From the site (v1.1 dark / v1.2 light): Tamm's stage with the blade, the kinetic band, headings that rise word by word,
   the diagonal wipe, magnetic buttons, and both looks behind one switch.
   From the thread: services answered as replies, cases as receipts, the composer that writes the brief, the blade on the page edge.
   Lines and solid shapes only: no glow, no particles. Electric Purple for the blade, actions and key data. IBM Plex Sans Arabic
   for both scripts, IBM Plex Mono for the machine voice. Reduced motion shows everything in its final state. */
:root {
  --ob: #09090D; --gr: #17171E; --gr2: #1F1F28; --ink: #F5F3FA; --soft: #D8D5E0; --mu: #96939F; --line: rgb(245 243 250 / .1); --line2: rgb(245 243 250 / .2);
  --pu: #6C35FF; --pi: #A78BFA; --glass: rgb(23 23 30 / .82); --navbg: rgb(9 9 13 / .55); --bub: #F5F3FA; --tint: rgb(108 53 255 / .1);
  --stage: radial-gradient(120% 90% at 70% 8%, #26252f 0, #17171e 52%, #0f0f15 100%); --shade: rgb(0 0 0 / .45);
  --sans: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
:root[data-mx="light"] {
  --ob: #F5F3FA; --gr: #FFFFFF; --gr2: #EEEAF6; --ink: #09090D; --soft: #2A2833; --mu: #5E5A6A; --line: rgb(9 9 13 / .09); --line2: rgb(9 9 13 / .18);
  --pi: #5523E0; --glass: rgb(255 255 255 / .86); --navbg: rgb(245 243 250 / .72); --bub: #FFFFFF; --tint: rgb(108 53 255 / .07);
  --stage: radial-gradient(120% 90% at 70% 8%, #fff 0, #EEE8FF 55%, #E2D8FF 100%); --shade: rgb(40 18 110 / .2);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ob); color: var(--ink); font: 400 17px/1.65 var(--sans); overflow-x: clip; -webkit-font-smoothing: antialiased; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transition: background-color .35s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ob); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pu); outline-offset: 3px; border-radius: 8px; }
[hidden] { display: none !important; }
.in { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
section { position: relative; }
.eyebrow { font: 500 12.5px/1 var(--mono); color: var(--pi); letter-spacing: .08em; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
[dir="rtl"] .eyebrow { font-family: var(--sans); font-size: 14px; letter-spacing: 0; font-weight: 600; }
.eyebrow::before { content: ""; width: 10px; height: 10px; flex: none; background: var(--pu); border-radius: 2px; transform: rotate(45deg); }
h2 { margin: 14px 0 0; font-weight: 700; font-size: clamp(36px, 5.2vw, 76px); line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
[dir="rtl"] h2 { letter-spacing: 0; line-height: 1.25; }
.lead { color: var(--soft); max-width: 54ch; font-size: clamp(17px, 1.4vw, 20px); margin: 16px 0 0; }
.mail { direction: ltr; unicode-bidi: isolate; font-weight: 600; user-select: all; }

/* start-up (from Tamm OS): once per visit; CSS fades it even if the script never runs */
.boot { position: fixed; inset: 0; z-index: 3000; background: var(--ob); display: grid; place-items: center; animation: bootout .45s 2.2s forwards; }
.boot.out { opacity: 0; transition: opacity .4s; pointer-events: none; }
.boot > div { display: grid; justify-items: center; gap: 20px; }
.boot img { height: 92px; animation: pop .7s cubic-bezier(.2,1.4,.4,1); }
.boot .pb { width: 180px; height: 4px; border-radius: 4px; background: var(--gr2); overflow: hidden; }
.boot .pb i { display: block; height: 100%; width: 0; background: var(--pu); animation: load 1.1s .15s ease forwards; }
.boot small { color: var(--mu); font-size: 13px; }
@keyframes load { to { width: 100%; } }
@keyframes bootout { to { opacity: 0; visibility: hidden; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }

/* the blade on the page edge (from the thread): it slides down as you read */
.blade { position: fixed; z-index: 1; inset-inline-end: -64px; top: 0; width: 26px; height: 46vh; border-radius: 16px; background: var(--pu); transform: translateY(calc(var(--p, 0) * 64vh)) rotate(45deg); pointer-events: none; }
@media (max-width: 999px) { .blade { display: none; } }

/* top bar */
.nav { position: fixed; z-index: 50; top: env(safe-area-inset-top, 0px); inset-inline: 0; }
.nav { transition: background-color .3s, border-color .3s; border-bottom: 1px solid transparent; }
.nav.solid { background: color-mix(in srgb, var(--ob) 86%, transparent); backdrop-filter: blur(14px); border-bottom-color: var(--line); }
.nav .in { display: flex; align-items: center; gap: 10px; padding-block: 14px; }
.nav img { height: 32px; width: auto; }
.nav b { font-size: 16px; }
.nav .sp { flex: 1; }
.nav a, .nav button { color: var(--ink); text-decoration: none; font-size: 14px; border: 1px solid var(--line2); border-radius: 999px; min-height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--navbg); backdrop-filter: blur(10px); cursor: pointer; }
.nav #theme { width: 38px; padding: 0; justify-content: center; }
.nav #theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.nav a.pri { background: var(--pu); border-color: var(--pu); color: #fff; }
.logo-dark { display: none; }
:root[data-mx="light"] .logo-light { display: none; } :root[data-mx="light"] .logo-dark { display: block; }

/* hero: the field (Engine) + Tamm's stage (site) */
.hero { min-height: min(100svh, 980px); display: grid; align-items: center; overflow: hidden; padding-block: calc(env(safe-area-inset-top, 0px) + 96px) 56px; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 60% at 30% 50%, color-mix(in srgb, var(--ob) 88%, transparent), color-mix(in srgb, var(--ob) 20%, transparent) 70%, transparent); }
[dir="rtl"] .hero::after { background: radial-gradient(70% 60% at 70% 50%, color-mix(in srgb, var(--ob) 88%, transparent), color-mix(in srgb, var(--ob) 20%, transparent) 70%, transparent); }
.hgrid { position: relative; z-index: 2; width: 100%; display: grid; gap: 40px; align-items: center; }
.hcopy { display: grid; gap: 24px; min-width: 0; }
.hero h1 { margin: 0; font-weight: 700; font-size: clamp(60px, 9vw, 140px); line-height: .9; letter-spacing: -.045em; }
[dir="rtl"] .hero h1 { letter-spacing: 0; line-height: 1.12; }
.hero h1 .ln { display: block; overflow: hidden; padding-bottom: .04em; }
.hero h1 .ch { display: inline-block; transform: translateY(105%); animation: up .9s var(--ease) forwards; animation-delay: calc(var(--i) * 40ms + var(--d0, .2s)); }
.hero h1 .ln + .ln .ch { color: var(--pu); animation-delay: calc(var(--i) * 40ms + var(--d0, .2s) + .35s); }
@keyframes up { to { transform: none; } }
.hero .lead { margin: 0; }
.prompt { display: grid; gap: 12px; max-width: 720px; }
.pbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border: 1px solid var(--line2); border-radius: 20px; background: var(--glass); backdrop-filter: blur(14px); transition: border-color .2s; }
[dir="rtl"] .pbar { padding: 10px 18px 10px 10px; }
.pbar:focus-within { border-color: var(--pi); }
.pbar .spark { width: 14px; height: 14px; background: var(--pu); border-radius: 3px; transform: rotate(45deg); animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(405deg); } }
.pbar input { background: none; border: 0; outline: none; font-size: clamp(16px, 1.5vw, 18px); min-width: 0; padding: 10px 0; }
.pbar button { border: 0; background: var(--pu); color: #fff; border-radius: 13px; min-height: 46px; padding: 0 20px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line2); background: var(--navbg); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; color: var(--soft); cursor: pointer; transition: border-color .2s, color .2s; }
.chips button:hover { border-color: var(--pi); color: var(--ink); }

.stage { --px: 0; --py: 0; position: relative; aspect-ratio: 5 / 6; width: 100%; max-width: 500px; justify-self: center; border-radius: 36px; overflow: hidden; isolation: isolate; background: var(--stage); box-shadow: inset 0 0 0 1px var(--line), 0 30px 70px var(--shade); }
.stage__blade { position: absolute; z-index: -1; left: 50%; top: -20%; width: 12%; height: 150%; border-radius: 28px; background: var(--pu); transform: translateX(calc(-50% + var(--px) * -18px)) rotate(45deg) scaleY(0); animation: cut 1.1s var(--d1, .3s) var(--ease) forwards; }
@keyframes cut { to { transform: translateX(calc(-50% + var(--px) * -18px)) rotate(45deg) scaleY(1); } }
.stage__floor { position: absolute; inset: auto 18% 6% 18%; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, var(--shade), transparent); }
.stage__tamm { position: absolute; bottom: 5%; left: 50%; height: 86%; width: auto; transform: translateX(-50%); transition: transform .25s ease-out; filter: drop-shadow(0 24px 30px var(--shade)); animation: rise .9s var(--d1, .3s) var(--ease) both, float 5.5s 2s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; translate: 0 40px; } }
@keyframes float { 50% { translate: 0 -10px; } }
.stage__bubble { position: absolute; top: 8%; inset-inline-start: 6%; max-width: 58%; margin: 0; background: var(--bub); color: #09090D; border-radius: 20px; padding: 12px 18px; font-weight: 700; font-size: clamp(1rem, 1.5vw, 1.35rem); line-height: 1.3; box-shadow: 0 10px 30px var(--shade); animation: pop .5s calc(var(--d1, .3s) + .8s) cubic-bezier(.2,1.4,.4,1) both; }
.stage__bubble::after { content: ""; position: absolute; bottom: -8px; inset-inline-start: 32px; width: 18px; height: 18px; background: inherit; transform: rotate(45deg); border-radius: 3px; }
.stage__bubble b { color: var(--pu); }
.stage__bubble.re { animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
.stage__chip { position: absolute; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); translate: calc(var(--px) * 10px) calc(var(--py) * 6px); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both, drift 6s 3s ease-in-out infinite; }
.stage__chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--pu); transform: rotate(45deg); }
@keyframes drift { 50% { transform: translateY(-6px); } }
.stage__chip.c1 { inset-inline-end: 6%; top: 36%; animation-delay: calc(var(--d1, .3s) + 1s), 3s; }
.stage__chip.c2 { inset-inline-start: 5%; top: 54%; animation-delay: calc(var(--d1, .3s) + 1.15s), 3.4s; }
.stage__chip.c3 { inset-inline-end: 7%; top: 69%; animation-delay: calc(var(--d1, .3s) + 1.3s), 3.8s; }
.stage__chip.c4 { inset-inline-start: 8%; bottom: 11%; animation-delay: calc(var(--d1, .3s) + 1.45s), 4.2s; }

/* the adviser's answer (Engine) */
.answer { position: relative; z-index: 2; }
.out { border: 1px solid var(--line2); border-radius: 20px; background: var(--gr); overflow: hidden; scroll-margin-top: 86px; }
.out .hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); font: 500 12.5px/1 var(--mono); color: var(--mu); }
.out .hd i { width: 8px; height: 8px; border-radius: 2px; background: var(--pu); transform: rotate(45deg); }
.out .hd .st { margin-inline-start: auto; color: var(--pi); }
.out .hd .mode { border: 1px solid var(--line2); border-radius: 999px; padding: 4px 9px; font-size: 11.5px; color: var(--soft); }
.out .hd .mode.live { border-color: var(--pi); color: var(--pi); }
[dir="rtl"] .out .hd .mode, [dir="rtl"] .out .hd .st { font-family: var(--sans); }
.out .hd #stop { border: 1px solid var(--line2); background: var(--gr2); border-radius: 999px; padding: 5px 12px; font: 500 12px/1 var(--mono); cursor: pointer; }
.qq { padding: 16px 20px 0; font-weight: 500; font-size: 17px; }
.qq:empty { display: none; }
.qq span { display: block; font: 500 12px/1.4 var(--mono); color: var(--mu); margin-bottom: 4px; }
[dir="rtl"] .qq span { font-family: var(--sans); }
.out .bd { padding: 18px 20px 8px; font: 400 15.5px/1.75 var(--sans); color: var(--soft); min-height: 160px; max-width: 880px; }
.out .bd h4 { margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; font: 500 12.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--pi); }
[dir="rtl"] .out .bd h4 { font: 600 14px/1.3 var(--sans); letter-spacing: 0; }
.out .bd h4::before { content: ""; width: 8px; height: 8px; flex: none; background: var(--pu); border-radius: 2px; transform: rotate(45deg); }
.out .bd h4:first-child { margin-top: 0; }
.out .bd p { margin: 0 0 8px; }
.out .bd ol, .out .bd ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.out .bd ol { counter-reset: s; }
.out .bd ol li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; }
.out .bd ol li::before { content: counter(s, decimal-leading-zero); font: 500 12.5px/1.9 var(--mono); color: var(--pi); }
.out .bd ul li { position: relative; padding-inline-start: 20px; }
.out .bd ul li::before { content: ""; position: absolute; inset-inline-start: 3px; top: .72em; width: 6px; height: 6px; border: 1.5px solid var(--pi); border-radius: 1px; transform: rotate(45deg); }
.out .bd b { color: var(--ink); font-weight: 600; }
.out .bd .note { color: var(--mu); font-size: 13.5px; }
.fqs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.fqs button { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--soft); cursor: pointer; text-align: start; }
.fqs button:hover { border-color: var(--pi); color: var(--ink); }
.fqs button::after { content: " ↗"; color: var(--pi); }
.think { display: flex; align-items: center; gap: 6px; font: 500 13.5px/1.4 var(--mono); color: var(--mu); }
[dir="rtl"] .think { font-family: var(--sans); }
.think i { width: 4px; height: 16px; border-radius: 2px; background: var(--pi); animation: bar 1s ease-in-out infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
.think span { margin-inline-start: 8px; }
@keyframes bar { 50% { transform: scaleY(.35); opacity: .5; } }
.caret { display: inline-block; width: .55em; height: 1.1em; background: var(--pi); vertical-align: -.2em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cta { margin: 18px 0; border: 1px solid var(--pi); border-radius: 18px; padding: 18px; background: var(--tint); display: grid; gap: 8px; }
.cta b { font-size: 19px; color: var(--ink); }
.cta p { margin: 0; }
.cta .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 4px; }
.cta .go { min-height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--pu); color: #fff; font-weight: 600; cursor: pointer; }
.cta .cp { min-height: 46px; padding: 0 16px; border: 1px solid var(--line2); background: var(--gr2); border-radius: 999px; cursor: pointer; }
.cta .mail { color: var(--mu); font-size: 14px; }
.out .ft { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--mu); }

/* the kinetic band (site) */
.ticker { direction: ltr; position: relative; overflow: hidden; margin-top: clamp(70px, 9vw, 120px); padding-block: clamp(18px, 3vw, 34px); border-block: 1px solid var(--line); background: var(--gr); }
.ticker__row { display: flex; gap: 48px; width: max-content; animation: tk 40s linear infinite; font-weight: 700; font-size: clamp(2.4rem, 1.4rem + 4vw, 5.4rem); line-height: 1.1; white-space: nowrap; }
.ticker__row.rev { animation-direction: reverse; animation-duration: 48s; margin-top: 8px; }
.ticker__row span { display: inline-flex; align-items: center; gap: 48px; unicode-bidi: isolate; }
.ticker__row .o { color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.ticker__row .b { width: .3em; height: 1em; background: var(--pu); border-radius: 6px; transform: rotate(45deg); }
@keyframes tk { to { transform: translateX(-50%); } }
.ticker:hover .ticker__row { animation-play-state: paused; }

/* who we are */
.who { padding-block: clamp(90px, 12vw, 150px) 0; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 44px; }
.fact { border-top: 1px solid var(--line2); padding-top: 14px; }
.fact b { display: block; font-size: clamp(44px, 5.4vw, 78px); line-height: 1; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
[dir="rtl"] .fact b { text-align: right; }
.fact span { color: var(--mu); font-size: 14.5px; }
.story { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 40px; }
.story article { border: 1px solid var(--line); background: var(--gr); border-radius: 20px; padding: 20px; }
.story h3 { margin: 0 0 6px; font-size: 18px; }
.story p { margin: 0; color: var(--soft); font-size: 15px; }
.name { margin-top: 18px; color: var(--mu); font-size: 15px; max-width: 70ch; }

/* how we work: wired disciplines (Engine) answered as replies (thread) */
.pipe { padding-block: clamp(90px, 12vw, 150px); }
.graph { margin-top: 44px; position: relative; display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.node { position: relative; border: 1px solid var(--line); background: var(--gr); border-radius: 20px; padding: 20px; min-height: 250px; display: grid; align-content: start; gap: 10px; transition: border-color .3s, transform .3s; }
.node:hover { border-color: var(--pi); transform: translateY(-4px); }
.node .n { font: 500 12px/1 var(--mono); color: var(--pi); }
.node h3 { margin: 0; font-size: 21px; line-height: 1.25; }
.node p { margin: 0; color: var(--mu); font-size: 14.5px; }
.node ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.node li button { width: 100%; text-align: start; border: 1px solid var(--line2); background: transparent; border-radius: 12px; padding: 7px 10px; font-size: 13.5px; color: var(--soft); cursor: pointer; transition: border-color .2s, color .2s; }
.node li button:hover, .node li button.on { border-color: var(--pi); color: var(--ink); }
.wire { position: absolute; inset: auto 0 -64px; height: 64px; pointer-events: none; }
.wire svg { width: 100%; height: 100%; overflow: visible; }
.wire path { fill: none; stroke: var(--line2); stroke-width: 1.5; }
.wire path.flow { stroke: var(--pu); stroke-width: 2; stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -48; } }
.target { margin: 88px auto 0; width: fit-content; max-width: 100%; border: 1px solid var(--pi); border-radius: 999px; padding: 12px 22px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: var(--tint); }
.target i { width: 12px; height: 12px; background: var(--pu); border-radius: 3px; transform: rotate(45deg); }
.reply { display: flex; gap: 12px; align-items: flex-end; margin-top: 26px; max-width: 720px; }
.av { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--gr2); border: 1px solid var(--line2); overflow: hidden; display: grid; place-items: end center; }
.av img { width: 120%; height: auto; transform: translateY(18%); }
.reply .bub { background: var(--gr); border: 1px solid var(--line2); border-radius: 20px; border-end-start-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; animation: pop .4s cubic-bezier(.2,1.4,.4,1) both; }
.reply .bub b { font-size: 17px; }
.reply .bub p { margin: 0; color: var(--soft); font-size: 15px; }
.reply .bub button { justify-self: start; border: 1px solid var(--pi); background: transparent; color: var(--pi); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; cursor: pointer; }

/* the ring of films + the reel (Engine), the reel opens on the diagonal (site) */
.ringsec { padding-block: clamp(70px, 9vw, 130px); overflow: hidden; }
.stage3d { position: relative; height: 560px; margin-top: 30px; perspective: 1400px; perspective-origin: 50% 30%; touch-action: pan-y; cursor: grab; }
.stage3d:active { cursor: grabbing; }
.ring { position: absolute; left: 50%; top: 40px; width: 220px; height: 390px; transform-style: preserve-3d; transform: translateX(-50%) rotateY(var(--ry, 0deg)); }
.card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid var(--line2); backface-visibility: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    d: { ar: 'في المنصات الحالية صار الإبداع هو الاستهداف: الخوارزمية تجد الجمهور، والإعلان هو ما يجعله يتوقف. إذا ارتفعت التكلفة وانخفض التفاعل مع الوقت، فالأرجح أن الجمهور تعب من الرسالة نفسها.',
      en: 'On today’s platforms creative is the targeting: the algorithm finds the audience and the ad is what makes them stop. If costs rise and engagement falls over time, the audience has most likely tired of the same message.' },
    s: { ar: ['**اكتب الزاوية قبل التصميم**: مشكلة، أو نتيجة، أو مقارنة، أو اعتراض ترد عليه. زاوية واحدة لكل إعلان.', '**اجعل أول ثانيتين تعملان**: المنتج أو المشكلة في الإطار الأول، والنص على الشاشة لمن يشاهد بلا صوت.', '**صمّم للمنصة**: عمودي 9:16 للريلز وتيك توك وسناب، وبإيقاع المنصة لا بإعلان تلفزيوني مقصوص.', '**اختبر متغيراً واحداً كل مرة**: الافتتاحية أو العرض أو الصيغة، حتى تعرف ما الذي صنع الفرق.', '**جدّد قبل أن يتعب الإعلان**: راقب التكرار وارتفاع التكلفة، وجهّز الدفعة التالية مسبقاً.'],
      en: ['**Write the angle before the design**: a problem, a result, a comparison or an objection answered. One angle per ad.', '**Make the first two seconds work**: the product or the problem in the first frame, with on-screen text for people watching without sound.', '**Design for the platform**: vertical 9:16 for Reels, TikTok and Snapchat, at the platform’s pace rather than a cut-down TV ad.', '**Test one variable at a time**: the opening, the offer or the format, so you know what made the difference.', '**Refresh before the ad tires**: watch frequency and rising costs, and have the next batch ready.'] },
    m: { ar: ['**معدل التوقف**: من شاهد الثواني الأولى ÷ مرات الظهور.', '**نسبة النقر (CTR)**: النقرات ÷ مرات الظهور.', '**تكلفة النتيجة لكل إبداع**: لكل إعلان على حدة، لا متوسط الحملة كلها.'],
      en: ['**Thumb-stop rate**: people who watched the first seconds ÷ impressions.', '**CTR**: clicks ÷ impressions.', '**Cost per result for each creative**: ad by ad, not the campaign average.'] },
    x: { ar: ['إعلان واحد يحمل كل الرسائل.', 'الحكم بالإعجابات بدل النتيجة.'], en: ['One ad carrying every message.', 'Judging on likes instead of results.'] },
    sv: [S_CON, S_MED, S_PERF], f: ['platforms', 'social', 'sales'] },
  { id: 'budget', kw: 'budget|how much|spend|allocat|ميزانيه|بادجت|كم اصرف|كم انفق|انفاق|اصرف كام|اخصص',
    q: { ar: 'كم أخصص ميزانية للإعلانات؟', en: 'How much should I spend on ads?' },
    d: { ar: 'لا يوجد رقم صحيح للجميع. الميزانية الصحيحة تُحسب من الخلف: كم تستطيع أن تدفع لتكسب عميلاً، وكم عميلاً تحتاج. وفي البداية، الميزانية تشتري معلومة قبل أن تشتري نتائج.',
      en: 'There is no right number for everyone. The right budget is worked out backwards: what you can afford to pay for a customer, and how many customers you need. At the start, the budget buys information before it buys results.' },
    s: { ar: ['**احسب الحد الأقصى لتكلفة العميل**: من هامش الربح وقيمة العميل على عدة طلبات.', '**ابدأ بميزانية اختبار محددة المدة**: تكفي لتعطي كل حملة نتائج كافية للحكم، ثم قرّر.', '**ركّز بدل أن تبعثر**: منصة أو اثنتان يوجد فيهما جمهورك أفضل من خمس بميزانيات صغيرة.', '**وزّع حسب المرحلة**: جزء لجذب جمهور جديد، وجزء لمن تفاعل أو زار.', '**زِد تدريجياً**: وسّع ما يعمل بخطوات، وراقب ألا تقفز التكلفة.'],
      en: ['**Work out the most you can pay for a customer**: from your margin and the customer’s value across several orders.', '**Start with a time-boxed test budget**: enough to give each campaign enough results to judge, then decide.', '**Focus, don’t scatter**: one or two platforms where your audience is beat five with small budgets.', '**Split by stage**: part to reach new people, part for those who engaged or visited.', '**Scale in steps**: grow what works gradually and watch that costs don’t jump.'] },
    m: { ar: ['**أقصى تكلفة مقبولة للعميل**: الرقم الذي لا تتجاوزه الحملة.', '**تكلفة الاستحواذ الفعلية**: الإنفاق ÷ العملاء الجدد.', '**ROAS**: الإيراد ÷ الإنفاق، وهو ليس ربحاً.'],
      en: ['**Maximum acceptable cost per customer**: the line a campaign must not cross.', '**Actual acquisition cost**: spend ÷ new customers.', '**ROAS**: revenue ÷ spend. It is not profit.'] },
    x: { ar: ['توزيع ميزانية صغيرة على كل المنصات.', 'إيقاف الاختبار قبل أن تتجمع بيانات كافية.'], en: ['Spreading a small budget across every platform.', 'Stopping a test before enough data comes in.'] },
    sv: [S_STR, S_PERF, S_AN], f: ['roas', 'platforms', 'seasonal'] },
  { id: 'platforms', kw: 'meta|facebook|instagram|google ads|tiktok|snap|linkedin|platform|channel|منصه|منصات|فيسبوك|ميتا|انستغرام|انستجرام|انستقرام|جوجل ادز|تيك ?توك|سناب|لينكد',
    q: { ar: 'أي منصة إعلانية تناسبني؟', en: 'Which ad platform suits me?' },
    d: { ar: 'اختيار المنصة يبدأ بسؤال واحد: هل جمهورك يبحث عنك، أم عليك أن تصل إليه؟ البحث في جوجل يلتقط طلباً موجوداً، والمنصات الاجتماعية تصنع طلباً جديداً.',
      en: 'Choosing a platform starts with one question: is your audience searching for you, or do you need to reach them? Google Search captures existing demand; social platforms create new demand.' },
    s: { ar: ['**جوجل للبحث**: حين يبحث الناس عن منتجك أو خدمتك بالاسم أو بالحاجة.', '**ميتا (فيسبوك وإنستغرام)**: لمعظم المتاجر والخدمات، باستهداف واسع وإبداعات قوية.', '**تيك توك وسناب شات**: لمحتوى عمودي سريع وجمهور أصغر سناً، ويستحقان الاختبار إذا كان جمهورك هناك.', '**لينكدإن**: للخدمات بين الشركات، حين يكون المسمّى الوظيفي هو الاستهداف.', '**اختبر منصتين قبل التوسع**: بالعرض نفسه، وقارن تكلفة النتيجة النهائية لا تكلفة النقرة.'],
      en: ['**Google for search**: when people look for your product or service by name or by need.', '**Meta (Facebook and Instagram)**: for most stores and services, with broad targeting and strong creative.', '**TikTok and Snapchat**: for fast vertical content and younger audiences; worth testing if your audience is there.', '**LinkedIn**: for B2B services, when job title is the targeting.', '**Test two platforms before scaling**: with the same offer, comparing the cost of the final result, not the click.'] },
    m: { ar: ['**تكلفة النتيجة النهائية لكل منصة**.', '**جودة العملاء القادمين من كل منصة**.', '**المساهمة في المبيعات** عبر روابط UTM والتحليلات.'],
      en: ['**Cost of the final result per platform**.', '**Quality of customers from each platform**.', '**Contribution to sales**, via UTM links and analytics.'] },
    x: { ar: ['نسخ الإعلان نفسه على كل المنصات.', 'الحضور في كل مكان بميزانية لا تكفي أي مكان.'], en: ['Copying the same ad onto every platform.', 'Being everywhere on a budget that is enough for nowhere.'] },
    sv: [S_PERF, S_STR, S_MED], f: ['budget', 'creative', 'tracking'] },
  { id: 'seasonal', kw: 'ramadan|eid|white friday|black friday|national day|season|holiday|رمضان|العيد|عيد|الجمعه البيضاء|بلاك فرايداي|اليوم الوطني|موسم|المواسم',
    q: { ar: 'كيف أستعد لموسم رمضان؟', en: 'How do I prepare for Ramadan?' },
    d: { ar: 'المواسم تُكسب قبل أن تبدأ. المنافسة على الإعلانات ترتفع، وعادات الشراء تتغير، ومن يجهّز مبكراً يدخل بإبداعات مختبَرة وجمهور يعرفه.',
      en: 'Seasons are won before they start. Competition for ad space rises and buying habits change; brands that prepare early go in with tested creative and an audience that already knows them.' },
    s: { ar: ['**ابدأ قبل الموسم بأسابيع**: ابنِ جمهوراً متفاعلاً وقوائم تسويق قبل ذروة المنافسة.', '**جهّز العرض والمخزون مبكراً**: العرض الواضح أهم من الخصم الأكبر.', '**جهّز الإبداعات بعدة نسخ**: لبداية الموسم، وذروته، وآخر فرصة.', '**راعِ توقيت الجمهور**: في رمضان مثلاً تتغير ساعات التصفح والشراء، فعدّل الجدولة والرسائل.', '**خطّط لما بعد الموسم**: رحّب بالمشترين الجدد وحوّلهم إلى عملاء عائدين.'],
      en: ['**Start weeks before**: build an engaged audience and marketing lists before competition peaks.', '**Lock the offer and the stock early**: a clear offer matters more than the biggest discount.', '**Prepare creative in several versions**: for the start, the peak and the last chance.', '**Respect the audience’s timing**: in Ramadan, for example, browsing and buying hours shift, so adjust scheduling and messages.', '**Plan for after the season**: welcome the new buyers and turn them into returning customers.'] },
    m: { ar: ['**الإيراد والطلبات مقارنة بالموسم السابق**.', '**تكلفة الاستحواذ يومياً**: لتوقف أو تزيد في الوقت المناسب.', '**نسبة العملاء الجدد**: هل جلب الموسم عملاء جدداً أم أعطى خصماً لعملاء موجودين؟'],
      en: ['**Revenue and orders against last season**.', '**Daily acquisition cost**: so you pull back or push at the right time.', '**Share of new customers**: did the season bring new customers, or discount existing ones?'] },
    x: { ar: ['إطلاق كل شيء في أول يوم من الموسم.', 'خصم كبير بلا قصة ولا سبب للشراء الآن.'], en: ['Launching everything on day one.', 'A big discount with no story and no reason to buy now.'] },
    sv: [S_STR, S_SOC, S_PERF, S_MED], f: ['budget', 'creative', 'retention'] },
  { id: 'seo', kw: 'seo|search|organic|rank|keyword|google|سيو|بحث|محركات|جوجل|ترتيب|اظهر|الظهور|كلمات مفتاحيه|عضوي',
    q: { ar: 'كيف أظهر في نتائج جوجل؟', en: 'How do I show up on Google?' },
    d: { ar: 'الظهور في نتائج البحث استثمار تراكمي: لا يحدث في أسبوع، لكنه يجلب زيارات لا تدفع ثمن كل نقرة منها. وتزداد أهميته مع ظهور الإجابات المولّدة بالذكاء الاصطناعي داخل البحث.',
      en: 'Search visibility compounds: it doesn’t happen in a week, but it brings visits you don’t pay for click by click. It matters more now that AI-generated answers appear inside search.' },
    s: { ar: ['**ابدأ من نية الباحث**: ما الأسئلة والكلمات التي يكتبها عميلك قبل الشراء؟ صفحة لكل نية.', '**أصلح الأساس التقني**: سرعة الصفحات، والعمل على الجوال، والفهرسة، وعدم تكرار المحتوى.', '**اكتب محتوى يجيب فعلاً**: أدلة ومقارنات وأسئلة شائعة بلغة عميلك، بالعربية والإنجليزية إن لزم.', '**قوِّ صفحات المنتجات والخدمات**: عناوين ووصف فريد وبيانات منظّمة.', '**ابنِ السمعة**: ذكر علامتك في مواقع موثوقة، ومراجعات العملاء.'],
      en: ['**Start from search intent**: what does your customer type before buying? One page per intent.', '**Fix the technical base**: page speed, mobile, indexing and no duplicate content.', '**Write content that actually answers**: guides, comparisons and FAQs in your customer’s language, Arabic and English where needed.', '**Strengthen product and service pages**: unique titles and descriptions, and structured data.', '**Build reputation**: mentions on trusted sites and customer reviews.'] },
    m: { ar: ['**الزيارات العضوية للصفحات التجارية**.', '**الكلمات التي تظهر عليها في الصفحة الأولى**.', '**الطلبات أو المبيعات القادمة من البحث العضوي**.'],
      en: ['**Organic visits to commercial pages**.', '**Keywords you rank for on page one**.', '**Enquiries or sales from organic search**.'] },
    x: { ar: ['حشو الكلمات المفتاحية.', 'توقّع النتائج خلال أيام.'], en: ['Keyword stuffing.', 'Expecting results within days.'] },
    sv: [S_SEO, S_CON, S_WEB, S_AN], f: ['cro', 'social', 'tracking'] },
  { id: 'cro', kw: 'conversion|convert|landing|website|site|cart|checkout|bounce|تحويل|صفحه هبوط|لاندنج|موقع|الدفع|يزور|زيارات|زوار|السله المتروكه',
    q: { ar: 'الزيارات كثيرة والمبيعات قليلة', en: 'Plenty of visits, few sales' },
    d: { ar: 'إذا كانت الزيارات تصل ولا تشتري، فالمشكلة في التجربة لا في الإعلان: وعد غير واضح، أو ثقة ناقصة، أو خطوات كثيرة، أو صفحة بطيئة على الجوال.',
      en: 'If visitors arrive and don’t buy, the problem is the experience, not the ad: an unclear promise, missing trust, too many steps or a slow mobile page.' },
    s: { ar: ['**جرّب الشراء بنفسك على الجوال**: من الإعلان حتى الدفع، وسجّل كل لحظة تردد.', '**وضّح الوعد في الشاشة الأولى**: ماذا يحصل العميل، ولماذا الآن، وما الخطوة التالية.', '**أضف إشارات الثقة**: مراجعات، وسياسة إرجاع، وطرق دفع مألوفة، وتكلفة الشحن من البداية.', '**اختصر الدفع**: الشراء كزائر، وحقول أقل، ودفع سريع.', '**اختبر تغييراً واحداً كل مرة**: العنوان أو الصورة أو العرض، وقِس قبل وبعد.'],
      en: ['**Buy from your own store on a phone**: from the ad to payment, noting every moment of hesitation.', '**Make the promise clear on the first screen**: what the customer gets, why now and what to do next.', '**Add trust signals**: reviews, a returns policy, familiar payment methods and delivery cost up front.', '**Shorten checkout**: guest checkout, fewer fields, fast payment.', '**Test one change at a time**: the headline, the image or the offer, measured before and after.'] },
    m: { ar: ['**معدل التحويل**: الطلبات ÷ الزيارات.', '**التخلي عن السلة**: السلات غير المكتملة ÷ السلات التي بدأت.', '**سرعة تحميل الصفحة على الجوال**.'],
      en: ['**Conversion rate**: orders ÷ visits.', '**Cart abandonment**: unfinished carts ÷ carts started.', '**Mobile page load speed**.'] },
    x: { ar: ['زيادة الإعلان لإصلاح مشكلة في الصفحة.', 'تغيير كل شيء مرة واحدة فلا تعرف ما الذي نجح.'], en: ['More ads to fix a page problem.', 'Changing everything at once, so you never learn what worked.'] },
    sv: [S_WEB, S_AN, S_PERF], f: ['sales', 'tracking', 'seo'] },
  { id: 'tracking', kw: 'track|pixel|capi|conversions api|ga4|analytics|utm|attribution|measure|dashboard|قياس|بكسل|تتبع|تحليلات|بيانات|اسناد|داشبورد',
    q: { ar: 'كيف أقيس نتائج إعلاناتي بدقة؟', en: 'How do I measure my ads properly?' },
    d: { ar: 'بدون قياس صحيح تتعلم المنصات من بيانات ناقصة، وتتخذ أنت قرارات بالحدس. القياس الجيد لا يعني أرقاماً أكثر، بل أرقاماً تتفق.',
      en: 'Without proper measurement the platforms learn from incomplete data and you decide on instinct. Good measurement doesn’t mean more numbers; it means numbers that agree.' },
    s: { ar: ['**ثبّت الأحداث المهمة فقط**: مشاهدة المنتج، والإضافة إلى السلة، وبدء الدفع، والشراء أو الطلب.', '**أضف الربط من الخادم**: مثل Conversions API في ميتا، لتعويض ما يضيع من بيانات المتصفح.', '**وحّد تسمية UTM**: قاعدة واحدة لكل الحملات حتى تقرأ المصادر بوضوح في GA4.', '**طابق المصادر**: قارن المنصة والتحليلات ونظام المتجر كل أسبوع، واعرف سبب الفروق.', '**ابنِ لوحة واحدة للرقم التجاري**: الإنفاق والإيراد والعملاء الجدد في مكان واحد.'],
      en: ['**Track only the events that matter**: product view, add to cart, checkout started, purchase or lead.', '**Add server-side tracking**: such as Meta’s Conversions API, to recover what browsers lose.', '**Standardise UTM naming**: one rule for every campaign so sources read cleanly in GA4.', '**Reconcile sources**: compare the platform, analytics and your store system weekly, and know why they differ.', '**Build one dashboard for the business number**: spend, revenue and new customers in one place.'] },
    m: { ar: ['**نسبة الطلبات المتتبَّعة**: الطلبات المسجلة في المنصة ÷ طلبات المتجر الفعلية.', '**جودة مطابقة الأحداث** في مدير الأحداث.', '**الإيراد حسب المصدر** في GA4.'],
      en: ['**Tracked order share**: orders recorded by the platform ÷ actual store orders.', '**Event match quality** in Events Manager.', '**Revenue by source** in GA4.'] },
    x: { ar: ['الاعتماد على رقم المنصة وحده.', 'أحداث مكررة تضاعف التحويلات.'], en: ['Relying on the platform’s number alone.', 'Duplicate events that double-count conversions.'] },
    sv: [S_AN, S_WEB, S_PERF], f: ['roas', 'leads', 'budget'] },
  { id: 'social', kw: 'social|content|engagement|follower|reels|post|influencer|creator|سوشيال|سوشال|محتوي|تفاعل|متابع|منشور|بوست|ريلز|مؤثر|انفلونسر|صناع المحتوي',
    q: { ar: 'كيف أرفع التفاعل على حساباتنا؟', en: 'How do I lift engagement on our accounts?' },
    d: { ar: 'المحتوى الذي ينجح لا يتحدث عن العلامة طوال الوقت، بل عن عالم عميلها: مشكلته، وأسئلته، وما يهمه. والمتابعون رقم جميل، لكن الأهم من يتفاعل ثم يشتري.',
      en: 'Content that works doesn’t talk about the brand all the time; it talks about the customer’s world: their problem, their questions, what they care about. Followers are a nice number, but what matters is who engages and then buys.' },
    s: { ar: ['**حدّد ثلاث إلى أربع ركائز للمحتوى**: تعليمي، ومن خلف الكواليس، والمنتج، والمجتمع.', '**افتتح بقوة**: أول سطر أو أول ثانية تقرر إن كان المحتوى سيُشاهَد.', '**انشر بإيقاع تستطيع الاستمرار عليه**: الاستمرار أهم من الكثافة.', '**ادعم أفضل المنشورات بالإعلان**: ما تفاعل معه الناس طبيعياً مرشح جيد للإعلان.', '**مع المؤثرين، الملاءمة قبل الحجم**: جمهور قريب من عميلك، ومحتوى يشبه أسلوب المؤثر نفسه.'],
      en: ['**Set three or four content pillars**: education, behind the scenes, product and community.', '**Open strong**: the first line or second decides whether it gets watched.', '**Post at a pace you can keep**: consistency beats volume.', '**Put ad spend behind your best posts**: what people engaged with naturally is a good ad candidate.', '**With influencers, fit before size**: an audience close to your customer, and content in the creator’s own style.'] },
    m: { ar: ['**معدل التفاعل لكل منشور**.', '**الحفظ والمشاركة**: إشارات اهتمام أقوى من الإعجاب.', '**الزيارات والطلبات القادمة من السوشيال**.'],
      en: ['**Engagement rate per post**.', '**Saves and shares**: stronger signals of interest than likes.', '**Visits and enquiries from social**.'] },
    x: { ar: ['النشر بلا خطة ولا ركائز.', 'شراء المتابعين أو التفاعل.'], en: ['Posting without a plan or pillars.', 'Buying followers or engagement.'] },
    sv: [S_SOC, S_CON, S_MED], f: ['creative', 'brand', 'platforms'] },
  { id: 'brand', kw: 'brand|launch|identity|logo|positioning|rebrand|naming|علامه|اطلاق|هويه|شعار|لوجو|براند|تموضع',
    q: { ar: 'كيف أطلق علامة تجارية جديدة؟', en: 'How do I launch a new brand?' },

  $('h1').innerHTML = L === 'ar' ? t.h1.map((w) => `<span class="ln"><span class="ch" style="--i:0">${esc(w)}</span></span>`).join('')   // Arabic letters stay joined: the line rises as one
    : t.h1.map((w) => `<span class="ln">${[...w].map((c, i) => `<span class="ch" style="--i:${i}">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</span>`).join('');
  $('chips').innerHTML = t.chips.map((c) => `<button type="button">${esc(c)}</button>`).join('');
  document.querySelectorAll('.stage__chip').forEach((el, i) => { el.textContent = t.disc[i]; });
  bubI = 0; $('bubble').innerHTML = t.bubble[0];
  const row = (ws) => { const one = ws.map((w, i) => `<span class="${i % 2 ? 'o' : ''}">${esc(w)}</span><i class="b"></i>`).join(''); return `<span>${one}</span><span>${one}</span>`; };
  $('tk1').innerHTML = row(t.tk1); $('tk2').innerHTML = row(t.tk2);
  $('facts').innerHTML = t.facts.map(([v, l]) => `<div class="fact rv"><b${/^\d{1,2}\+?$/.test(v) ? ` data-count="${v}"` : ''}>${v}</b><span>${esc(l)}</span></div>`).join('');
  $('story').innerHTML = [[who.storyTitle, who.story], who.mission, who.vision].map(([h, p], i) => `<article class="rv" style="transition-delay:${i * 80}ms"><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('');
  $('nameLine').textContent = who.name;
  $('graph').innerHTML = D.discs.map((d, i) => `<article class="node rv"><span class="n">0${i + 1}</span><h3>${esc(k(d.name))}</h3><p>${esc(k(d.value))}</p><ul>${d.services.map((s) => `<li><button type="button" data-s="${esc(s.name.en)}">${esc(k(s.name))}</button></li>`).join('')}</ul></article>`).join('')
    + `<div class="wire" aria-hidden="true"><svg viewBox="0 0 400 64" preserveAspectRatio="none">${[50, 150, 250, 350].map((x) => `<path d="M${x},0 C${x},40 200,24 200,64"/><path class="flow" d="M${x},0 C${x},40 200,24 200,64"/>`).join('')}</svg></div>`;
  $('svcR').innerHTML = '';
  $('cases').innerHTML = D.cases.map((c, i) => { const b = c.bar, max = b ? Math.max(b.spend, b.result) : 1; return `<article class="rcpt rv" style="transition-delay:${i * 80}ms">
      <span class="m"><span>${esc(k(c.sector))}</span><span>${esc(k(c.period))}</span></span><h3>${esc(k(c.client))}</h3>
      <span class="big" data-count="${esc(c.kpis[0].value)}">${esc(c.kpis[0].value)}</span><span class="lb">${esc(k(c.kpis[0].label))}</span>
      <p>${esc(k(c.headline))}</p>
      ${b ? `<div class="bars"><div class="bar"><span>${esc(k(b.spendLabel))} · ${b.spend.toLocaleString('en-US')} ${esc(k(b.unit))}</span><span class="tr"><i data-w="${(b.spend / max * 100).toFixed(1)}"></i></span></div><div class="bar r"><span>${esc(k(b.resultLabel))} · ${b.result.toLocaleString('en-US')} ${esc(k(b.unit))}</span><span class="tr"><i data-w="${(b.result / max * 100).toFixed(1)}"></i></span></div></div>` : ''}
      <div class="kp">${c.kpis.slice(1).map((x) => `<div><b>${esc(x.value)}</b><span>${esc(k(x.label))}</span></div>`).join('')}</div>
      <details><summary>${esc(t.measured)}</summary><p>${esc(k(c.measured))}${c.note ? ' ' + esc(k(c.note)) : ''}</p></details></article>`; }).join('');
  $('logos').innerHTML = D.clients.map((c) => `<div title="${esc(k(c.name))}"><img src="media${(L === 'ar' && c.logoAr) || c.logo}" alt="${esc(k(c.name))}" loading="lazy"></div>`).join('');
  $('dock').setAttribute('aria-label', t.nm);
  $('dock').innerHTML = Object.keys(ICON).map((id) => `<button type="button" data-go="${id}" class="${id === 'start' ? 'hot' : ''}" aria-label="${esc(t.dock[id])}">${ICON[id]}<span class="tip">${esc(t.dock[id])}</span></button>`).join('');
  $('miniBtn').setAttribute('aria-label', t.tips.ask);
  $('mout').hidden = true; cur = ''; mode(); theme(); ring(); reel(); welcome(); seen = new WeakSet(); tick();
}

/* ---------- the field: 45° strokes bending toward the pointer ---------- */
const cv = $('field'), cx = cv.getContext('2d'); let FW = 0, FH = 0, mx = -9999, my = -9999, tm = 0, dpr = 1;
function size() { dpr = Math.min(2, devicePixelRatio || 1); FW = cv.clientWidth; FH = cv.clientHeight; cv.width = FW * dpr; cv.height = FH * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function field() {
  if (!FW) return; cx.clearRect(0, 0, FW, FH); const g = 34, len = 13, R = 220, base0 = TH === 'dark' ? .11 : .13;
  for (let y = g / 2; y < FH; y += g) for (let x = g / 2; x < FW; x += g) {
    const dx = mx - x, dy = my - y, d = Math.hypot(dx, dy), w = Math.max(0, 1 - d / R);
    const base = -Math.PI / 4 + Math.sin((x + y) * .006 + tm) * .18, a = base * (1 - w) + Math.atan2(dy, dx) * w, l = len + w * 14;
    cx.strokeStyle = w > .05 ? `rgba(${FK},${.25 + w * .6})` : `rgba(${FA},${base0})`; cx.lineWidth = w > .05 ? 1.6 : 1;
    cx.beginPath(); cx.moveTo(x - Math.cos(a) * l / 2, y - Math.sin(a) * l / 2); cx.lineTo(x + Math.cos(a) * l / 2, y + Math.sin(a) * l / 2); cx.stroke();
  }
}
let heroOn = true;
function loop() { tm += .012; field(); if (!still && heroOn) requestAnimationFrame(loop); }
addEventListener('pointermove', (e) => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; if (still) field(); });
addEventListener('resize', () => { size(); field(); });

/* ---------- the stage: Tamm leans toward the pointer ---------- */
const hs = $('hstage'), tmImg = $('stageTamm');
if (!still) {
  $('top').addEventListener('pointermove', (e) => { const r = hs.getBoundingClientRect(), x = Math.max(-.5, Math.min(.5, (e.clientX - r.left) / r.width - .5)), y = Math.max(-.5, Math.min(.5, (e.clientY - r.top) / r.height - .5));
    tmImg.style.transform = `translateX(-50%) translate(${(x * 14).toFixed(1)}px, ${(y * 8).toFixed(1)}px) rotate(${(x * 3).toFixed(2)}deg)`; hs.style.setProperty('--px', x.toFixed(3)); hs.style.setProperty('--py', y.toFixed(3)); });
  $('top').addEventListener('pointerleave', () => { tmImg.style.transform = ''; hs.style.setProperty('--px', '0'); hs.style.setProperty('--py', '0'); });
}
$('pin').addEventListener('input', () => { if (!busy && Date.now() > bubLock - 1000) bubble(esc(T[L].listen), 2500); });

/* ---------- the ring ---------- */
let ry = 0, vel = 0, drag = null;
function ring() {
  const t = T[L], n = t.films.length, w = $('ring').offsetWidth || 220, r = Math.round(w / 2 / Math.tan(Math.PI / n)) + 30;
  $('ring').innerHTML = t.films.map(([id, cap], i) => `<div class="card" style="transform: rotateY(${i * 360 / n}deg) translateZ(${r}px)"><img src="media/studio/${id}-${L}.jpg" alt="" loading="lazy"><button class="pl" type="button" data-f="${i}" aria-label="${esc(cap)}"></button><span class="cap">${esc(cap)}</span></div>`).join('');
}
const rs = $('rstage');
rs.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; drag = { x: e.clientX, r: ry }; rs.setPointerCapture(e.pointerId); vel = 0; });
rs.addEventListener('pointermove', (e) => { if (!drag) return; const nr = drag.r + (e.clientX - drag.x) * .25; vel = nr - ry; ry = nr; $('ring').style.setProperty('--ry', ry + 'deg'); });
rs.addEventListener('pointerup', () => { drag = null; });
function spin() { if (!drag) { ry += vel; vel *= .95; if (Math.abs(vel) < .05 && !still) ry -= .08; $('ring').style.setProperty('--ry', ry + 'deg'); } requestAnimationFrame(spin); }
$('ring').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b) return; const [id] = T[L].films[+b.dataset.f]; $('vv').src = `media/studio/${id}-${L}.mp4`; $('viewer').hidden = false; $('vv').play().catch(() => {}); });
$('vx').addEventListener('click', () => { $('vv').pause(); $('viewer').hidden = true; });
$('viewer').addEventListener('click', (e) => { if (e.target === $('viewer')) $('vx').click(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) $('vx').click(); });

/* ---------- showreel ---------- */
function reel() { const t = T[L], v = $('reelV'); v.poster = `media/showreel-${L}.jpg`; v.src = `media/showreel-${L}.mp4`; v.muted = true; $('reelSnd').textContent = t.sound; }
$('reelSnd').addEventListener('click', () => { const v = $('reelV'), t = T[L]; v.muted = !v.muted; if (!v.muted) { v.currentTime = 0; v.play().catch(() => {}); } $('reelSnd').textContent = v.muted ? t.sound : t.mute; });

/* ---------- services answered as replies ---------- */
$('graph').addEventListener('click', (e) => {
  const b = e.target.closest('[data-s]'); if (!b) return; const x = SV[b.dataset.s], t = T[L]; if (!x) return;
  document.querySelectorAll('.node li button').forEach((o) => o.classList.toggle('on', o === b));
  $('svcR').innerHTML = `<div class="reply"><span class="av"><img src="media/tamm-cut.webp" alt=""></span><div class="bub"><b>${esc(k(x.s.name))}</b><p>${esc(k(x.s.summary))}</p><button type="button" data-ask="${esc(x.s.name.en)}">${esc(t.svcGo)}</button></div></div>`;
});
$('svcR').addEventListener('click', (e) => { const b = e.target.closest('[data-ask]'); if (!b) return; const x = SV[b.dataset.ask], q = T[L].svcAsk(k(x.s.name)); $('pin').value = q; ask(q, HINT[b.dataset.ask]); });

/* ---------- the composer ---------- */
$('brief').addEventListener('submit', (e) => {
  e.preventDefault(); const t = T[L], n = $('fn').value.trim();
  if (!n) { $('fn').setCustomValidity(t.need); $('fn').reportValidity(); return; }
  const msg = t.mailT({ n, c: $('fc').value.trim(), g: $('fg').value.trim(), m: $('fm').value.trim() });
  $('moutT').textContent = msg; $('mOpen').href = `mailto:info@saytamm.com?subject=${encodeURIComponent(t.subj)}&body=${encodeURIComponent(msg)}`; $('mCopy').textContent = t.mCopy; $('mout').hidden = false;
});
$('fn').addEventListener('input', () => $('fn').setCustomValidity(''));
$('mCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('moutT').textContent); $('mCopy').textContent = T[L].copied; } catch (e) { const r = document.createRange(); r.selectNodeContents($('moutT')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } });
function toStart(q) { const t = T[L]; if (q) { $('fg').value = q; if (!$('fm').value.trim()) $('fm').value = t.fromAdv; } $('start').scrollIntoView({ behavior: still ? 'auto' : 'smooth' }); setTimeout(() => $('fn').focus({ preventScroll: true }), still ? 0 : 700); }

/* ---------- dock + corner Tamm ---------- */
const GO = { ask: 'top', services: 'services', work: 'work', numbers: 'numbers', clients: 'clients', start: 'start' };
$('dock').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (!b) return; const id = b.dataset.go;
  if (id === 'ask') { scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' }); setTimeout(() => $('pin').focus({ preventScroll: true }), still ? 0 : 600); } else $(GO[id]).scrollIntoView({ behavior: still ? 'auto' : 'smooth' }); });
$('miniBtn').addEventListener('click', () => { scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' }); setTimeout(() => $('pin').focus({ preventScroll: true }), still ? 0 : 600); });

/* ---------- magnetic buttons (site) ---------- */
if (fine && !still) document.addEventListener('pointermove', (e) => {
  const b = e.target.closest && e.target.closest('.mag'); document.querySelectorAll('.mag.pull').forEach((o) => { if (o !== b) { o.classList.remove('pull'); o.style.transform = ''; } });
  if (!b) return; const r = b.getBoundingClientRect(); b.classList.add('pull'); b.style.transition = 'transform .15s'; b.style.transform = `translate(${((e.clientX - r.left) / r.width - .5) * 10}px, ${((e.clientY - r.top) / r.height - .5) * 8}px)`;
});

/* ---------- scroll: reveals, counters, bars, plane, reel, the blade, the dock, corner Tamm ---------- */
let seen = new WeakSet(), tk = false, cur = '';
function countUp(el) {
  const s = el.dataset.count, m = s.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/); if (!m || still) return;
  const raw = m[2].replace(/,/g, ''), dec = (raw.split('.')[1] || '').length, end = parseFloat(raw), t0 = performance.now();
  const f = (now) => { const u = Math.min(1, (now - t0) / 1300), v = end * (1 - Math.pow(2, -10 * u)); let n = v.toFixed(dec); if (m[2].includes(',')) n = Number(n).toLocaleString('en-US', { minimumFractionDigits: dec }); el.textContent = u >= 1 ? s : m[1] + n + m[3]; if (u < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const SECS = ['ask', 'who', 'services', 'work', 'numbers', 'clients', 'start'];
function tick() {
  tk = false; const vh = innerHeight, t = T[L];
  document.querySelectorAll('.rv').forEach((el) => { if (el.getBoundingClientRect().top < vh * .92) el.classList.add('on'); });
  document.querySelectorAll('[data-count]').forEach((el) => { if (!seen.has(el) && el.getBoundingClientRect().top < vh * .85) { seen.add(el); countUp(el); } });
  document.querySelectorAll('.tr i').forEach((el) => { if (el.getBoundingClientRect().top < vh * .9) el.style.width = el.dataset.w + '%'; });
  const pl = $('plane').getBoundingClientRect(); $('plane').classList.toggle('flat', pl.top < vh * .45);
  if ($('wipe').getBoundingClientRect().top < vh * .85) $('wipe').classList.add('on');
  const rb = $('reelBox').getBoundingClientRect(), v = $('reelV'), u = Math.min(1, Math.max(0, 1 - rb.top / vh));
  $('reelBox').style.setProperty('--rs', (1.12 - u * .12).toFixed(3));
  if (!still) { if (rb.top < vh * .7 && rb.bottom > vh * .2) { if (v.paused) v.play().catch(() => {}); } else if (!v.paused && v.muted) v.pause(); }
  const hb = $('top').getBoundingClientRect(), on = hb.bottom > 80; if (on && !heroOn && !still) { heroOn = true; requestAnimationFrame(loop); } heroOn = on;
  const docH = document.documentElement.scrollHeight - vh; document.documentElement.style.setProperty('--p', docH > 0 ? (scrollY / docH).toFixed(4) : 0);
  let s = ''; for (const id of SECS) if ($(id).getBoundingClientRect().top < vh * .5) s = id;
  if (on) s = '';
  $('mini').classList.toggle('on', !on && s !== 'start' && $('viewer').hidden);
  document.querySelector('.nav').classList.toggle('solid', scrollY > 30);
  if (s !== cur) { cur = s; document.querySelectorAll('.dock button').forEach((b) => b.classList.toggle('on', s && (GO[b.dataset.go] === s || (b.dataset.go === 'ask' && s === 'ask')))); if (s && !busy) miniSay(t.tips[s]); }
}
addEventListener('scroll', () => { if (!tk) { tk = true; requestAnimationFrame(tick); } }, { passive: true });

/* ---------- wiring ---------- */
$('pf').addEventListener('submit', (e) => { e.preventDefault(); ask($('pin').value); });
$('chips').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { $('pin').value = b.textContent; ask(b.textContent); } });
$('bd').addEventListener('click', async (e) => {
  const f = e.target.closest('.fq'); if (f) { $('pin').value = f.textContent; ask(f.textContent); return; }
  const g = e.target.closest('.go'); if (g) { toStart(g.dataset.q); return; }
  const c = e.target.closest('.cp'); if (!c) return;
  try { await navigator.clipboard.writeText(plain(ansText) + '\n\ninfo@saytamm.com'); c.textContent = T[L].copied; } catch (err) { const r = document.createRange(); r.selectNodeContents($('bd')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
});
$('stop').addEventListener('click', () => { if (busy) busy.abort(); });
$('lang').addEventListener('click', () => { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('mx-lang', L); } catch (e) {} render(); });

/* ---------- start-up: once per visit ---------- */
let booted = false; try { booted = sessionStorage.getItem('mx-boot') === '1'; sessionStorage.setItem('mx-boot', '1'); } catch (e) {}
const bootEl = $('boot');
if (still || booted) { bootEl.remove(); document.documentElement.style.setProperty('--d0', '.1s'); }
else { document.documentElement.style.setProperty('--d0', '1.45s'); document.documentElement.style.setProperty('--d1', '1.5s'); setTimeout(() => { bootEl.classList.add('out'); setTimeout(() => bootEl.remove(), 450); }, 1300); }

size(); render(); field(); if (!still) { requestAnimationFrame(loop); requestAnimationFrame(spin); }
</script>
