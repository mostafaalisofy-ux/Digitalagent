<style>
/* Option D, «Tamm OS»: the agency as an operating system. A desktop on obsidian; every section is an app in a window
   (draggable on desktop, a full-screen sheet on phones). Deliberately one look, dark, in the brand palette:
   Obsidian ground, Graphite windows, Soft White ink, Muted secondary, Electric Purple for focus and the blade only. */
:root {
  --ob: #09090D; --gr: #17171E; --gr2: #20202A; --ink: #F5F3FA; --mu: #96939F; --line: rgb(245 243 250 / .1); --line2: rgb(245 243 250 / .18);
  --pu: #6C35FF; --pi: #A78BFA;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ob); color: var(--ink); font: 400 15px/1.6 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pu); outline-offset: 2px; border-radius: 8px; }

/* wallpaper: the blade, huge, and the line in outline */
.desk { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 80% 10%, #16141f 0, var(--ob) 60%); }
.desk::before { content: ""; position: absolute; width: 22vmin; height: 170vmax; inset-inline-end: 18vw; top: -40vmax; background: linear-gradient(var(--pu), #3b1d99); border-radius: 6vmin; transform: rotate(45deg); opacity: .9; }
.wall { position: absolute; inset-inline-start: max(28px, env(safe-area-inset-left, 0px)); bottom: 84px; font-weight: 700; font-size: clamp(64px, 13vw, 210px); line-height: .9; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.5px rgb(245 243 250 / .14); pointer-events: none; white-space: nowrap; }
[dir="rtl"] .wall { letter-spacing: 0; line-height: 1.15; }

/* top bar */
.bar { position: fixed; inset: 0 0 auto; z-index: 100002; height: calc(34px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; background: rgb(9 9 13 / .72); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); font-size: 13px; }
.bar img { height: 18px; width: auto; }
.bar b { font-weight: 700; }
.bar .sp { flex: 1; }
.bar button { background: none; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: 12.5px; }
.bar .clock { font-variant-numeric: tabular-nums; color: var(--mu); direction: ltr; }

/* desktop icons */
.icons { position: fixed; top: 54px; inset-inline-start: max(18px, env(safe-area-inset-left, 0px)); z-index: 5; display: grid; grid-auto-flow: column; grid-template-rows: repeat(5, 104px); gap: 6px 14px; }
.ico { width: 96px; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 8px 4px; border-radius: 14px; color: var(--ink); }
.ico:hover, .ico:focus-visible { background: rgb(245 243 250 / .07); }
.ico .g { width: 54px; height: 54px; border-radius: 15px; background: var(--gr2); border: 1px solid var(--line2); display: grid; place-items: center; position: relative; overflow: hidden; box-shadow: 0 10px 24px rgb(0 0 0 / .35); }
.ico .g svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico .g.hot { background: var(--pu); border-color: var(--pu); }
.ico span { font-size: 12.5px; line-height: 1.25; text-align: center; text-shadow: 0 1px 6px #000; }

/* dock */
.dock { position: fixed; z-index: 100001; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; border-radius: 22px; background: rgb(23 23 30 / .78); border: 1px solid var(--line2); backdrop-filter: blur(16px); }
.dock button { position: relative; width: 46px; height: 46px; border-radius: 13px; border: 1px solid var(--line2); background: var(--gr2); cursor: pointer; display: grid; place-items: center; transition: transform .18s; }
.dock button:hover { transform: translateY(-6px) scale(1.12); }
.dock button svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dock button.hot { background: var(--pu); border-color: var(--pu); }
.dock button.open::after { content: ""; position: absolute; bottom: -6px; left: 50%; width: 5px; height: 5px; border-radius: 2px; background: var(--ink); transform: translateX(-50%) rotate(45deg); }
.dock .tip { position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; background: var(--gr); border: 1px solid var(--line2); padding: 3px 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.dock button:hover .tip { opacity: 1; }

/* windows */
.win { position: fixed; z-index: 100; display: flex; flex-direction: column; min-width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - 120px); background: var(--gr); border: 1px solid var(--line2); border-radius: 18px; box-shadow: 0 40px 90px rgb(0 0 0 / .55), 0 0 0 1px rgb(0 0 0 / .4); overflow: hidden; animation: open .28s cubic-bezier(.2,.9,.3,1.2); }
.win.focus { border-color: rgb(167 139 250 / .55); }
.win.min { display: none; }
@keyframes open { from { transform: scale(.92) translateY(10px); opacity: 0; } }
.tb { flex: none; display: flex; align-items: center; gap: 10px; height: 44px; padding-inline: 14px 8px; background: var(--gr2); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
.tb:active { cursor: grabbing; }
.tb .t { font-weight: 500; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb .t i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--pu); transform: rotate(45deg); margin-inline-end: 8px; }
.tb button { width: 30px; height: 30px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--mu); font-size: 18px; line-height: 1; }
.tb button:hover { background: rgb(245 243 250 / .08); color: var(--ink); }
.tb .back { display: none; }
.wb { overflow: auto; padding: 20px; min-height: 0; }
.wb h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
[dir="rtl"] .wb h2 { letter-spacing: 0; line-height: 1.4; }
.wb p { margin: 0 0 10px; color: #D8D5E0; max-width: 62ch; }
.wb .mu { color: var(--mu); font-size: 13px; }
.wb .lab { font-size: 12px; color: var(--mu); letter-spacing: .06em; margin: 16px 0 6px; }
[dir="rtl"] .wb .lab { letter-spacing: 0; }

/* about */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.facts div { background: var(--ob); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.facts b { display: block; font-size: 28px; line-height: 1.1; direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }
[dir="rtl"] .facts b { text-align: end; }
.facts div:first-child b { color: var(--pi); }
.facts span { font-size: 12px; color: var(--mu); }
.mv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mv div { background: var(--ob); border-radius: 14px; padding: 12px; border: 1px solid var(--line); }
.mv b { display: block; font-size: 12px; color: var(--pi); margin-bottom: 4px; }

/* services: two panes */
.split { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 14px; }
.side { display: grid; gap: 4px; align-content: start; }
.side button { text-align: start; border: 0; background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 14px; color: var(--mu); }
.side button[aria-selected="true"] { background: var(--ob); color: var(--ink); box-shadow: inset 3px 0 0 var(--pu); }
[dir="rtl"] .side button[aria-selected="true"] { box-shadow: inset -3px 0 0 var(--pu); }
.files { display: grid; gap: 8px; }
.file { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--ob); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.file .fi { width: 34px; height: 40px; border-radius: 6px; background: var(--gr2); border: 1px solid var(--line2); position: relative; }
.file .fi::after { content: ""; position: absolute; inset: 8px 9px auto; height: 3px; background: var(--pu); border-radius: 2px; box-shadow: 0 7px 0 var(--line2), 0 14px 0 var(--line2); }
.file b { display: block; font-size: 14.5px; }
.file span { font-size: 13px; color: var(--mu); }

/* player */
.player { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; position: relative; }
.player.v { aspect-ratio: 9 / 16; max-height: 62vh; margin: 0 auto; }
.player video { width: 100%; height: 100%; object-fit: cover; display: block; }
.ctrl { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line2); background: var(--gr2); border-radius: 999px; min-height: 38px; padding: 0 14px; cursor: pointer; font-weight: 500; font-size: 13.5px; }
.btn.pri { background: var(--pu); border-color: var(--pu); color: #fff; }
.reels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.reel { border: 0; padding: 0; background: none; cursor: pointer; text-align: start; display: grid; gap: 6px; }
.reel img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); transition: transform .2s; }
.reel:hover img { transform: translateY(-3px); }
.reel span { font-size: 12px; color: var(--mu); line-height: 1.35; }

/* sheet */
.sheet { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.sheet th, .sheet td { border: 1px solid var(--line); padding: 8px 10px; text-align: start; vertical-align: top; }
.sheet th { background: var(--gr2); font-weight: 500; color: var(--mu); font-size: 12px; position: sticky; top: 0; }
.sheet td.n { font-weight: 700; color: var(--pi); font-size: 18px; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.sheet tr { cursor: pointer; } .sheet tbody tr:hover td { background: rgb(245 243 250 / .04); }
.sheet tr.sel td { background: rgb(108 53 255 / .12); }
.tbl { overflow-x: auto; border-radius: 10px; }
.cell { background: var(--ob); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; }
.cell .fx { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--pi); direction: ltr; text-align: start; margin-bottom: 6px; }

/* gallery */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.gal div { aspect-ratio: 4 / 3; background: #fff; border-radius: 10px; display: grid; place-items: center; }
.gal img { width: 72%; height: 62%; object-fit: contain; }

/* mail */
.mail { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mail label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--mu); }
.mail input, .mail textarea { border: 0; background: transparent; padding: 8px 0; outline: none; color: var(--ink); min-width: 0; }
.mail textarea { min-height: 120px; resize: vertical; padding: 12px; border-bottom: 1px solid var(--line); }
.mail .to { direction: ltr; unicode-bidi: isolate; color: var(--ink); user-select: all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.chips button { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--ob); }
.mail .foot { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
.out { white-space: pre-wrap; font-size: 13.5px; background: var(--ob); border-radius: 10px; padding: 10px; margin-top: 10px; border: 1px dashed var(--line2); }

/* Tamm, the assistant */
.tamm { position: fixed; z-index: 60; bottom: 76px; inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-end; gap: 8px; pointer-events: none; }
.tamm img { width: 92px; height: auto; filter: drop-shadow(0 16px 22px rgb(0 0 0 / .5)); pointer-events: auto; cursor: pointer; animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.tamm .say { max-width: 240px; background: var(--ink); color: var(--ob); border-radius: 16px; padding: 10px 14px; font-weight: 500; font-size: 13.5px; line-height: 1.4; pointer-events: auto; box-shadow: 0 14px 30px rgb(0 0 0 / .4); animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
.tamm .say b { color: var(--pu); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }

/* boot */
.boot { position: fixed; inset: 0; z-index: 2000; background: var(--ob); display: grid; place-items: center; transition: opacity .4s; }
.boot.out { opacity: 0; pointer-events: none; }
.boot .in { display: grid; justify-items: center; gap: 22px; }
.boot img { height: 96px; animation: pop .7s cubic-bezier(.2,1.4,.4,1); }
.boot .pb { width: 180px; height: 4px; border-radius: 4px; background: var(--gr2); overflow: hidden; }
.boot .pb i { display: block; height: 100%; width: 0; background: var(--pu); animation: load 1.2s .2s ease forwards; }
@keyframes load { to { width: 100%; } }
.boot small { color: var(--mu); font-size: 13px; }

/* phones: a home screen, apps open as sheets */
@media (max-width: 760px) {
  .icons { inset-inline: max(14px, env(safe-area-inset-left, 0px)); top: 58px; grid-auto-flow: row; grid-template-rows: none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 4px; }
  .ico { width: auto; }
  .wall { font-size: 21vw; bottom: 120px; }
  .win { inset: calc(34px + env(safe-area-inset-top, 0px)) 0 0 0 !important; width: auto !important; height: auto !important; max-width: none; max-height: none; border-radius: 18px 18px 0 0; animation: sheet .3s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
  .tb { cursor: default; } .tb .back { display: grid; } .tb .mn { display: none; }
  .split { grid-template-columns: minmax(0, 1fr); } .side { grid-auto-flow: column; overflow-x: auto; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mv { grid-template-columns: minmax(0, 1fr); }
  .reels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tamm img { width: 70px; } .tamm .say { max-width: 200px; font-size: 12.5px; }
  .dock button:hover { transform: none; }
  body.has-win .tamm, body.has-win .dock { display: none; }
  .sheet th:nth-child(2), .sheet td:nth-child(2), .sheet th:nth-child(3), .sheet td:nth-child(3) { display: none; }
  .win { z-index: 100003 !important; }
  .mail label { grid-template-columns: 84px 1fr; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

function chrome(id) {

  return `<div class="tb" data-drag><button class="back" type="button" data-x aria-label="${t.back}">${L === 'ar' ? '→' : '←'}</button><span class="t"><i></i>${esc(t.apps[id])}</span>

function open(id) {

  const ww = Math.min(w, vw - 24), hh = Math.min(h, vh - 130);
  const x = Math.max(12, Math.min(vw - ww - 12, (vw - ww) / 2 + (cascade % 5) * 28 - 56)), y = Math.max(46, Math.min(vh - hh - 80, 70 + (cascade % 5) * 26));
  cascade++;
  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px' });
  el.innerHTML = chrome(id); $('wins').append(el); W[id] = el; wire(el); focus(el); dock();
  if (id === 'mail') tamm(2);
}
function close(id) { const el = W[id]; if (!el) return; el.querySelectorAll('video').forEach((v) => v.pause()); el.remove(); delete W[id]; if (id === 'studio') film = null; dock(); }
function focus(el) { document.querySelectorAll('.win').forEach((w) => w.classList.remove('focus')); el.classList.add('focus'); el.style.zIndex = ++Z; }
function refresh(id) { const el = W[id]; if (!el) return; const wb = el.querySelector('.wb'), y = wb.scrollTop; el.innerHTML = chrome(id); wire(el); el.querySelector('.wb').scrollTop = y; }
function wire(el) {
  const id = el.dataset.app, t = T[L];
  el.addEventListener('pointerdown', () => focus(el));
  el.querySelectorAll('[data-x]').forEach((b) => b.addEventListener('click', () => close(id)));
  el.querySelector('[data-m]').addEventListener('click', () => { el.classList.add('min'); el.querySelectorAll('video').forEach((v) => v.pause()); dock(); });
  const tb = el.querySelector('[data-drag]');
  tb.addEventListener('pointerdown', (e) => {
    if (phone() || e.target.closest('button')) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop; tb.setPointerCapture(e.pointerId);
    const mv = (ev) => { el.style.left = Math.max(-el.offsetWidth + 120, Math.min(innerWidth - 120, ox + ev.clientX - sx)) + 'px'; el.style.top = Math.max(36, Math.min(innerHeight - 60, oy + ev.clientY - sy)) + 'px'; };
    const up = () => { tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); };
    tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up);
  });

  el.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => { film = +b.dataset.f; refresh(id); }));
  el.querySelector('[data-list]')?.addEventListener('click', () => { film = null; refresh(id); });
  const v = el.querySelector('.player video');
  el.querySelector('[data-sound]')?.addEventListener('click', (e) => { v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); e.currentTarget.textContent = v.muted ? t.sound : t.mute; });
  el.querySelector('[data-replay]')?.addEventListener('click', () => { v.currentTime = 0; v.play().catch(() => {}); });

  if (f) {
