<!doctype html>
<html><head><meta charset="utf-8">
<!-- SayTamm showreel v2: a goal is typed, then nine services, each with its own sample, then clients in their own words.
     Samples are shown at or below their own pixel size (never upscaled); the motion and type carry the scale. -->
<style>

</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, B = 0.5;   // 120 BPM
const T_ENTER = 4.0, CH0 = 6.0, CHL = 4.0, Q0 = 42.0, QL = 2.0, OUT0 = 50.0, LOCK = 52.6, DUR = 56.0; window.DUR_S = DUR;
const PU = '#6C35FF', OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = 'rgba(245,243,250,0.62)', LN = 'rgba(245,243,250,0.16)', MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), SEQ = '__SEQ__', NIIMEE_N = __NN__, ICONS = __ICONS__, PATHS = {}; let SYMBOL;
ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, q) => a + (b - a) * q;

// ---------- images: never drawn larger than their own pixels ----------
const CACHE = new Map(); let MISS = [];

const pic = (id) => img(`${SEQ}/img/${id}`), niimee = (t) => img(`${SEQ}/niimee/${String(Math.min(NIIMEE_N, Math.max(1, Math.floor(t * 30) + 1))).padStart(4, '0')}.jpg`);
async function loadMissing() { await Promise.all([...new Set(MISS)].map((im) => (im.complete ? null : new Promise((r) => { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); })))); }
// a sample card: width w (capped at the image's own width), top-left x,y; returns its height

  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.translate(-w / 2, -h / 2);

  ctx.save(); rr(0, 0, w, h, r); ctx.clip(); ctx.drawImage(im, 0, 0, w, h); ctx.restore();

const enter = (lt, d) => { const q = spring(lt, d, 0.5); return { q, a: clamp(q * 1.8), dy: 50 * (1 - Math.min(1, q)) }; };
function chip(s, x, y, { a = 1, fill = 'rgba(245,243,250,0.07)', color = WH, font = '600 30px Sat', rtl = false } = {}) { if (a <= 0) return 0; const w = tw(s, font) + 48; ctx.save(); ctx.globalAlpha *= a; rr(x, y, w, 60, 30); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = LN; ctx.lineWidth = 2; ctx.stroke(); txt(s, x + w / 2, y + 41, font, color, 'center', rtl); ctx.restore(); return w; }
function tile(name, x, y, s, a = 1) {
  const C = { google: ['#FFFFFF', '#4285F4'], meta: ['#FFFFFF', '#0467DF'], tiktok: ['#000000', '#FFFFFF'], snapchat: ['#FFFC00', '#000000'], youtube: ['#FFFFFF', '#FF0000'], instagram: ['ig', '#FFFFFF'], x: ['#000000', '#FFFFFF'] }[name];
  if (a <= 0 || !PATHS[name]) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  if (C[0] === 'ig') { const g = ctx.createLinearGradient(-s / 2, s / 2, s / 2, -s / 2); g.addColorStop(0, '#FEDA75'); g.addColorStop(0.35, '#FA7E1E'); g.addColorStop(0.65, '#D62976'); g.addColorStop(1, '#4F5BD5'); ctx.fillStyle = g; } else ctx.fillStyle = C[0];
  rr(-s / 2, -s / 2, s, s, s * 0.24); ctx.fill(); ctx.shadowColor = 'transparent'; const k = s * 0.56 / 24; ctx.translate(-12 * k, -12 * k); ctx.scale(k, k); ctx.fillStyle = C[1]; ctx.fill(PATHS[name]); ctx.restore();

function grid(a = 0.04) { ctx.strokeStyle = `rgba(245,243,250,${a})`; ctx.lineWidth = 1; for (let x = 60; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 60; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } }
function check(x, y, q) { ctx.save(); rr(x, y, 52, 52, 14); ctx.fillStyle = q > 0 ? PU : 'rgba(245,243,250,0.06)'; ctx.fill(); ctx.strokeStyle = LN; ctx.lineWidth = 2; ctx.stroke();
  if (q > 0) { ctx.strokeStyle = WH; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); const p = eo(q); ctx.moveTo(x + 14, y + 27); ctx.lineTo(x + 14 + 9 * Math.min(1, p * 2), y + 27 + 9 * Math.min(1, p * 2)); if (p > 0.5) ctx.lineTo(x + 23 + 16 * (p - 0.5) * 2, y + 36 - 18 * (p - 0.5) * 2); ctx.stroke(); } ctx.restore(); }

// ---------- intro: a goal is typed ----------
const GOALS = [['Launch our new model in Saudi Arabia.', 0.5, 1.7, 1.85], ['Build a brand people remember.', 2.05, 2.85, 3.0], ['Turn visits into sales.', 3.15, 3.7, 99]];
function promptBar(t, y, typed, { a = 1, cursor = true } = {}) {
  ctx.save(); ctx.globalAlpha = a; rr(70, y, 940, 130, 65); ctx.fillStyle = 'rgba(23,23,30,0.95)'; ctx.fill(); ctx.strokeStyle = 'rgba(245,243,250,0.22)'; ctx.lineWidth = 2; ctx.stroke();
  txt('say ›', 120, y + 80, `700 38px ${MONO}`, PU); const f = '600 44px Sat'; txt(typed, 250, y + 81, f, WH); if (cursor && t % 0.8 < 0.45) { ctx.fillStyle = WH; ctx.fillRect(254 + tw(typed, f), y + 40, 4, 54); } ctx.restore();
}
function intro(t) {
  if (t >= CH0) return; const out = 1 - ss(seg(t, CH0 - 0.4, CH0)); ctx.save(); ctx.globalAlpha = out; grid(0.035 * seg(t, 0, 0.6));
  if (t < T_ENTER + 0.4) {
    const g = GOALS.find(([, a, , d]) => t < d) || GOALS[2], [s, a, b, d] = g, del = t > b + 0.08 && d < 99 ? seg(t, d - 0.12, d) : 0;
    const n = Math.floor(clamp((t - a) / (b - a)) * s.length * (1 - del)); const up = eo(seg(t, T_ENTER, T_ENTER + 0.4));
    ctx.save(); ctx.globalAlpha *= 1 - seg(t, T_ENTER - 0.1, T_ENTER + 0.1); txt("What's your goal?", 540, 760, '500 40px Sat', MU, 'center'); ctx.restore();

    if (t >= T_ENTER - 0.05 && t < T_ENTER + 0.15) { ctx.fillStyle = `rgba(245,243,250,${0.5 * (1 - seg(t, T_ENTER, T_ENTER + 0.15))})`; ctx.fillRect(0, 0, W, H); }
  }

  if (t >= T_ENTER) {
    const q = spring(t, T_ENTER + 0.05, 0.5), SH = 250, SW = SH * 600 / 721, rv = eo(seg(t, T_ENTER, T_ENTER + 0.5));
    ctx.save(); ctx.globalAlpha = clamp(q * 1.6); ctx.beginPath(); ctx.rect(540 - SW / 2 - 10, 560 - SH / 2 - 10, (SW + 20) * rv, SH + 20); ctx.clip(); ctx.drawImage(SYMBOL, 540 - SW / 2, 560 - SH / 2, SW, SH); ctx.restore();
    const q2 = spring(t, T_ENTER + 0.25, 0.5); ctx.save(); ctx.globalAlpha = clamp(q2 * 1.6); txt('tamm ›', 540, 780, `700 36px ${MONO}`, PU, 'center'); txt('SayTamm', 540, 900, '700 128px Sat', WH, 'center'); txt('Showreel 2026', 540, 970, `500 36px ${MONO}`, MU, 'center'); ctx.restore();
    const q3 = spring(t, T_ENTER + 1.0, 0.45), q4 = spring(t, T_ENTER + 1.3, 0.45);
    ctx.save(); ctx.globalAlpha = clamp(q3 * 1.6); txt('Nine services.', 540, 1250, '700 96px Sat', WH, 'center'); ctx.restore();
    ctx.save(); ctx.globalAlpha = clamp(q4 * 1.6); txt('One objective.', 540, 1360, '700 96px Sat', PU, 'center'); ctx.restore();
  }
  ctx.restore();
}

// ---------- the nine services (from the profile), each with its sample ----------
const CH = [

  { n: '02', d: 'Creative & Content', title: 'Branding & Identity', desc: 'Positioning first, design second: Arabic and English developed together.', stage: stBrand },
  { n: '02', d: 'Creative & Content', title: 'Social Media Marketing', desc: 'Platform-native content and community management, measured by what it moves.', stage: stSocial },
  { n: '02', d: 'Creative & Content', title: 'Content Marketing', desc: 'Content that earns attention and moves buyers toward a decision.', stage: stContent },
  { n: '02', d: 'Creative & Content', title: 'Media Production', desc: 'Photography, video and motion, produced for the feed it will run in.', stage: stProduction },
  { n: '03', d: 'Media & Performance', title: 'Performance Marketing', desc: 'Paid search and paid social, tested and scaled against revenue, not reach.', stage: stPerformance },
  { n: '04', d: 'Digital & Technology', title: 'SEO', desc: 'Be found by buyers who are already searching, in Arabic and English.', stage: stSEO },
  { n: '04', d: 'Digital & Technology', title: 'Website Development & CRO', desc: 'Fast, bilingual websites built to turn visits into enquiries and sales.', stage: stWeb },
  { n: '04', d: 'Digital & Technology', title: 'Analytics & Growth', desc: 'Tracking you can trust, and reports that end with the next decision.', stage: stAnalytics },
];
function header(c, lt) {
  const e = enter(lt, 0.0), f = (s) => { let z = 96; while (tw(s, `700 ${z}px Sat`) > 940 && z > 60) z -= 2; return `700 ${z}px Sat`; };
  ctx.save(); ctx.globalAlpha *= e.a; ctx.translate(0, e.dy);
  txt(c.n, 70, 205, `700 34px ${MONO}`, PU); txt('· ' + c.d, 70 + tw(c.n + ' ', `700 34px ${MONO}`), 205, `500 34px ${MONO}`, MU);
  txt(c.title, 66, 318, f(c.title), WH);
  const e2 = enter(lt, 0.15); ctx.globalAlpha *= clamp(e2.q * 1.6) / Math.max(0.001, e.a) * e.a; wrap(c.desc, '500 36px Sat', 900).forEach((l, i) => txt(l, 70, 392 + i * 48, '500 36px Sat', MU));
  ctx.restore();
}
function rail(t) {
  const v = seg(t, CH0 - 0.3, CH0) * (1 - seg(t, Q0 - 0.3, Q0)); if (v <= 0) return; ctx.save(); ctx.globalAlpha = v;
  const k = Math.floor((t - CH0) / CHL), sw = (940 - 8 * 10) / 9;
  for (let i = 0; i < 9; i++) { const x = 70 + i * (sw + 10); ctx.fillStyle = 'rgba(245,243,250,0.14)'; ctx.fillRect(x, 1812, sw, 6); const p = i < k ? 1 : i > k ? 0 : seg(t, CH0 + k * CHL, CH0 + (k + 1) * CHL); ctx.fillStyle = i < k ? 'rgba(245,243,250,0.55)' : PU; ctx.fillRect(x, 1812, sw * p, 6); }
  txt('/plan services', 70, 1780, `500 28px ${MONO}`, MU); txt(`${String(clamp(k + 1, 1, 9)).padStart(2, '0')} / 09`, 1010, 1780, `600 28px ${MONO}`, WH, 'right');
  ctx.restore();
}
function services(t) {
  CH.forEach((c, i) => {
    const a = CH0 + i * CHL, b = a + CHL; if (t < a - 0.01 || t >= b) return; const lt = t - a;

}
function stStrategy(lt) {
  const items = ['Objective', 'Audience', 'Offer', 'Channels', 'The number each one must deliver'];
  items.forEach((s, i) => { const e = enter(lt, 0.3 + i * 0.22), y = 560 + i * 132; if (e.q <= 0) return;
    if (i) { const l = eo(seg(lt, 0.25 + i * 0.22, 0.5 + i * 0.22)); ctx.fillStyle = PU; ctx.fillRect(538, y - 40, 4, 40 * l); }
    ctx.save(); ctx.globalAlpha *= e.a; ctx.translate(0, e.dy); const w = 860, x = 110; rr(x, y, w, 92, 46); ctx.fillStyle = i === 4 ? PU : GR; ctx.fill(); ctx.strokeStyle = i === 0 ? PU : LN; ctx.lineWidth = i === 0 ? 4 : 2; ctx.stroke();
    txt(String(i + 1).padStart(2, '0'), x + 44, y + 60, `700 28px ${MONO}`, i === 4 ? WH : PU); txt(s, x + 110, y + 61, '700 38px Sat', WH); ctx.restore(); });
  const mk = ['Saudi Arabia', 'UAE', 'Kuwait', 'Oman', 'Egypt']; let x = 70; mk.forEach((s, i) => { const e = enter(lt, 1.6 + i * 0.1); ctx.save(); ctx.translate(0, e.dy); x += chip(s, x, 1290, { a: e.a }) + 14; ctx.restore(); });
  const e = enter(lt, 2.2); ctx.save(); ctx.globalAlpha *= e.a; txt('// market & competitor research in each market', 70, 1430, `500 30px ${MONO}`, MU); ctx.restore();
}
function stBrand(lt) {
  const e1 = enter(lt, 0.3), e2 = enter(lt, 0.55), e3 = enter(lt, 0.8), e4 = enter(lt, 1.05);
  ctx.save(); ctx.translate(0, e1.dy); card(pic('clean_manual.jpg'), 70, 540, 560, { a: e1.a }); ctx.restore();
  ctx.save(); ctx.translate(0, e2.dy); card(pic('alia_logo.jpg'), 560, 880, 450, { a: e2.a, rot: 0.025 }); ctx.restore();
  ctx.save(); ctx.translate(0, e3.dy); card(pic('clean_icons.jpg'), 70, 1000, 440, { a: e3.a, rot: -0.02 }); ctx.restore();
  ctx.save(); ctx.translate(0, e4.dy); card(pic('alia_bag.jpg'), 560, 1180, 450, { a: e4.a, rot: 0.015 }); ctx.restore();
  ['#2E7B76', '#B7835E', '#1B1B1F', '#F2EEE3', PU].forEach((c, i) => { const e = enter(lt, 1.6 + i * 0.08); ctx.save(); ctx.globalAlpha *= e.a; ctx.translate(0, e.dy); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(110 + i * 92, 1530, 34, 0, 7); ctx.fill(); ctx.strokeStyle = LN; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); });
  let x = 70; ['Logo', 'Palette', 'Type', 'Brand manual'].forEach((s, i) => { const e = enter(lt, 2.0 + i * 0.1); ctx.save(); ctx.translate(0, e.dy); x += chip(s, x, 1610, { a: e.a }) + 14; ctx.restore(); });
}
function stSocial(lt) {
  const e = enter(lt, 0.3), px = 80, py = 560, pw = 400, ph = 830;
  ctx.save(); ctx.globalAlpha *= e.a; ctx.translate(0, e.dy);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50; rr(px, py, pw, ph, 52); ctx.fillStyle = '#0E0E13'; ctx.fill(); ctx.restore(); rr(px, py, pw, ph, 52); ctx.strokeStyle = 'rgba(245,243,250,0.25)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.save(); rr(px + 14, py + 14, pw - 28, ph - 28, 40); ctx.clip(); ctx.fillStyle = '#111'; ctx.fillRect(px, py, pw, ph);
  let y = py + 70 - 520 * ss(seg(lt, 0.8, 3.6)); ['chery_a.jpg', 'chery_b.jpg', 'chery_c.jpg'].forEach((id) => { ctx.fillStyle = 'rgba(245,243,250,0.85)'; ctx.beginPath(); ctx.arc(px + 44, y + 22, 14, 0, 7); ctx.fill(); ctx.fillRect(px + 68, y + 14, 120, 14); y += 46; const h = card(pic(id), px + 14, y, pw - 28, { r: 0, shadow: false }); y += h + 10;
    ['♥', '◯', '➤'].forEach((s, k) => txt(s, px + 36 + k * 50, y + 34, '600 30px Sat', WH)); y += 60; });
  ctx.restore(); ctx.fillStyle = '#0E0E13'; rr(px + pw / 2 - 60, py + 22, 120, 30, 15); ctx.fill(); ctx.restore();
  const e2 = enter(lt, 0.6), e3 = enter(lt, 0.9);
  ctx.save(); ctx.translate(0, e2.dy); card(pic('hive_a.jpg'), 540, 590, 440, { a: e2.a, rot: 0.03 }); ctx.restore();
  ctx.save(); ctx.translate(0, e3.dy); card(pic('hive_b.jpg'), 600, 1060, 380, { a: e3.a, rot: -0.03 }); ctx.restore();
  ['instagram', 'tiktok', 'snapchat', 'x', 'youtube'].forEach((n, i) => { const q = spring(lt, 1.5 + i * 0.1, 0.4); tile(n, 130 + i * 205, 1620, 92 * lerp(0.6, 1, Math.min(1, q)), clamp(q * 1.6)); });
}
function stContent(lt) {
  const e1 = enter(lt, 0.3), e2 = enter(lt, 0.6), e3 = enter(lt, 0.75);
  ctx.save(); ctx.translate(0, e1.dy); const h = card(pic('zahid_a.jpg'), 70, 540, 940, { a: e1.a }); ctx.restore();

  ctx.save(); ctx.translate(0, e2.dy); card(pic('zahid_b.jpg'), 70, 1300, 460, { a: e2.a }); ctx.restore();
  ctx.save(); ctx.translate(0, e3.dy); card(pic('zahid_c.jpg'), 550, 1300, 460, { a: e3.a }); ctx.restore();
  let x = 70; ['Bilingual', 'One message per piece', 'Seasonal'].forEach((s, i) => { const e = enter(lt, 1.7 + i * 0.12); ctx.save(); ctx.translate(0, e.dy); x += chip(s, x, 1680, { a: e.a }) + 14; ctx.restore(); });
}
function stProduction(lt) {

  const im = niimee(2.0 + lt * 1.0); if (im) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50; rr(70, 560, 576, 720, 24); ctx.fillStyle = OB; ctx.fill(); ctx.restore(); ctx.save(); rr(70, 560, 576, 720, 24); ctx.clip(); ctx.drawImage(im, 70, 560, 576, 720); ctx.restore(); }
  ctx.fillStyle = '#E5484D'; ctx.beginPath(); ctx.arc(112, 604, 11, 0, 7); ctx.fill(); txt('REC  00:' + String(Math.floor(2 + lt)).padStart(2, '0'), 132, 614, `600 26px ${MONO}`, OB); ctx.restore();
  const e2 = enter(lt, 0.6), e3 = enter(lt, 0.85);
  ctx.save(); ctx.translate(0, e2.dy); card(pic('beauty_b.jpg'), 680, 560, 330, { a: e2.a, rot: 0.02 }); ctx.restore();
  ctx.save(); ctx.translate(0, e3.dy); card(pic('beauty_c.jpg'), 680, 1080, 330, { a: e3.a, rot: -0.02 }); ctx.restore();
  ['Motion & animated social', 'Short-form video', 'Product photography'].forEach((s, i) => { const q = enter(lt, 1.4 + i * 0.12); ctx.save(); ctx.translate(0, q.dy); chip(s, 70, 1330 + i * 80, { a: q.a }); ctx.restore(); });
}
function stPerformance(lt) {
  ['niimee_b.jpg', 'niimee_c.jpg'].forEach((id, i) => { const e = enter(lt, 0.3 + i * 0.2), x = 70 + i * 500, y = 560; ctx.save(); ctx.globalAlpha *= e.a; ctx.translate(0, e.dy);
    const win = i === 1 && lt > 2.2, pulse = win ? 1 + 0.02 * Math.sin((lt - 2.2) * 9) * (1 - seg(lt, 2.2, 3.2)) : 1;
    ctx.translate(x + 220, y + 290); ctx.scale(pulse, pulse); ctx.translate(-(x + 220), -(y + 290));
    rr(x, y, 440, 580, 26); ctx.fillStyle = GR; ctx.fill(); ctx.strokeStyle = win ? PU : LN; ctx.lineWidth = win ? 5 : 2; ctx.stroke();
    ctx.fillStyle = 'rgba(245,243,250,0.8)'; ctx.beginPath(); ctx.arc(x + 40, y + 40, 16, 0, 7); ctx.fill(); txt('niimee', x + 68, y + 38, '700 26px Sat', WH); txt('Sponsored', x + 68, y + 64, '500 22px Sat', MU);
    card(pic(id), x + 10, y + 86, 420, { r: 14, shadow: false });
    rr(x + 10, y + 516, 420, 52, 12); ctx.fillStyle = 'rgba(245,243,250,0.08)'; ctx.fill(); txt('Shop now', x + 30, y + 551, '600 26px Sat', WH); txt('›', x + 410, y + 552, '700 30px Sat', WH, 'right');
