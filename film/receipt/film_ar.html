<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
// ---------- timing (seconds) ----------
const T = {
  h0: 0.35, h1: 2.0, strike: 3.45, h2: 3.7, hookOut: 5.45,
  intro: 6.0, intro2: 7.5, introOut: 9.35,
  A: 9.8, Aout: 14.7,
  B: 15.0, Bout: 21.3,
  C: 21.6, mv: [21.85, 25.15, 28.45, 31.75], mvLen: 3.3, Cout: 34.75,
  rc: 35.0, printDur: 2.6, countAt: 3.0, barAt: 3.9, stampAt: 5.6, shrinkAt: 6.6, bigAt: 7.25, rcOut: 46.6,
  ot0: 47.0, ot: [47.8, 50.2, 52.6], otOut: 55.0,
  sum: 55.2, sumLine: 55.5, end: 59.6, num: 59.85, say: 61.3, tamm: 62.3, lock: 64.0, gulf: 64.5, DUR: 69.5,
};
const DUR = T.DUR; window.DUR_S = DUR;
const PU = '#6C35FF', OB = '#09090D', WH = '#F5F3FA', MU = 'rgba(245,243,250,0.66)', LN = 'rgba(245,243,250,0.16)';
const PAPER = '#F4F1EA', INK = '#16161C', GREY = '#6E6B75';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), SEQ = '__SEQ__', SEQN = __SEQN__; let SYMBOL;
ctx.imageSmoothingQuality = 'high';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, q) => a + (b - a) * q;
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (t, t0, d = 0.5, z = 0.55) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1.8) return 1; const w = 11, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z / Math.sqrt(1 - z * z) * Math.sin(wd * x)); };
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const F = (w, s) => `${w} ${s}px Plex`;
const hasAr = (s) => /[؀-ۿ]/.test(s);
const X = (s) => '‎' + s + '‎';   // keeps "4×" reading left to right inside Arabic
function draw1(s, x, y, font, color, align, dir) { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.direction = dir || (hasAr(s) ? 'rtl' : 'ltr'); if (ctx.direction === 'ltr') s = s.replace(/[\u200E\u200F]/g, ''); ctx.fillText(s, x, y); ctx.direction = 'ltr'; }
// Arabic lines that carry Latin or digits are laid out word by word, right to left, so "4×" and "15–20" never flip
function txt(s, x, y, font, color, align = 'right', dir) {
  if (dir || !hasAr(s) || !/[0-9A-Za-z×%]/.test(s)) return draw1(s, x, y, font, color, align, dir);
  const toks = s.split(' '), sp = tw(' ', font), ws = toks.map((k) => tw(k, font)), total = ws.reduce((a, b) => a + b, 0) + sp * (toks.length - 1);
  let xr = align === 'left' ? x + total : align === 'center' ? x + total / 2 : x;
  toks.forEach((k, i) => { draw1(k, xr, y, font, color, 'right'); xr -= ws[i] + sp; });
}
const tw = (s, font) => { ctx.font = font; return ctx.measureText(s).width; };
function wrap(s, font, maxW) { const ws = s.split(' '), out = []; let cur = ''; ws.forEach((w) => { const t = cur ? cur + ' ' + w : w; if (tw(t, font) > maxW && cur) { out.push(cur); cur = w; } else cur = t; }); if (cur) out.push(cur); return out; }
const CACHE = new Map(); let MISS = [];
function img(url) { let im = CACHE.get(url); if (im && im.complete && im.naturalWidth) return im; if (!im) { im = new Image(); im.src = url; CACHE.set(url, im); if (CACHE.size > 300) CACHE.delete(CACHE.keys().next().value); } MISS.push(im); return null; }
const clip = (name, t) => img(`${SEQ}/${name}/${String(Math.min(SEQN[name], Math.max(1, Math.floor(t * 30) + 1))).padStart(4, '0')}.jpg`);
async function loadMissing() { await Promise.all([...new Set(MISS)].map((im) => (im.complete ? null : new Promise((r) => { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); })))); }
function footage(name, t, a = 1, dim = 0.5, z = 1) { if (a <= 0) return; const im = clip(name, Math.max(0, t)); if (!im) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(540, 960); ctx.scale(z, z); ctx.drawImage(im, -540, -960, 1080, 1920); ctx.restore();
  ctx.save(); ctx.globalAlpha = a * dim; ctx.fillStyle = OB; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// a darker band where the words sit, so they read on any frame
function scrim(a, y0 = 480, y1 = 1600) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; const g = ctx.createLinearGradient(0, y0 - 200, 0, y1 + 200); g.addColorStop(0, 'rgba(9,9,13,0)'); g.addColorStop(0.25, 'rgba(9,9,13,0.72)'); g.addColorStop(0.75, 'rgba(9,9,13,0.72)'); g.addColorStop(1, 'rgba(9,9,13,0)'); ctx.fillStyle = g; ctx.fillRect(0, y0 - 200, W, y1 - y0 + 400); ctx.restore(); }
function grid(a = 0.035) { ctx.strokeStyle = `rgba(245,243,250,${a})`; ctx.lineWidth = 1; for (let x = 60; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 60; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } }
const RX = 1010;   // right margin of every text block (70 px)

// ---------- kinetic type: words rise out of a mask in reading order (right to left), then leave upwards ----------
function fit(s, w, size, max = 940) { while (size > 20 && tw(s, F(w, size)) > max) size -= 2; return size; }
function kline(s, x, y, size, t, t0, o = {}) {
  const w = o.w || 700; size = fit(s, w, size, o.max || 940); const font = F(w, size), toks = s.split(' '), sp = tw(' ', font), ws = toks.map((k) => tw(k, font));
  const total = ws.reduce((a, b) => a + b, 0) + sp * (toks.length - 1); let xr = o.align === 'center' ? x + total / 2 : x;
  const st = o.stag ?? 0.075, out = o.out ?? 1e9, pos = [];
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 1.2, W, size * 1.85); ctx.clip();
  toks.forEach((k, i) => {
    pos.push([xr - ws[i], xr]);
    const q = spring(t, t0 + i * st, o.d ?? 0.6, 0.62), qo = eio(seg(t, out + i * 0.035, out + 0.34 + i * 0.035));
    if (q > 0 && qo < 1) { ctx.save(); ctx.globalAlpha *= clamp(q * 2.2) * (o.alpha ?? 1);
      txt(k, xr, y + (1 - q) * size * 1.15 - qo * size * 1.3, font, o.hi && o.hi.includes(i) ? PU : (o.color || WH), 'right'); ctx.restore(); }
    xr -= ws[i] + sp;
  });
  ctx.restore(); return { pos, size, total };
}
function para(s, x, y, size, lh, t, t0, o = {}) { const lines = wrap(s, F(o.w || 500, size), o.max || 900); lines.forEach((l, i) => kline(l, x, y + i * lh, size, t, t0 + i * 0.22, { w: 500, color: MU, stag: 0.04, ...o })); return lines.length; }
// strike a word through, drawn right to left
function strike(p, y, size, q) { if (q <= 0) return; const [a, b] = p; ctx.save(); ctx.strokeStyle = PU; ctx.lineWidth = Math.max(8, size * 0.08); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(b + 10, y - size * 0.3); ctx.lineTo(b + 10 - (b - a + 20) * eo(q), y - size * 0.3); ctx.stroke(); ctx.restore(); }
// a receipt line as chapter label: perforation drawn right to left, label rising in, purple dot
function label(s, t, t0, out, y = 600, extra = '') {
  const q = eo(seg(t, t0, t0 + 0.6)), qo = seg(t, out, out + 0.3); if (q <= 0 || qo >= 1) return;
  ctx.save(); ctx.globalAlpha *= 1 - qo; ctx.strokeStyle = 'rgba(245,243,250,0.38)'; ctx.setLineDash([12, 9]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(RX, y + 30); ctx.lineTo(RX - 940 * q, y + 30); ctx.stroke(); ctx.setLineDash([]);
  const { total } = kline(s, RX - 30, y, 36, t, t0 + 0.08, { w: 600, color: MU, stag: 0.05 });
  ctx.fillStyle = PU; ctx.beginPath(); ctx.arc(RX - 8, y - 12, 9 * clamp(q * 1.5), 0, 7); ctx.fill();
  if (extra) txt(extra, 70, y, F(600, 34), PU, 'left');
  ctx.restore();
}
// a small mark: ✕ drawn in two strokes inside a ring
function cross(x, y, q) { if (q <= 0) return; ctx.save(); ctx.strokeStyle = WH; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.globalAlpha *= clamp(q * 2); ctx.beginPath(); ctx.arc(x, y, 26, 0, 7 * Math.min(1, q)); ctx.stroke();
  const a = eo(seg(q, 0.3, 0.7)), b = eo(seg(q, 0.6, 1)); ctx.strokeStyle = PU; ctx.beginPath(); ctx.moveTo(x + 11, y - 11); ctx.lineTo(x + 11 - 22 * a, y - 11 + 22 * a); ctx.stroke(); if (b > 0) { ctx.beginPath(); ctx.moveTo(x - 11, y - 11); ctx.lineTo(x - 11 + 22 * b, y - 11 + 22 * b); ctx.stroke(); } ctx.restore(); }

// ---------- receipts (figures from site/src/data/cases.ts) ----------
const PW = 860, PX = (W - PW) / 2, SLOT = 230, pad = 54, R0 = PW - pad, L0 = pad, IW = PW - 2 * pad;
const money = (v, q) => typeof v === 'string' ? v : `${(v.n * q).toFixed(v.dec)}${v.suf}`;
function sheet(PH, rows) {   // the paper with a torn edge, then its rows
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(PW, 0); ctx.lineTo(PW, PH);
  for (let k = 0; k <= 26; k++) ctx.lineTo(PW - k * PW / 26, PH + (k % 2 ? -14 : 0)); ctx.closePath(); ctx.fillStyle = PAPER; ctx.fill(); ctx.restore(); rows.forEach(([ry, f]) => f(ry)); }

  rr(-112, -58, 224, 116, 18); ctx.strokeStyle = PU; ctx.lineWidth = 7; ctx.stroke(); txt('تم', 24, 26, F(700, 70), PU, 'center', 'rtl'); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-84, 0); ctx.lineTo(-62, 22); ctx.lineTo(-28, -20); ctx.stroke(); ctx.restore(); }
function dashRow(line) { line(44, (Y) => { ctx.strokeStyle = 'rgba(22,22,28,0.35)'; ctx.setLineDash([10, 8]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L0, Y - 10); ctx.lineTo(R0, Y - 10); ctx.stroke(); ctx.setLineDash([]); }); }
function leader(name, val, Y, fn, fv, cv = INK) { txt(name, R0, Y, fn, INK, 'right'); txt(val, L0, Y, fv, cv, 'left'); const a = L0 + tw(val, fv) + 16, b = R0 - tw(name, fn) - 16;
  ctx.fillStyle = 'rgba(22,22,28,0.35)'; for (let x = b; x > a; x -= 12) { ctx.beginPath(); ctx.arc(x, Y - 8, 2, 0, 7); ctx.fill(); } }
// K.S Furniture, told in full
const KS = { no: '01', client: 'K.S للأثاث', meta: 'أثاث وديكور · تجارة إلكترونية · السعودية', period: 'موسم اليوم الوطني السعودي · 2024',
  items: [['Google', '40,000'], ['إنستغرام', '40,000'], ['سناب شات', '20,000']], total: '100,000 ريال',
  l2: ['إجمالي مبيعات المتجر', { n: 1.09, dec: 2, suf: ' مليون ريال' }], bar: [100000, 1086534],
  kpi: [`العائد: من ${X('4×')} إلى ${X('10×')} · المستهدف ${X('7×')}`, '507 طلبات · 15–20 طلباً يومياً', '446 عميلاً يشترون لأول مرة'],

function paperKS(x, y, lt, full = false) {
  const rows = []; let yy = 74; const line = (h, f) => { rows.push([yy, f]); yy += h; };
  line(0, (Y) => { txt(`إيصال رقم ${KS.no}`, R0, Y, F(500, 26), GREY); txt('قول تم', L0, Y, F(700, 30), INK, 'left'); }); yy += 70;
  line(52, (Y) => txt(KS.client, R0, Y, F(700, 64), INK)); line(36, (Y) => txt(KS.meta, R0, Y, F(500, 26), GREY)); line(30, (Y) => txt(KS.period, R0, Y, F(500, 26), GREY));

  line(116, (Y) => { const [s, r] = KS.bar, q = full ? 1 : eo(seg(lt, T.barAt, T.barAt + 0.8)), ws = Math.max(6, IW * s / r);
    ctx.fillStyle = 'rgba(22,22,28,0.16)'; rr(L0, Y - 6, IW, 30, 6); ctx.fill(); ctx.fillStyle = INK; rr(R0 - ws, Y - 6, ws, 30, 6); ctx.fill(); txt('المصروف', R0 - ws - 12, Y + 18, F(600, 22), GREY, 'right');
    ctx.fillStyle = PU; rr(R0 - IW * q, Y + 40, IW * q, 30, 6); ctx.fill(); if (q > 0.3) txt('المبيعات', R0 - 12, Y + 63, F(600, 22), WH, 'right'); txt('بالمقياس الحقيقي', L0, Y + 104, F(500, 20), GREY, 'left'); });

// the other three, short: who, what went in, what came back, stamp
const OT = [
  { no: '02', client: 'موريا', meta: 'عقارات · عُمان', l1: ['الإنفاق الإعلاني', '18.2 ألف دولار'], l2: ['إيرادات الوحدات المباعة', { n: 1.51, dec: 2, suf: ' مليون دولار' }], kpi: '13 وحدة مباعة', note: 'قيمة الوحدات المباعة لمشترين جاؤوا عبر الحملة.' },
  { no: '03', client: 'متاجر أزياء وتجميل', meta: 'تجارة إلكترونية · مصر · 2022', l1: ['الإنفاق · الحساب A', '535 ألف جنيه'], l2: ['قيمة المشتريات · الحساب A', { n: 7.4, dec: 1, suf: ' مليون جنيه' }], kpi: `العائد ${X('13.84×')} · 27,703 عملية شراء`, note: 'العائد وقيمة المشتريات منسوبة من Meta.' },
  { no: '04', client: 'متجر إلكترونيات', meta: 'تجارة إلكترونية · مصر · الربع الرابع 2021', l1: ['الطلبات', '747'], l2: ['قيمة المشتريات', { n: 897, dec: 0, suf: ' ألف دولار' }], kpi: 'متوسط الطلب 1,201 دولار', note: 'قيمة المشتريات منسوبة من Meta.' },
];
function paperS(c, x, y, lt, full = false) {

  line(0, (Y) => { txt(`إيصال رقم ${c.no}`, R0, Y, F(500, 26), GREY); txt('قول تم', L0, Y, F(700, 30), INK, 'left'); }); yy += 70;
  line(40, (Y) => txt(c.client, R0, Y, F(700, 60), INK)); line(30, (Y) => txt(c.meta, R0, Y, F(500, 26), GREY));
  dashRow(line); line(66, (Y) => leader(c.l1[0], c.l1[1], Y + 8, F(600, 30), F(700, 44)));

  line(112, (Y) => { const q = full ? 1 : eo(seg(lt, 0.45, 1.15)); txt(money(c.l2[1], q), R0, Y + 64, F(700, 88), INK, 'right'); });
  dashRow(line); line(46, (Y) => txt(c.kpi, R0, Y, F(700, 32), INK)); line(30, (Y) => txt(c.note, R0, Y, F(500, 23), GREY)); yy += 30;

  ctx.fillStyle = PU; ctx.beginPath(); ctx.arc(PX + 4, SLOT - 52, 8, 0, 7); ctx.fill(); txt('قول تم', PX + PW, SLOT - 40, F(600, 26), MU, 'right'); ctx.restore(); }

// ---------- 1. hook: for store owners; likes don't pay the rent, sales do ----------
function hook(t) {
  if (t >= T.hookOut + 0.6) return; const out = seg(t, T.hookOut + 0.1, T.hookOut + 0.6);
  footage('pay', t, 1 - out, 0.5, lerp(1.05, 1.0, seg(t, 0, T.hookOut))); scrim(1 - out, 560, 1320);
  label('لأصحاب المتاجر الإلكترونية', t, T.h0, T.h1 - 0.35, 600);
  kline('عندك متجر إلكتروني؟', RX, 820, 104, t, T.h0 + 0.25, { out: T.h1 - 0.3 });
  const l1 = kline('الإعجابات', RX, 830, 128, t, T.h1, { out: T.hookOut });
  kline('لا تدفع الإيجار.', RX, 980, 128, t, T.h1 + 0.2, { out: T.hookOut });
  if (t < T.hookOut) strike(l1.pos[0], 830, l1.size, seg(t, T.strike, T.strike + 0.3));
  kline('المبيعات تدفعه.', RX, 1200, 150, t, T.h2, { hi: [1], out: T.hookOut });
}
// ---------- 2. every campaign has a receipt; let's read one, line by line ----------
function intro(t) {
