<!doctype html>
<html><head><meta charset="utf-8"><title>Said. Done.</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; background: #09090D; overflow: hidden; }
  canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// «Said. Done.» — SayTamm services, 16:9, 120 BPM, 29 s, loops (frame 0 = last frame).
// Every scene is made out of the previous one. The cursor that types the brief tilts to 45° and becomes the blade
// (the diagonal of the SayTamm symbol); the blade becomes a path, the path's last node a dot, the dot a swatch, …
// window.seek(t) is a pure function of time; window.renderAudio() returns the score as base64 WAV.
const W = 1920, H = 1080, BEAT = 0.5, DUR = 29;
window.DUR_S = DUR;
const PU = '#6C35FF', OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = '#96939F', ED = '#0E0E13', BK = '#121218';
const RGB = { [PU]: [108, 53, 255], [OB]: [9, 9, 13], [GR]: [23, 23, 30], [WH]: [245, 243, 250], [MU]: [150, 147, 159], [ED]: [14, 14, 19], [BK]: [18, 18, 24] };
const mix = (a, b, u) => { const A = RGB[a], B = RGB[b]; u = Math.max(0, Math.min(1, u)); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',')})`; };

// ---------- canvas, buffers ----------
const CV = document.getElementById('c'), MAIN = CV.getContext('2d');
const mk = (o) => { const k = document.createElement('canvas'); k.width = W; k.height = H; return k.getContext('2d', o); };
const SCR = mk(), ACC = mk({ colorType: 'float16' }) || mk();
let c = SCR, GA = 1;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x), lerp = (a, b, u) => a + (b - a) * u, inv = (a, b, x) => clamp((x - a) / (b - a));
const eo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)), ei = (u) => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10));
const eio = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2);
const spr = (x, w = 18) => (x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x));   // critically damped: no overshoot
const E = (t, a, b, f = eo) => f(inv(a, b, t));
const along = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
const R2 = Math.SQRT1_2, N45 = [R2, R2];   // normal of the 45° blade (down-right); the blade runs up-right
const interp = (arr, a) => { const i = Math.min(arr.length - 2, Math.max(0, Math.floor(a))); return lerp(arr[i], arr[i + 1], clamp(a - i)); };

// ---------- drawing helpers ----------
const alpha = (a) => { c.globalAlpha = clamp(GA * a); };
const font = (px, w = 700, fam = 'Sat') => { c.font = `${w} ${px}px ${fam}`; };
const defLs = (px, fam) => (fam === 'Sat' && px >= 60 ? -0.02 * px : 0);
const WCACHE = new Map();
function tw(s, px, w = 700, fam = 'Sat', ls = null) {
  const L = ls === null ? defLs(px, fam) : ls, key = `${s}|${px}|${w}|${fam}|${L}`;
  if (WCACHE.has(key)) return WCACHE.get(key);
  const g = c; c = SCR; font(px, w, fam); c.letterSpacing = L + 'px'; c.direction = fam === 'Plex' ? 'rtl' : 'ltr'; const v = c.measureText(s).width - (s.length ? L : 0); c.letterSpacing = '0px'; c.direction = 'ltr'; c = g;
  WCACHE.set(key, v); return v;
}
function T(s, x, y, px, o = {}) {
  const { w = 700, col = WH, al = 'left', ls = null, fam = 'Sat', a = 1 } = o;
  if (a <= 0 || !s) return;
  const L = ls === null ? defLs(px, fam) : ls, wd = al === 'left' ? 0 : tw(s, px, w, fam, L);
  font(px, w, fam); c.letterSpacing = L + 'px'; c.direction = fam === 'Plex' ? 'rtl' : 'ltr'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = col; alpha(a);
  c.fillText(s, al === 'center' ? x - wd / 2 : al === 'right' ? x - wd : x, y);
  c.letterSpacing = '0px'; c.direction = 'ltr'; c.globalAlpha = GA;
}
function RR(x, y, w, h, r, fill, stroke, lw = 2, a = 1) {
  if (w <= 0.5 || h <= 0.5 || a <= 0) return;
  c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); alpha(a);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
  c.globalAlpha = GA;
}
function circle(x, y, r, fill, stroke, lw = 2, a = 1) {
  if (r <= 0.2 || a <= 0) return;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); alpha(a);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
  c.globalAlpha = GA;
}
function line(x1, y1, x2, y2, col, lw, a = 1, cap = 'round') {
  if (a <= 0) return;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = cap; alpha(a); c.stroke(); c.globalAlpha = GA;
}
function poly(pts, fill, stroke, lw = 2, a = 1, close = true) {
  if (a <= 0 || pts.length < 2) return;
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); if (close) c.closePath();
  alpha(a); if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
  c.globalAlpha = GA;
}
const clipRect = (x, y, w, h) => { c.beginPath(); c.rect(x, y, w, h); c.clip(); };
const clipX = (x0, x1, y0 = -50, y1 = H + 50) => clipRect(x0, y0, Math.max(0, x1 - x0), y1 - y0);
function clipHalf(k, side) {   // half-plane x + y < k (side < 0) or x + y > k (side > 0)
  const L = 9000; c.beginPath(); c.moveTo(k + L, -L); c.lineTo(-L, k + L);
  if (side < 0) c.lineTo(-L, -L); else c.lineTo(L, L);
  c.closePath(); c.clip();
}
function halfPoly(k0, k1) {   // the band k0 < x + y < k1 as a polygon (frame-sized)
  const L = 4000; return [[k0 + L, -L], [k1 + L, -L], [-L, k1 + L], [-L, k0 + L]];
}
function blade(x1, y1, x2, y2, th, col = PU, a = 1) { line(x1, y1, x2, y2, col, th, a, 'round'); }
function cursorBar(cx, cy, ang, len, th, col = PU, a = 1) {   // a rounded bar centred on (cx, cy); ang 0 = vertical, π/4 = blade
  const dx = Math.sin(ang), dy = -Math.cos(ang), h = Math.max(0, len / 2 - th / 2);
  line(cx - dx * h, cy - dy * h, cx + dx * h, cy + dy * h, col, th, a, 'round');
}
let SYMBOL = null;
function sym(cx, top, h, a = 1) { if (a <= 0) return; alpha(a); const w = (h * 600) / 721; c.drawImage(SYMBOL, cx - w / 2, top, w, h); c.globalAlpha = GA; }
function heart(cx, cy, s, col) {
  if (s <= 0.5) return;
  c.beginPath(); c.moveTo(cx, cy + 0.36 * s);
  c.bezierCurveTo(cx - 0.62 * s, cy - 0.04 * s, cx - 0.34 * s, cy - 0.58 * s, cx, cy - 0.22 * s);
  c.bezierCurveTo(cx + 0.34 * s, cy - 0.58 * s, cx + 0.62 * s, cy - 0.04 * s, cx, cy + 0.36 * s);
  alpha(1); c.fillStyle = col; c.fill(); c.globalAlpha = GA;
}
function tri(x, y, s, col, a = 1) { poly([[x - s * 0.36, y - s * 0.5], [x - s * 0.36, y + s * 0.5], [x + s * 0.5, y]], col, null, 0, a); }
function check(x, y, s, col, lw, u = 1) {   // a tick drawn on with u
  const p = [[x, y], [x + s * 0.36, y + s * 0.36], [x + s, y - s * 0.5]];
  const L1 = Math.hypot(s * 0.36, s * 0.36), L2 = Math.hypot(s * 0.64, s * 0.86), d = (L1 + L2) * u;
  const pts = [p[0]];
  if (d <= L1) pts.push(along(p[0], p[1], d / L1)); else { pts.push(p[1]); pts.push(along(p[1], p[2], (d - L1) / L2)); }
  poly(pts, null, col, lw, 1, false);
}
function arrow(x, y, dir, s, col, lw) {   // dir +1 up, -1 down
  line(x, y + dir * s / 2, x, y - dir * s / 2, col, lw);
  line(x - s * 0.32, y - dir * (s / 2 - s * 0.32), x, y - dir * s / 2, col, lw);
  line(x + s * 0.32, y - dir * (s / 2 - s * 0.32), x, y - dir * s / 2, col, lw);
}

// ---------- end title (frame 0 = last frame) ----------
const ET = { top: 180, symH: 150, say: 550, tamm: 710, ar: 820, sub: 900, px: 150 };
const AR = 'قول. تم.', SUB = 'A digital marketing & performance agency  ·  saytamm.com';
const arLine = () => T(AR, 960, ET.ar, 42, { w: 600, fam: 'Plex', col: MU, al: 'center' });
const subLine = () => T(SUB, 960, ET.sub, 24, { w: 500, col: MU, al: 'center', ls: 1.2 });
let W_AR = 0, W_SUB = 0;
function endTitle(t) {
  if (t < 28.0) return;
  T('Say it.', 960, ET.say, 150, { col: WH, al: 'center' });
  T('Tamm it.', 960, ET.tamm, 150, { col: PU, al: 'center' });
  const u = E(t, 28.0, 28.42, eo);   // the symbol returns down its own diagonal
  sym(960 + 520 * (1 - u), ET.top - 520 * (1 - u), ET.symH);
  const ua = E(t, 28.25, 28.45, eio);   // Arabic: revealed right to left
  if (ua > 0) { c.save(); clipX(960 + W_AR / 2 + 6 - (W_AR + 12) * ua, 960 + W_AR / 2 + 6); arLine(); c.restore(); }
  const us = E(t, 28.5, 28.66, eio);
  if (us > 0) { c.save(); clipX(960 - W_SUB / 2 - 6, 960 - W_SUB / 2 - 6 + (W_SUB + 12) * us); subLine(); c.restore(); }
}

// ---------- bar 1 · hook: the brief (0–2) ----------
const TP = 120, TY = 600, GROW = 'Grow our sales.', SAY = 'Say it.';
let TX = 0, W_GROW = 0, W_LAB = 0;
const CUT = [942, 558];   // the cut point, on the line x + y = 1500 (through the frame centre)
function lineState(t) {
  if (t < 0.5) {
    const u = E(t, 0.05, 0.45, eio);
    return { s: SAY, x: lerp(960 - tw(SAY, 150) / 2, TX, u), y: lerp(ET.say, TY, u), px: lerp(150, TP, u) };
  }
  let s = '';
  if (t < 0.85) s = SAY.slice(0, Math.max(0, 7 - Math.floor((t - 0.5) / 0.05 + 1)));
  else if (t >= 1.0) s = GROW.slice(0, Math.min(15, Math.floor((t - 1.0) / 0.028) + 1));
  return { s, x: TX, y: TY, px: TP };
}
function briefGroup(t, L) {
  if (t >= 0.45) { const u = E(t, 0.45, 0.66, eo); c.save(); clipX(TX - 4, TX - 4 + (W_LAB + 10) * u); T('THE BRIEF', TX, TY - 170, 22, { w: 500, col: MU, ls: 4 }); c.restore(); }
  if (t >= 0.5) { const u = E(t, 0.5, 0.82, eo); line(TX, TY + 52, TX + W_GROW * u, TY + 52, MU, 2, 0.45, 'butt'); }
  T(L.s, L.x, L.y, L.px, { col: WH });
}
function hook(t) {
  if (t >= 2.0) return;
  if (t < 0.42) { const u = E(t, 0, 0.4, ei); sym(960 + 760 * u, ET.top - 760 * u, ET.symH); }   // the symbol leaves up its diagonal
  if (t < 0.24) {
    const u = E(t, 0, 0.22, eio);
    c.save(); clipX(lerp(960 - W_AR / 2 - 6, 960 + W_AR / 2 + 6, u), 960 + W_AR / 2 + 6); arLine(); c.restore();
    c.save(); clipX(lerp(960 - W_SUB / 2 - 6, 960 + W_SUB / 2 + 6, u), 960 + W_SUB / 2 + 6); subLine(); c.restore();
  }
  if (t < 0.32) {   // "Tamm it." squeezes into the cursor
    const u = E(t, 0, 0.3, eio);
    c.save(); c.translate(960, ET.tamm - 52); c.scale(Math.max(0.002, 1 - u), 1 + 0.1 * u); T('Tamm it.', 0, 52, 150, { col: PU, al: 'center' }); c.restore();
  }
  const L = lineState(t);
  if (t < 1.75) briefGroup(t, L);
  else {   // the cut: the two halves separate across the blade
    const s = 26 * E(t, 1.75, 1.86, eo) + 1150 * E(t, 1.8, 2.0, ei);
    c.save(); c.translate(-s * N45[0], -s * N45[1]); clipHalf(1500, -1); briefGroup(t, L); c.restore();
    c.save(); c.translate(s * N45[0], s * N45[1]); clipHalf(1500, 1); briefGroup(t, L); c.restore();
  }
  // the cursor → the blade
  const endX = (st) => st.x + (st.s ? tw(st.s, st.px) : 0) + 14 + 5;
  let cx, cy, ang = 0, len = 118, th = 10, wid = 10;
  if (t < 0.5) {
    const C0 = [960, ET.tamm - 52], C1 = [endX(L), TY - 34], u = E(t, 0.22, 0.5, eio);
    cx = lerp(C0[0], C1[0], u); cy = lerp(C0[1], C1[1], u); wid = 10 * E(t, 0, 0.3, eio);
  } else if (t < 1.5) { cx = endX(L); cy = TY - 34; }
  else {
    const C1 = [TX + W_GROW + 19, TY - 34], um = E(t, 1.6, 1.75, eio);
    cx = lerp(C1[0], CUT[0], um); cy = lerp(C1[1], CUT[1], um);
    ang = (Math.PI / 4) * spr(t - 1.5, 30);
    len = lerp(118, 170, spr(t - 1.5, 30)) + 1630 * E(t, 1.62, 1.8, eo);
    th = lerp(10, 16, E(t, 1.6, 1.75));
  }
  if (t < 0.3) RR(cx - wid / 2, cy - 59, wid, 118, 3, PU);
  else cursorBar(cx, cy, ang, len, t < 1.5 ? 10 : th);
}

// ---------- bar 2 · Digital Marketing Strategy (2–4) ----------
const P0 = [560, 940], MS = [[760, 740], [960, 540], [1160, 340]], P3 = [1360, 140], SLAB = ['Research', 'Position', 'Plan'];
const NODE_T = [2.05, 2.6, 3.1];
const BL0 = [CUT[0] - 636.4, CUT[1] + 636.4], BR0 = [CUT[0] + 636.4, CUT[1] - 636.4];
function strategy(t) {
  if (t < 2.0 || t >= 4.0) return;
  const uc = E(t, 2.0, 2.32, eio);
  let a = along(BL0, P0, uc), b = along(BR0, MS[0], uc);
  const th = lerp(16, 8, uc);
  if (t >= 2.5) b = along(MS[0], MS[1], E(t, 2.5, 2.72, eo));
  if (t >= 3.0) b = along(MS[1], MS[2], E(t, 3.0, 3.22, eo));
  if (t >= 3.5) a = along(P0, MS[2], E(t, 3.5, 3.88, eio));
  const g0 = t < 2.5 ? MS[0] : b, g1 = t < 3.5 ? P3 : along(P3, MS[2], E(t, 3.5, 3.85, eio)), rev = E(t, 2.12, 2.45, eo);
  if (rev > 0 && Math.hypot(g1[0] - g0[0], g1[1] - g0[1]) > 2) {
    const e = along(g0, g1, rev); c.save(); c.setLineDash([12, 14]); line(g0[0], g0[1], e[0], e[1], MU, 3, 0.75, 'butt'); c.restore();
  }
  if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.5) blade(a[0], a[1], b[0], b[1], th);
  for (let k = 0; k < 3; k++) {   // milestones
    const s = spr(t - NODE_T[k], 22); if (s <= 0) continue;
    const p = t >= 3.5 && k < 2 && a[0] > MS[k][0] ? a : MS[k];
    circle(p[0], p[1], 22 * s * (1 - E(t, 3.6, 3.92, eio)), null, WH, 2, 0.9);
    circle(p[0], p[1], 11 * s, PU);
  }
  for (let k = 0; k < 3; k++) {
    const t0 = NODE_T[k] + 0.06; if (t < t0) continue;
    const lx = MS[k][0] + 64, by = MS[k][1] + 30, wl = tw(SLAB[k], 84);
    const u = E(t, t0, t0 + 0.32, eo), ux = E(t, 3.5, 3.7, eio);
    c.save(); clipX(lx - 8, lx - 8 + (wl + 24) * u * (1 - ux)); T(SLAB[k], lx - 46 * (1 - u), by, 84); c.restore();
  }
}

// ---------- bar 3 · Branding & Identity (4–6) ----------
const SW = [{ x: 542, col: OB, name: 'Obsidian', hex: '#09090D' }, { x: 830, col: WH, name: 'Soft White', hex: '#F5F3FA' }, { x: 1118, col: PU, name: 'Electric Purple', hex: '#6C35FF' }];
const SWW = 260, SWH = 360, SWY = 360;
function swatchRect(t, j) {
  const s = spr(t - 5.0, 18);
  if (j === 1) return [lerp(780, 830, s), SWY, lerp(360, SWW, s), SWH, lerp(40, 28, s)];
  return [lerp(830, SW[j].x, s), SWY, SWW, SWH, 28];
}
function branding(t) {
  if (t < 4.0 || t >= 6.0) return;
  if (t < 4.5) {
    const p = along(MS[2], [960, 540], E(t, 4.0, 4.34, eio)), r = lerp(11, 180, E(t, 4.04, 4.42, eo));
    circle(p[0], p[1], r, mix(PU, WH, E(t, 4.1, 4.4, eio))); return;
  }
  if (t < 5.0) { RR(780, 360, 360, 360, lerp(180, 40, spr(t - 4.5, 20)), WH); return; }
  for (const j of [0, 2, 1]) {
    const [x, y, w, h, r] = swatchRect(t, j);
    if (j === 0) RR(x, y, w, h, r, OB, MU, 2, 0.6 * E(t, 5.0, 5.2)); else RR(x, y, w, h, r, SW[j].col);
  }
  const out = E(t, 5.88, 6.0, ei);   // labels and specimens drop out just before the tiles split off
  const lu = E(t, 5.15, 5.42, eo);
  if (lu > 0) for (let j = 0; j < 3; j++) {
    const x = SW[j].x + 26, tc = j === 1 ? OB : WH;
    c.save(); clipRect(SW[j].x, 620, SWW, 92); const dy = 38 * (1 - lu) + 70 * out;
    T(SW[j].name, x, 664 + dy, 25, { w: 700, col: tc }); T(SW[j].hex, x, 694 + dy, 19, { w: 500, col: j === 1 ? MU : WH, a: j === 1 ? 1 : 0.7, ls: 1 }); c.restore();
  }
  const su = E(t, 5.5, 5.78, eo);
  if (su > 0) {
    const dy = 70 * (1 - su) + 110 * out;
    c.save(); clipRect(SW[0].x, 370, SWW, 240); T('Aa', SW[0].x + 130, 552 + dy, 168, { col: WH, al: 'center' }); c.restore();
    c.save(); clipRect(SW[1].x, 370, SWW, 240); T('أب', SW[1].x + 130, 552 + dy, 150, { fam: 'Plex', col: OB, al: 'center' }); c.restore();
    c.save(); clipRect(SW[2].x, 370, SWW, 240); T('Aa', SW[2].x + 130, 552 + dy, 168, { col: WH, al: 'center' }); c.restore();
  }
  const cu = E(t, 5.6, 5.86, eio);
  if (cu > 0) {
    const cw = tw('Arabic & English, built together.', 32, 500);
    c.save(); clipX(960 - cw / 2 - 6 + (cw + 12) * out, 960 - cw / 2 - 6 + (cw + 12) * cu, 740, 830);
    T('Arabic & English, built together.', 960, 804, 32, { w: 500, col: MU, al: 'center' }); c.restore();
  }
}

// ---------- bar 4 · Social Media Marketing (6–8) ----------
const GX = [725, 885, 1045], GY0 = 340, TS = 150, TG = 160;
const TCOL = [[GR, WH, GR], [GR, GR, WH], [WH, PU, GR], [GR, WH, GR]];
const TGL = [['play', 'dot', 'lines'], ['lines', 'play', 'dot'], ['dot', null, 'play'], ['play', 'lines', 'dot']];
const PLAT = ['Instagram', 'TikTok', 'Snapchat', 'LinkedIn', 'YouTube'];
const PHONE = { x: 700, y: 90, w: 520, h: 900, r: 56 }, PHONE_LEN = 2 * (520 + 900) - 8 * 56 + 2 * Math.PI * 56;
function tileGlyph(kind, x, y, s, col, a) {
  if (!kind || a <= 0) return;
  const cx = x + s / 2, cy = y + s / 2, k = s / 150;
  const ink = col === WH ? OB : MU;
  if (kind === 'play') tri(cx + 4 * k, cy, 40 * k, ink, a);
  if (kind === 'dot') circle(cx, cy, 22 * k, ink, null, 0, a);
  if (kind === 'lines') { RR(cx - 40 * k, cy - 22 * k, 80 * k, 9 * k, 4 * k, ink, null, 0, a); RR(cx - 40 * k, cy - 4 * k, 56 * k, 9 * k, 4 * k, ink, null, 0, a); RR(cx - 40 * k, cy + 14 * k, 68 * k, 9 * k, 4 * k, ink, null, 0, a); }
}
function social(t) {
  if (t < 6.0 || t >= 8.45) return;
  const scroll = TG * E(t, 6.5, 6.85, eio), xo = E(t, 8.0, 8.3, ei);
  // phone outline: drawn on, then off

// ---------- bar 14 · the strongest moment (26–28) ----------
function hero(t) {
  if (t < 26.0 || t >= 28.0) return;
  const s = 1150 * E(t, 26.0, 26.25, eo), kc = lerp(3060, -60, E(t, 27.5, 27.92, eio));   // open, then close
  const k0 = 1500 - s * Math.SQRT2, k1 = 1500 + s * Math.SQRT2;

    const on = (t - 26.5) % 0.25 < 0.15, sh = 1 - E(t, 27.5, 27.65, eio);

// ---------- the HUD (drawn crisp, outside the motion blur) ----------
const TICK = [[2.0, '01 / 09', 'Digital Marketing Strategy'], [4.0, '02 / 09', 'Branding & Identity'], [6.0, '03 / 09', 'Social Media Marketing'],
  [8.0, '04 / 09', 'Content Marketing'], [9.0, '05 / 09', 'Media Production'], [10.0, '06 / 09', 'Performance Marketing'], [12.0, '07 / 09', 'SEO'],
  [14.0, '08 / 09', 'Website Development & CRO'], [16.0, '09 / 09', 'Analytics & Growth'], [18.0, 'ALL NINE', 'One team'], [20.0, 'CLIENTS', 'In their words'], [23.85, '', '']];
function hud(t) {
  const on = E(t, 0.5, 0.82, eo) * (1 - E(t, 25.6, 25.86, eio));

    const bpmW = tw('120 BPM', 18, 500, 'Sat', 3);

    const b = Math.floor(t / BEAT + 1e-6) % 4;
    for (let i = 0; i < 4; i++) { const x = 1824 - bpmW - 26 - (3 - i) * 16; if (i === b) RR(x - 4, 96, 9, 9, 1.5, WH); else RR(x - 4, 96, 9, 9, 1.5, null, MU, 1.2, 0.8); }
    c.restore();
    const s = Math.floor(t + 1e-6), f = Math.floor((t - s) * 60 + 1e-6), tc = `00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
    c.save(); clipX(1828 - 120 * on, 1830); for (let i = 0; i < tc.length; i++) T(tc[i], 1824 - (tc.length - i) * 12.5 + 6, 1000, 18, { w: 500, col: MU, al: 'center' }); c.restore();

    const ui = E(t, t0, t0 + 0.3, eio), uo = E(t, t1, t1 + 0.3, eio);
    c.save(); clipRect(90, 82, 900, 30); T(num, 96, 106 + 32 * (1 - ui) - 32 * uo, 18, { w: 500, col: MU, ls: 3 }); c.restore();
    c.save(); clipRect(90, 116, 900, 66); T(name, 96, 164 + 66 * (1 - ui) - 66 * uo, 44, { col: WH }); c.restore();
  }
}

// ---------- frame ----------
const FAST = [[0, 0.46], [1.58, 2.36], [3.48, 4.46], [5.86, 6.46], [6.48, 6.88], [7.96, 8.46], [8.98, 9.42], [9.48, 9.92], [9.98, 10.46], [11.98, 12.46],
  [13.48, 13.92], [13.98, 14.46], [15.02, 15.5], [15.98, 16.46], [17.98, 18.46], [19.98, 20.46], [23.82, 26.3], [26.98, 27.2], [27.46, 28.46]];

// ---------- the score (120 BPM, A minor; a kick on every beat, a hit on every scene change, a riser into the last bar) ----------
window.renderAudio = async () => {

    const g = A.createGain(); env(g, t, att, peak, dec); route(s.connect(f).connect(g), pan); s.start(t, (t * 0.731) % 1.4); s.stop(t + att + dec + 0.05);
  }

  const clap = (t, p = 0.36) => { for (const d of [0, 0.011, 0.023]) noise(t + d, 0.012, 'bandpass', 1400, 0.9, p); noise(t + 0.03, 0.16, 'bandpass', 1250, 0.8, p * 0.8); };

  const tick = (t, p = 0.16, f = 3800) => { noise(t, 0.011, 'bandpass', f, 2.2, p); osc('square', f / 2, f / 2, t, 0.008, 0.02); };

  const CHORD = { A: [220, 261.63, 329.63], F: [174.61, 220, 261.63], C: [196, 261.63, 329.63], G: [196, 246.94, 293.66], E: [164.81, 207.65, 246.94] };
  const ROOT = { A: 55, F: 43.65, C: 65.41, G: 49, E: 41.2 };
  const PROG = ['A', 'F', 'C', 'G', 'A', 'F', 'C', 'G', 'A', 'F', 'C', 'G', 'E', 'A', 'A'];
  const stab = (t, ch, p = 0.07, dec = 0.42) => { CHORD[ch].forEach((f, i) => { for (const dt of [-0.004, 0.004]) osc('sawtooth', f * (1 + dt), f * (1 + dt), t, dec, p, 0.003, i === 0 ? -0.35 : i === 2 ? 0.35 : 0, 3400); }); };
  const bass = (t, f, p = 0.3) => { osc('sawtooth', f, f, t, 0.2, p, 0.004, 0, 700); osc('sine', f, f, t, 0.22, p * 0.9, 0.004); };
  const inGap = (t) => t >= 25.45 && t < 26.0;
  for (let b = 0; b < DUR / BEAT; b++) {
    const t = b * BEAT, bar = Math.floor(t / 2);
    if (!inGap(t) && !(t >= 26.0 && t < 26.1)) kick(t);
    if (b % 2 === 1 && !inGap(t)) clap(t);
    if (!inGap(t + 0.25) && !(t >= 25.0 && t < 26.0)) { hat(t + 0.25, 0.11); bass(t + 0.25, ROOT[PROG[bar]]); }
    if (t >= 2.0 && !(t >= 25.0 && t < 26.0)) { hat(t + 0.125, 0.045, -0.25); hat(t + 0.375, 0.045, -0.25); }
  }
  for (let k = 0; k <= 12; k++) stab(2 * k, PROG[k], k === 0 ? 0.05 : 0.075); stab(9.0, 'F', 0.045, 0.3);

  for (let i = 0; i < 15; i++) tick(1.0 + i * 0.028, 0.15, 4200);
  for (let i = 0; i < 18; i++) tick(12.5 + i * 0.0222, 0.12, 4600);

  for (const t of [3.5, 5.0, 8.5, 9.5, 13.5]) whoosh(t, 0.3, 500, 2600, 0.12);
  whoosh(19.98, 0.32, 600, 5200, 0.26);
  for (const t of [21, 22, 23]) { tick(t, 0.16, 2200); osc('sine', 330, 330, t, 0.25, 0.08); }
  BT.forEach((t, i) => { tick(t, 0.2, 2400 + 260 * i); osc('triangle', 440 * Math.pow(2, i / 12), 440 * Math.pow(2, i / 12), t, 0.09, 0.07); });

  { const s = A.createBufferSource(); s.buffer = NB; s.loop = true; const f = A.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(380, 24); f.frequency.exponentialRampToValueAtTime(8200, 25.98);
    const g = A.createGain(); g.gain.setValueAtTime(0.0001, 24); g.gain.exponentialRampToValueAtTime(0.5, 25.97); g.gain.linearRampToValueAtTime(0, 26.0);
    s.connect(f).connect(g).connect(OUT); s.start(24); s.stop(26.01);
    const o = A.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, 24); o.frequency.exponentialRampToValueAtTime(880, 25.98);
    const lf = A.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.setValueAtTime(500, 24); lf.frequency.exponentialRampToValueAtTime(5200, 25.98);
    const og = A.createGain(); og.gain.setValueAtTime(0.0001, 24); og.gain.exponentialRampToValueAtTime(0.1, 25.97); og.gain.linearRampToValueAtTime(0, 26.0);
    o.connect(lf).connect(og).connect(OUT); o.start(24); o.stop(26.01); }
  whoosh(25.74, 0.26, 300, 6000, 0.3);

  osc('sine', 82, 30, 26.0, 1.1, 1.0); noise(26.0, 0.9, 'lowpass', 1600, 0.7, 0.42, 0.002, 0, 220); stab(26.0, 'A', 0.12, 1.3);
  for (const t of [26.25, 27.0]) { osc('sine', 150, 48, t, 0.26, 0.85); noise(t, 0.08, 'bandpass', 1900, 0.9, 0.42); }
  whoosh(27.46, 0.46, 5200, 500, 0.3);
  [220, 261.63, 329.63, 493.88].forEach((f, i) => osc('triangle', f, f, 28.0, 0.85, 0.06, 0.01, (i - 1.5) * 0.3));
  whoosh(27.98, 0.36, 3000, 600, 0.16);
  const buf = await A.startRendering();

};
