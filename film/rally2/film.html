<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The Rally v2</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; background: #09090D; overflow: hidden; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
'use strict';
// «The Rally» v2 — SayTamm, 32 s, 1080×1080, English, 120 BPM. Client vs agency, covered like a live match.
// Real footage (Pexels, hands only), the client's real phone (green screen keyed, screen tracked per frame) with a chat UI,
// a social ad whose logo literally grows, the team (hands at work and Tamm's line-up), a real approved case, the SayTamm symbol.
// Everything is computed from t inside window.seek(t).
const W = 1080, H = 1080, DUR = 32, BEAT = 0.5; window.DUR_S = DUR;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SEQ = '__SEQ__', SEQN = __SEQN__, QUADS = __QUADS__, ASSETS = '__ASSETS__', PHOTO = '__PHOTO__';
const C = { ob: '#09090D', gr: '#17171E', g2: '#211F2A', soft: '#F5F3FA', mu: '#96939F', pu: '#6C35FF', pi: '#A78BFA', ink: '#111014' };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u, seg = (t, a, b) => clamp((t - a) / (b - a));
const expo = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)), cub = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const spring = (dt, w = 17, z = 0.72) => { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt)); };
const font = (wt, px, fam = 'Sat') => `${wt} ${px}px ${fam}`;
const pad3 = (n) => String(n).padStart(3, '0');

// ---------- images ----------
const CACHE = new Map();
function load(src) { let p = CACHE.get(src); if (!p) { const im = new Image(); im.src = src; p = im.decode().then(() => im); CACHE.set(src, p); if (CACHE.size > 90) CACHE.delete(CACHE.keys().next().value); } return p; }
const frameOf = (id, lt) => Math.max(1, Math.min(SEQN[id], Math.floor(lt * 30) + 1));
const shotSrc = (id, lt) => `${SEQ}/${id}/${pad3(frameOf(id, lt))}.${QUADS[id] ? 'webp' : 'jpg'}`;
let IM = {};   // still images, loaded once

// ---------- the timeline (seconds; 120 BPM, a beat is 0.5 s) ----------
const SC = [   // [start, end, id]
  [0.0, 1.5, 'hook_court'], [1.5, 3.0, 'hook_balls'],
  [3.0, 5.0, 'p1_phone'], [5.0, 7.5, 'ad_logo'], [7.5, 8.5, 'p1_design'], [8.5, 10.0, 'ad_final'],
  [10.0, 11.5, 'p2_phone'], [11.5, 14.0, 'ad_colour'], [14.0, 16.0, 'lineup'], [16.0, 17.5, 'ab'],
  [17.5, 19.0, 'p3_phone'], [19.0, 19.5, 't_cards'], [19.5, 20.0, 't_tablet'], [20.0, 20.5, 't_camera'], [20.5, 21.0, 't_hands'],
  [21.0, 22.5, 'p3_approve'], [22.5, 24.0, 'p4_phone'], [24.0, 27.0, 'case'], [27.0, 29.0, 'pay_ball'], [29.0, 32.0, 'end'],
];
const REQ = [3.95, 10.75, 18.25, 23.25], DONE = [8.8, 16.95, 21.8, 26.0];
const POINTS = [[2.5, 'POINT 1', 'THE LOGO'], [10.0, 'POINT 2', 'THE COLOUR'], [17.5, 'POINT 3', 'THE APPROVAL'], [22.5, 'POINT 4', 'THE RESULTS']];

// ---------- camera: every shot pushes in; cuts land a touch wide and settle ----------
function shotZoom(t, s0, s1) { const lt = t - s0; return 1.0 + 0.05 * (lt / (s1 - s0)) + 0.06 * (1 - spring(lt, 14)); }

// ---------- big type ----------
// a line rises out of its own mask with a small spring and settles; it leaves upward through the same mask
function line(s, x, y, size, t, tin, tout, o = {}) {
  const pin = spring(t - tin, 16), pout = tout == null ? 0 : expo(seg(t, tout, tout + 0.22)); if (pin <= 0.001 || pout >= 1) return;
  ctx.save(); ctx.font = font(700, size, o.fam || 'Sat'); ctx.letterSpacing = o.ls ?? `${-size * 0.025}px`; ctx.textAlign = o.align || 'left'; ctx.direction = o.dir || 'ltr';
  const m = ctx.measureText(s), asc = m.actualBoundingBoxAscent, hgt = asc + m.actualBoundingBoxDescent + size * 0.18;
  ctx.beginPath(); ctx.rect(-50, y - asc - size * 0.1, W + 100, hgt); ctx.clip();
  const dy = (1 - pin) * hgt * 1.05 - pout * hgt * 1.05;
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 6; }
  ctx.fillStyle = o.color || C.soft; ctx.fillText(s, x, y + dy); ctx.restore();
}
function fitSize(lines, maxW, max) { ctx.font = font(700, 100); ctx.letterSpacing = '-2.5px'; const w = Math.max(...lines.map((s) => ctx.measureText(s).width)); ctx.letterSpacing = '0px'; return Math.min(max, Math.floor(100 * maxW / w)); }
function scrim(y0, y1, a = 0.6, down = true) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(down ? 0 : 1, 'rgba(9,9,13,0)'); g.addColorStop(down ? 1 : 0, `rgba(9,9,13,${a})`); ctx.fillStyle = g; ctx.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0)); }

// ---------- shapes ----------
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrap(c, text, maxW) { const words = text.split(' '), out = []; let cur = ''; for (const w of words) { const n = cur ? cur + ' ' + w : w; if (c.measureText(n).width > maxW && cur) { out.push(cur); cur = w; } else cur = n; } if (cur) out.push(cur); return out; }

// ---------- footage ----------
async function shot(id, t, s0, s1, o = {}) {
  const im = await load(shotSrc(id, t - s0)), z = (o.z ?? 1) * shotZoom(t, s0, s1);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); ctx.drawImage(im, 0, 0, W, H); ctx.restore();
  return z;
}
// the phone: the chat is drawn into the tracked screen (a bilinear grid of affine triangles), then the real hand on top
const UI = document.createElement('canvas'); UI.width = 720; UI.height = 1560; const ux = UI.getContext('2d');
function affine(s0, s1, s2, d0, d1, d2) {
  const [x0, y0] = s0, [x1, y1] = s1, [x2, y2] = s2, [u0, v0] = d0, [u1, v1] = d1, [u2, v2] = d2, det = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
  return [(u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / det, (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / det,
    (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / det, (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / det,
    (u0 * (x1 * y2 - x2 * y1) + u1 * (x2 * y0 - x0 * y2) + u2 * (x0 * y1 - x1 * y0)) / det, (v0 * (x1 * y2 - x2 * y1) + v1 * (x2 * y0 - x0 * y2) + v2 * (x0 * y1 - x1 * y0)) / det];
}
function warp(img, q) {
  const sw = img.width, sh = img.height, NX = 4, NY = 8, P = (u, v) => [lerp(lerp(q[0][0], q[1][0], u), lerp(q[3][0], q[2][0], u), v), lerp(lerp(q[0][1], q[1][1], u), lerp(q[3][1], q[2][1], u), v)];
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const u0 = i / NX, u1 = (i + 1) / NX, v0 = j / NY, v1 = (j + 1) / NY, a = P(u0, v0), b = P(u1, v0), c = P(u1, v1), d = P(u0, v1);
    for (const [s, dd] of [[[[u0 * sw, v0 * sh], [u1 * sw, v0 * sh], [u1 * sw, v1 * sh]], [a, b, c]], [[[u0 * sw, v0 * sh], [u1 * sw, v1 * sh], [u0 * sw, v1 * sh]], [a, c, d]]]) {
      const cx = (dd[0][0] + dd[1][0] + dd[2][0]) / 3, cy = (dd[0][1] + dd[1][1] + dd[2][1]) / 3, ex = (p) => [p[0] + (p[0] - cx) * 0.02, p[1] + (p[1] - cy) * 0.02];
      ctx.save(); ctx.beginPath(); const e0 = ex(dd[0]), e1 = ex(dd[1]), e2 = ex(dd[2]); ctx.moveTo(...e0); ctx.lineTo(...e1); ctx.lineTo(...e2); ctx.closePath(); ctx.clip();
      ctx.transform(...affine(s[0], s[1], s[2], dd[0], dd[1], dd[2])); ctx.drawImage(img, 0, 0); ctx.restore();
    }
  }
}
async function phone(id, t, s0, s1, conv) {
  const lt = t - s0, z = shotZoom(t, s0, s1), q0 = QUADS[id][frameOf(id, lt) - 1], q = q0.map(([x, y]) => [(x - W / 2) * z + W / 2, (y - H / 2) * z + H / 2]);
  const im = await load(shotSrc(id, lt));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  chatUI(t, conv); warp(UI, q);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); ctx.drawImage(im, 0, 0, W, H); ctx.restore();
}

// ---------- the chat (a dark messenger, drawn at 720×1560) ----------
const CONV = {
  p1: [{ at: 3.25, who: 'c', text: 'Hi team! Loving the new post.', type: 0.3 }, { at: 3.95, who: 'c', text: 'Small thing… can you make the logo bigger?', type: 0.35 }, { at: 4.6, who: 't', text: 'On it.' }],
  p2: [{ at: 10.2, who: 'c', text: 'Bigger looks great!', type: 0.15 }, { at: 10.75, who: 'c', text: 'Can it pop more? Maybe another colour?', type: 0.3 }, { at: 11.25, who: 't', text: 'Testing a few now.' }],
  p3: [{ at: 17.65, who: 'c', text: 'Perfect. Sending it to my manager…', type: 0.15 }, { at: 18.25, who: 'c', text: 'He wants one more change.', type: 0.3 }, { at: 18.75, who: 't', text: 'Sure. Give us an hour.' }],
  ap: [{ at: 21.05, who: 't', card: 'approve', tap: 21.6 }],
  p4: [{ at: 22.65, who: 'c', text: 'It’s live!', type: 0.12 }, { at: 23.25, who: 'c', text: 'So… results?', type: 0.3 }],
};
function chatUI(t, conv) {
  const c = ux, Wd = 720, Ht = 1560; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#0D0C12'; c.fillRect(0, 0, Wd, Ht);
  // status bar
  c.fillStyle = C.soft; c.font = font(700, 30); c.textAlign = 'left'; c.fillText('9:41', 52, 72);
  for (let i = 0; i < 4; i++) c.fillRect(560 + i * 14, 62 - i * 6, 9, 10 + i * 6); rr(c, 626, 50, 56, 26, 7); c.strokeStyle = C.soft; c.lineWidth = 2.5; c.stroke(); c.fillRect(631, 55, 40, 16);
  // header
  c.fillStyle = '#15141C'; c.fillRect(0, 100, Wd, 128); c.fillStyle = 'rgba(245,243,250,0.08)'; c.fillRect(0, 227, Wd, 1);
  c.strokeStyle = C.soft; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(56, 146); c.lineTo(38, 164); c.lineTo(56, 182); c.stroke();
  c.fillStyle = '#E9E6F2'; c.beginPath(); c.arc(124, 164, 38, 0, Math.PI * 2); c.fill(); c.fillStyle = C.ink; c.font = font(700, 28); c.textAlign = 'center'; c.fillText('CL', 124, 174);
  c.textAlign = 'left'; c.fillStyle = C.soft; c.font = font(700, 34); c.fillText('Client', 182, 158); c.fillStyle = '#8F8B9C'; c.font = font(500, 24); c.fillText('online', 182, 192);
  c.strokeStyle = C.soft; c.lineWidth = 3.5; c.beginPath(); c.arc(586, 164, 16, 0.2, Math.PI * 2 - 0.2); c.stroke(); rr(c, 628, 150, 40, 28, 7); c.stroke();
  // messages, newest at the bottom; the list scrolls with a spring as each one arrives
  const items = []; for (const m of conv) { if (m.who === 'c' && m.type && t >= m.at - m.type && t < m.at) items.push({ typing: true, at: m.at - m.type }); if (t >= m.at) items.push(m); }
  c.font = font(500, 46); let y = Ht - 150; const laid = [];
  for (let i = items.length - 1; i >= 0; i--) {
    const m = items[i]; let h;
    if (m.typing) h = 86; else if (m.card) h = 460; else { m.lines = wrap(c, m.text, 500); h = 44 + m.lines.length * 58; }
    y -= h + 18; laid.push({ m, y, h });
  }
  for (const { m, y: y0, h } of laid) {
    const a = spring(t - m.at, 20), me = m.who === 't', x = me ? Wd - 36 : 36;
    c.save(); const ox = me ? Wd - 36 : 36, oy = y0 + h; c.translate(ox, oy); c.scale(0.6 + 0.4 * a, 0.6 + 0.4 * a); c.translate(-ox, -oy); c.globalAlpha = clamp(a * 1.6);
    if (m.typing) { rr(c, 36, y0, 150, h, 40); c.fillStyle = '#26242F'; c.fill(); for (let k = 0; k < 3; k++) { const b = 0.5 + 0.5 * Math.sin((t - m.at) * 14 - k * 0.9); c.fillStyle = `rgba(245,243,250,${0.35 + 0.5 * b})`; c.beginPath(); c.arc(80 + k * 32, y0 + h / 2 - 5 * b, 9, 0, Math.PI * 2); c.fill(); } }
    else if (m.card) approveCard(c, t, m, y0, h);
    else {
      const wmax = Math.max(...m.lines.map((s) => c.measureText(s).width)) + 56, bx = me ? x - wmax : x;
      rr(c, bx, y0, wmax, h, 34); c.fillStyle = me ? C.pu : '#26242F'; c.fill();
      c.fillStyle = C.soft; m.lines.forEach((s, k) => c.fillText(s, bx + 28, y0 + 70 + k * 58));
    }
    c.restore();
  }
  // input bar
  c.fillStyle = '#15141C'; c.fillRect(0, Ht - 130, Wd, 130); rr(c, 28, Ht - 108, 560, 76, 38); c.fillStyle = '#26242F'; c.fill();
  c.fillStyle = '#7E7A8A'; c.font = font(500, 32); c.fillText('Message', 66, Ht - 58); c.fillStyle = C.pu; c.beginPath(); c.arc(646, Ht - 70, 38, 0, Math.PI * 2); c.fill();
  c.strokeStyle = C.soft; c.lineWidth = 4; c.beginPath(); c.moveTo(632, Ht - 70); c.lineTo(660, Ht - 70); c.moveTo(648, Ht - 84); c.lineTo(662, Ht - 70); c.lineTo(648, Ht - 56); c.stroke();
}
function approveCard(c, t, m, y0, h) {   // the team sends the final ad for approval; the client taps Approve
  const x = 720 - 36 - 560, w = 560; rr(c, x, y0, w, h, 34); c.fillStyle = '#1E1C26'; c.fill(); c.strokeStyle = 'rgba(245,243,250,0.12)'; c.lineWidth = 2; c.stroke();
  c.save(); rr(c, x + 20, y0 + 20, w - 40, 250, 22); c.clip(); c.fillStyle = '#EDEBF2'; c.fillRect(x + 20, y0 + 20, w - 40, 250);
  if (IM.photo) { const s = IM.photo, sw = s.width, sh = s.width * 250 / (w - 40); c.drawImage(s, 0, s.height * 0.28, sw, sh, x + 200, y0 + 20, w - 220, 250); }
  c.fillStyle = C.ink; c.fillRect(x + 20, y0 + 20, 180, 250); rr(c, x + 44, y0 + 44, 92, 34, 8); c.fillStyle = C.soft; c.fill(); c.fillStyle = C.ink; c.font = font(700, 20); c.fillText('LOGO', x + 62, y0 + 69);
  c.fillStyle = C.soft; c.font = font(700, 24); c.fillText('Pure.', x + 44, y0 + 190); c.fillText('Simple.', x + 44, y0 + 220); c.restore();
  c.fillStyle = C.soft; c.font = font(700, 34); c.fillText('Final ad · ready', x + 30, y0 + 322); c.fillStyle = '#8F8B9C'; c.font = font(500, 26); c.fillText('Say Tamm team', x + 30, y0 + 358);
  const done = t >= m.tap + 0.12, press = t >= m.tap && t < m.tap + 0.12 ? 0.95 : 1;
  c.save(); const bx = x + 30, by = y0 + 382, bw = w - 60, bh = 60; c.translate(bx + bw / 2, by + bh / 2); c.scale(press, press); c.translate(-bx - bw / 2, -by - bh / 2);
  rr(c, bx, by, bw, bh, 30); c.fillStyle = done ? '#2C2A36' : C.pu; c.fill(); c.fillStyle = C.soft; c.font = font(700, 30); c.textAlign = 'center'; c.fillText(done ? 'Approved  ✓' : 'Approve', bx + bw / 2, by + 41); c.restore();
  const r = seg(t, m.tap, m.tap + 0.4); if (r > 0 && r < 1) { c.strokeStyle = `rgba(245,243,250,${0.7 * (1 - r)})`; c.lineWidth = 4; c.beginPath(); c.arc(x + 280, y0 + 412, 20 + 90 * expo(r), 0, Math.PI * 2); c.stroke(); }
}

// ---------- the ad (a sponsored post, in a feed card) ----------
const AD = { x: 0, y: 0, w: 720, head: 70, foot: 60 };   // drawn at the origin; each scene places it (image is w × w under the header)
const CARD_H = AD.head + AD.w + AD.foot;
function place(k, top, cx = 540) { ctx.translate(cx - AD.w * k / 2, top); ctx.scale(k, k); }
function adCard(t, st) {
  const { x, y, w, head, foot } = AD, iy = y + head;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; rr(ctx, x, y, w, head + w + foot, 26); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.restore();
  // header
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(x + 42, y + 36, 22, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = C.soft; ctx.font = font(700, 20); ctx.textAlign = 'center'; ctx.fillText('Y', x + 42, y + 43);
  ctx.textAlign = 'left'; ctx.fillStyle = C.ink; ctx.font = font(700, 22); ctx.fillText(st.file || 'yourbrand', x + 76, y + 33); ctx.fillStyle = '#7A7685'; ctx.font = font(500, 17); ctx.fillText(st.sub || 'Sponsored', x + 76, y + 56);
  ctx.fillStyle = C.ink; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + w - 56 + k * 12, y + 36, 3.2, 0, Math.PI * 2); ctx.fill(); }
  // image
  ctx.save(); ctx.beginPath(); ctx.rect(x, iy, w, w); ctx.clip();
  if (st.split) {   // colour panel + product
    const pw = w * 0.42; ctx.fillStyle = st.panel; ctx.fillRect(x, iy, pw, w);
    const s = IM.photo, sw = s.width * 0.62; ctx.drawImage(s, (s.width - sw) * 0.55, s.height * 0.18, sw, sw * w / (w - pw), x + pw, iy, w - pw, w);
    const dark = st.panelDark; ctx.fillStyle = dark ? C.soft : C.ink; ctx.font = font(700, 50); ctx.letterSpacing = '-1px';
    ['Pure.', 'Simple.', 'Yours.'].forEach((s2, k) => ctx.fillText(s2, x + 36, iy + w - 210 + k * 58)); ctx.letterSpacing = '0px';
    logo(x + 36, iy + 36, 1.35, dark);
  } else {
    const s = IM.photo; ctx.drawImage(s, 0, s.height * 0.2, s.width, s.width, x, iy, w, w);
    ctx.fillStyle = C.ink; ctx.font = font(700, 54); ctx.letterSpacing = '-1.5px'; ['Pure.', 'Simple.', 'Yours.'].forEach((s2, k) => ctx.fillText(s2, x + 40, iy + w - 170 + k * 60)); ctx.letterSpacing = '0px';
    logo(x + (st.lx ?? 36), iy + (st.ly ?? 36), st.logo ?? 1, false, st.center);
  }
  ctx.restore();
  // footer
  const fy = iy + w; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.6;
  heart(x + 34, fy + 20, 22); ctx.beginPath(); ctx.arc(x + 96, fy + 31, 12, 0.6, Math.PI * 2 + 0.2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 136, fy + 22); ctx.lineTo(x + 162, fy + 31); ctx.lineTo(x + 136, fy + 40); ctx.lineTo(x + 141, fy + 31); ctx.closePath(); ctx.stroke();
  rr(ctx, x + w - 150, fy + 12, 126, 38, 19); ctx.fillStyle = C.ink; ctx.fill(); ctx.fillStyle = C.soft; ctx.font = font(700, 17); ctx.textAlign = 'center'; ctx.fillText('Shop now', x + w - 87, fy + 37); ctx.textAlign = 'left';
}
function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x + s / 2, y + s * 0.95); ctx.bezierCurveTo(x - s * 0.1, y + s * 0.55, x, y, x + s / 2, y + s * 0.28); ctx.bezierCurveTo(x + s, y, x + s * 1.1, y + s * 0.55, x + s / 2, y + s * 0.95); ctx.stroke(); }
const LOGO_W = 150, LOGO_H = 56;
function logo(x, y, k, dark, center) {   // the client's logo: a placeholder, on purpose
  const w = LOGO_W * k, h = LOGO_H * k, X = center ? x - w / 2 : x; rr(ctx, X, y, w, h, 10 * k); ctx.fillStyle = dark ? C.soft : C.ink; ctx.fill();
  ctx.fillStyle = dark ? C.ink : C.soft; ctx.font = font(700, 26 * k); ctx.letterSpacing = `${2 * k}px`; ctx.textAlign = 'center'; ctx.fillText('LOGO', X + w / 2 + k, y + h / 2 + 9.5 * k); ctx.textAlign = 'left'; ctx.letterSpacing = '0px';
  return [X, y, w, h];
}
