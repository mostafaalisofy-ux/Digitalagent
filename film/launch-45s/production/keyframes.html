<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>SayTamm launch film: keyframes F01–F06</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-400-normal.woff2); font-weight: 400; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-600-normal.woff2); font-weight: 600; }
  :root { --ob: #09090D; --gr: #17171E; --wh: #F5F3FA; --mu: #96939F; --pu: #6C35FF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ob); }
  .a { position: absolute; }
  .ar { font-family: Plex, Sat, sans-serif; direction: rtl; }
  .en { font-family: Sat, Plex, sans-serif; }
  /* burned-in caption: inside the social safe zone (y 230–1536) */
  .cap { position: absolute; left: 90px; right: 90px; top: 1388px; text-align: center; font: 500 42px/1.5 Plex, Sat, sans-serif; color: var(--wh); direction: rtl; }
  .caret { position: absolute; width: 5px; background: var(--wh); }
  /* the device surface: graphite glass, cropped macro */
  .glass { position: absolute; background: var(--gr); border: 1.5px solid rgba(245,243,250,.07); border-radius: 64px; }
  .spec { position: absolute; height: 1.5px; background: linear-gradient(90deg, rgba(245,243,250,0), rgba(245,243,250,.22) 40%, rgba(245,243,250,0)); }
  .wire { position: absolute; border: 3px dashed rgba(150,147,159,.62); }
  .bar { position: absolute; height: 18px; border-radius: 9px; background: rgba(150,147,159,.3); }
  .btn { position: absolute; height: 120px; border-radius: 60px; display: flex; align-items: center; justify-content: center; font: 700 44px/1 Sat, sans-serif; letter-spacing: .02em; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid var(--pu); }
</style>
</head>
<body>

<!-- F01 · 00:00–00:04 · the world before the decision: one caret in Obsidian -->
<section class="frame" id="F01">
  <div class="glass" style="left:300px;top:1180px;width:1100px;height:1100px;transform:rotate(-8deg);opacity:.55"></div>
  <div class="spec" style="left:330px;top:1222px;width:560px;transform:rotate(-8deg);transform-origin:0 0;opacity:.55"></div>
  <div class="caret" style="left:537px;top:880px;height:118px"></div>
</section>

<!-- F02 · 00:04–00:08 · macro, everything frozen just before the act -->
<section class="frame" id="F02">
  <div class="glass" style="left:110px;top:300px;width:1180px;height:1900px"></div>
  <div class="spec" style="left:180px;top:302px;width:700px"></div>
  <!-- an unfinished post layout: the frame is missing a side, the copy lines are half drawn -->
  <div class="wire" style="left:200px;top:420px;width:760px;height:600px;border-right-color:transparent;border-bottom-color:transparent"></div>
  <div class="bar" style="left:200px;top:1066px;width:520px"></div>
  <div class="bar" style="left:200px;top:1104px;width:330px"></div>
  <!-- the publish button, interface lights off -->
  <div class="btn en" style="left:200px;top:1180px;width:760px;border:2px solid rgba(245,243,250,.18);color:rgba(245,243,250,.42)">Publish</div>
  <!-- the fingertip is off-frame: only its shadow on the glass, hovering -->
  <div class="a" style="left:400px;top:1050px;width:420px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.82),rgba(0,0,0,.5) 45%,rgba(0,0,0,0));transform:rotate(-14deg)"></div>
  <div class="cap">قول تم.</div>
</section>

<!-- F03 · 00:08 · the first purple pulse crosses the glass and completes one act -->
<section class="frame" id="F03">
  <div class="glass" style="left:110px;top:300px;width:1180px;height:1900px"></div>
  <div class="spec" style="left:180px;top:302px;width:700px"></div>
  <!-- the layout completes on the side the pulse has already passed -->
  <div class="a" style="left:200px;top:420px;width:760px;height:600px;border:2px solid rgba(245,243,250,.85)"></div>
  <div class="a" style="left:202px;top:422px;width:756px;height:596px;background:rgba(245,243,250,.07)"></div>
  <div class="bar" style="left:200px;top:1066px;width:620px;background:rgba(245,243,250,.85)"></div>
  <div class="bar" style="left:200px;top:1104px;width:420px;background:rgba(245,243,250,.85)"></div>
  <!-- the press lands: the button lights -->
  <div class="btn en" style="left:200px;top:1180px;width:760px;background:var(--wh);color:var(--ob)">Publish</div>
  <!-- the pulse: two crisp rings from the touch point, no glow -->
  <div class="ring" style="left:415px;top:1075px;width:330px;height:330px"></div>
  <div class="ring" style="left:225px;top:885px;width:710px;height:710px;opacity:.32;border-width:2px"></div>
</section>

<!-- F04 · 00:27–00:35 · three ways to say the same result, before they unite -->
<section class="frame" id="F04">
  <svg class="a" style="left:0;top:0" width="1080" height="1920">
    <g stroke="rgba(150,147,159,.45)" stroke-width="1.5" fill="none">
      <line x1="770" y1="560" x2="540" y2="960"/>
      <line x1="300" y1="905" x2="540" y2="960"/>
      <line x1="560" y1="1240" x2="540" y2="960"/>
    </g>
  </svg>
  <div class="a ar" style="right:150px;top:340px;font-weight:600;font-size:230px;line-height:1.2;color:var(--wh)">قول</div>
  <div class="a ar" style="left:90px;top:790px;font-weight:500;font-size:150px;line-height:1.2;color:rgba(245,243,250,.72);filter:blur(1.4px)">اعتبره</div>
  <div class="a en" style="left:300px;top:1180px;font-weight:700;font-size:136px;line-height:1;letter-spacing:-.02em;color:rgba(245,243,250,.86)">Consider</div>
  <div class="a" style="left:531px;top:951px;width:18px;height:18px;border-radius:50%;background:var(--pu)"></div>
  <div class="cap">في كل لغة، في لحظة بتفصل بين الفكرة وحصولها.</div>
</section>

<!-- F05 · 00:35–00:40 · تم, the dots of the ت are the two pulses (real font, no drawing) -->
<section class="frame" id="F05">
  <div class="a ar" style="left:0;right:0;top:440px;text-align:center;font-weight:600;font-size:640px;line-height:1.4;color:var(--pu)">تم</div>
  <div class="a ar" style="left:0;right:0;top:440px;text-align:center;font-weight:600;font-size:640px;line-height:1.4;color:var(--wh)">ٮم</div>
  <div class="cap">و«تم»؟ بتفتحه على واقع جديد.</div>
</section>

<!-- F06 · 00:40–00:45 · the official end card -->
<section class="frame" id="F06">
  <img class="a" src="__SYMBOL__" style="left:372px;top:520px;height:404px;width:auto" alt="">
  <div class="a en" style="left:0;right:0;top:1030px;text-align:center;font-weight:700;font-size:104px;line-height:1;letter-spacing:-.02em;color:var(--wh)">SayTamm</div>
  <div class="a" style="left:510px;top:1182px;width:60px;height:1.5px;background:rgba(150,147,159,.6)"></div>
  <div class="a en" style="left:0;right:0;top:1228px;text-align:center;font-weight:500;font-size:46px;line-height:1;color:var(--wh)">Say it. Tamm it.</div>
  <div class="a ar" style="left:0;right:0;top:1300px;text-align:center;font-weight:500;font-size:50px;line-height:1.3;color:var(--mu)">قول. تم.</div>
</section>

</body>
</html>
