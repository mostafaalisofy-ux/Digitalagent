<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>SayTamm launch film: rebuild, "A decision travels through matter"</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-600-normal.woff2); font-weight: 600; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #09090D; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================================
//  Everything is procedural: surfaces (glass, frosted glass, paper, graphite) are generated
//  textures lit in code; type is set live in IBM Plex Sans Arabic / Satoshi; the symbol is
//  the original SVG file drawn as an image. seek(t) is stateless.
// =====================================================================================
const W = 1080, H = 1920;
const OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = '#96939F', PU = '#6C35FF';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, q) => a + (b - a) * q;
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const ei = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eio = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2);
const ss = (x) => x * x * (3 - 2 * x);
const spring = (t, t0, d) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1.6) return 1; const z = 0.8, w = 9, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z / Math.sqrt(1 - z * z) * Math.sin(wd * x)); };
const hash = (n) => { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20211), GN = 256, GRID = new Float32Array(GN * GN).map(() => R());
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const g = (i, j) => GRID[((j & 255) * GN) + (i & 255)]; const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1); const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vn(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

// ---------- textures (built once) ----------
let PAPER, GRAPH, FROST, GRAIN, SYMBOL, WALL;
function litTexture(w, h, heightFn, k, base, tint, ld = [0.82, 0.38]) {
  const c = mk(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data, hg = new Float32Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) hg[j * w + i] = heightFn(i, j);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const p = j * w + i, hx = hg[p + (i < w - 1 ? 1 : 0)] - hg[p - (i > 0 ? 1 : 0)], hy = hg[p + (j < h - 1 ? w : 0)] - hg[p - (j > 0 ? w : 0)];
    const s = clamp(base + k * (ld[0] * hx + ld[1] * hy), 0, 1.4);
    d[p * 4] = clamp(s * tint[0], 0, 255); d[p * 4 + 1] = clamp(s * tint[1], 0, 255); d[p * 4 + 2] = clamp(s * tint[2], 0, 255); d[p * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0); return c;
}
function buildTextures() {
  // paper: soft mottling + long fibres + tooth, lit by a raking light from the left
  PAPER = litTexture(540, 960, (i, j) => fbm(i / 40, j / 40, 4) * 0.8 + fbm(i / 2.6 + 50, j / 22, 2) * 0.55 + vn(i * 0.85 + 9, j * 0.85) * 0.25, 2.6, 0.86, [245, 243, 250]);
  // graphite card: same build, darker, tighter tooth
  GRAPH = litTexture(540, 960, (i, j) => fbm(i / 30 + 70, j / 30, 4) * 0.6 + vn(i * 1.1 + 3, j * 1.1) * 0.35 + fbm(i / 3 + 20, j / 3, 2) * 0.2, 2.2, 0.9, [30, 30, 38]);
  // raw plaster/concrete wall, lit by a grazing light from below (pits and trowel marks)
  WALL = litTexture(540, 960, (i, j) => fbm(i / 70 + 30, j / 70, 4) * 0.9 + fbm(i / 9 + 11, j / 9, 3) * 0.45 + Math.pow(vn(i / 2.2 + 5, j / 2.2), 6) * -1.4 + vn(i * 0.9, j * 0.9) * 0.18, 3.2, 0.7, [214, 211, 220], [0.1, -1.0]);
  // frosted glass micro-structure
  FROST = mk(270, 480); { const x = FROST.getContext('2d'), img = x.createImageData(270, 480), d = img.data; for (let p = 0; p < 270 * 480; p++) { const i = p % 270, j = (p / 270) | 0; const v = 150 + 105 * (0.55 * vn(i * 0.9, j * 0.9) + 0.45 * R()); d[p * 4] = d[p * 4 + 1] = d[p * 4 + 2] = v; d[p * 4 + 3] = 255; } x.putImageData(img, 0, 0); }
  GRAIN = mk(360, 360); { const x = GRAIN.getContext('2d'), img = x.createImageData(360, 360), d = img.data; for (let p = 0; p < 360 * 360; p++) { const v = 128 + (R() - 0.5) * 120; d[p * 4] = d[p * 4 + 1] = d[p * 4 + 2] = v; d[p * 4 + 3] = 255; } x.putImageData(img, 0, 0); }
}

// ---------- compositing helpers ----------
const HA = mk(540, 960), HB = mk(540, 960), hA = HA.getContext('2d'), hB = HB.getContext('2d');
const S = mk(W, H), sx = S.getContext('2d');
// draw something blurred, cheaply: draw at half resolution, blur there, upscale
function soft(c, blur, draw, op = 'source-over', alpha = 1) {
  hA.setTransform(1, 0, 0, 1, 0, 0); hA.globalAlpha = 1; hA.globalCompositeOperation = 'source-over'; hA.clearRect(0, 0, 540, 960); hA.save(); hA.setTransform(0.5, 0, 0, 0.5, 0, 0); draw(hA); hA.restore();
  hB.setTransform(1, 0, 0, 1, 0, 0); hB.clearRect(0, 0, 540, 960); hB.filter = `blur(${Math.max(0.01, blur / 2)}px)`; hB.drawImage(HA, 0, 0); hB.filter = 'none';
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = op; c.globalAlpha = alpha; c.drawImage(HB, 0, 0, W, H); c.restore();
}
// depth of field: blur everything away from a focus band (tilt-shift style rack focus)
function dof(c, src, focusY, sharpHalf, falloff, blur) {
  hB.setTransform(1, 0, 0, 1, 0, 0); hB.clearRect(0, 0, 540, 960); hB.filter = `blur(${blur / 2}px)`; hB.drawImage(src, 0, 0, 540, 960); hB.filter = 'none';
  hB.globalCompositeOperation = 'destination-in';
  const g = hB.createLinearGradient(0, 0, 0, 960), f0 = (focusY - sharpHalf - falloff) / H, f1 = (focusY - sharpHalf) / H, f2 = (focusY + sharpHalf) / H, f3 = (focusY + sharpHalf + falloff) / H;
  const st = (p, a) => g.addColorStop(clamp(p), `rgba(0,0,0,${a})`);
  st(0, 1); st(f0, 1); st(f1, 0); st(f2, 0); st(f3, 1); st(1, 1);
  hB.fillStyle = g; hB.fillRect(0, 0, 540, 960); hB.globalCompositeOperation = 'source-over';
  c.drawImage(src, 0, 0); c.drawImage(HB, 0, 0, W, H);
}
function finish(c, t, vig = 0.62) {
  // vignette + film grain (grain offset changes every frame, deterministic)
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createRadialGradient(540, 900, 380, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${vig})`);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const f = Math.floor(t * 30), ox = Math.floor(hash(f) * 360), oy = Math.floor(hash(f + 7) * 360);
  c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.16;
  const p = c.createPattern(GRAIN, 'repeat'); c.translate(-ox, -oy); c.fillStyle = p; c.fillRect(ox, oy, W, H);
  c.restore();
}
// razor-thin purple edge (crisp core, minimal falloff; never a glow field)
function razor(c, y, x0, x1, a = 1, tilt = 0) {
  if (x1 <= x0 || a <= 0) return;
  soft(c, 10, (h) => { h.strokeStyle = PU; h.globalAlpha = 0.55 * a; h.lineWidth = 7; h.beginPath(); h.moveTo(x0, y); h.lineTo(x1, y + tilt); h.stroke(); }, 'screen');
  c.save(); c.globalAlpha = a; c.strokeStyle = PU; c.lineWidth = 2.6; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y + tilt); c.stroke();
  c.globalAlpha = 0.55 * a; c.strokeStyle = '#B9A2FF'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(x0, y - 0.3); c.lineTo(x1, y + tilt - 0.3); c.stroke(); c.restore();
}
function capsule(c, len, r) { c.beginPath(); c.moveTo(-r, -len); c.lineTo(-r, 0); c.arc(0, 0, r, Math.PI, 0, true); c.lineTo(r, -len); c.closePath(); }
function fingertip(c, len, r) { // tapered: r at the tip, 1.22 r at the knuckle; the pad is slightly flattened
  c.beginPath(); c.moveTo(-r * 1.22, -len); c.bezierCurveTo(-r * 1.1, -len * 0.4, -r, -r * 0.6, -r, -r * 0.1);
  c.bezierCurveTo(-r, r * 0.62, -r * 0.5, r * 0.98, 0, r * 0.98); c.bezierCurveTo(r * 0.55, r * 0.98, r, r * 0.6, r, -r * 0.1);
  c.bezierCurveTo(r, -r * 0.6, r * 1.1, -len * 0.4, r * 1.22, -len); c.closePath(); }

// =====================================================================================
//  SCENE A · 00:00–08:00 · black glass: a caret under the glass, a fingertip and its reflection
// =====================================================================================
const HZ = 560, CX = 330, CY = 1270, TEXT_R = 770, TEXT_Y = 1012, FONT_T = '600 122px Plex', ANC = [540, 1140];
const TYPED = [[4.35, 'ق'], [4.55, 'قو'], [4.75, 'قول'], [6.55, 'قول ت'], [6.75, 'قول تم'], [6.92, 'قول تم.']];
function fingerDist(t) {
  if (t < 4) return lerp(400, 330, ss(seg(t, 0, 4)));
  if (t < 6.2) return lerp(330, 92, eio(seg(t, 4, 6.2)));
  if (t < 6.85) return lerp(92, 66, seg(t, 6.2, 6.85)) + 5 * Math.sin((t - 6.2) * 9); // the hover: micro-tension
  return lerp(66, 0, ei(seg(t, 6.85, 7.0)));
}
function sceneGlass(t) {
  const c = sx; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#040405'; c.fillRect(0, 0, W, H);
  const s = t < 4 ? lerp(1.0, 1.04, t / 4) : lerp(1.04, 1.32, eio(seg(t, 4, 7.0))) + 0.025 * seg(t, 7, 8);
  const camH = (h) => h.setTransform(0.5 * s, 0, 0, 0.5 * s, 0.5 * ANC[0] * (1 - s), 0.5 * ANC[1] * (1 - s));
  c.setTransform(s, 0, 0, s, ANC[0] * (1 - s), ANC[1] * (1 - s));
  // the practical light: a thin LED far behind, almost on (stutters ~3.3 s, catches on the tap)
  const I = t < 7 ? 0.32 + 0.22 * hash(Math.floor(t * 14)) * seg(t, 2.9, 3.4) * (1 - seg(t, 3.6, 3.9)) + 0.12 * seg(t, 5, 7) : 0.44 + 0.56 * eo(seg(t, 7.0, 7.5));
  const LEDY = 372;
  soft(c, 90, (h) => { camH(h); h.fillStyle = WH; h.globalAlpha = 0.22 * I; h.fillRect(180, LEDY - 60, 820, 120); }, 'screen');
  soft(c, 10, (h) => { camH(h); h.fillStyle = WH; h.globalAlpha = 0.85 * I; h.fillRect(300, LEDY - 3, 600, 6); }, 'screen');
  c.fillStyle = `rgba(245,243,250,${I})`; c.fillRect(300, LEDY - 1, 600, 2);
  // black glass: dark base, a broad sheen near the far edge, a crisp bevel
  const g = c.createLinearGradient(0, HZ, 0, H); g.addColorStop(0, '#16161C'); g.addColorStop(0.18, '#0B0B0F'); g.addColorStop(1, '#050506'); c.fillStyle = g; c.fillRect(-300, HZ, W + 600, H);
  // the LED's reflection in the glass: mirrored, stretched toward us, softer
  soft(c, 26, (h) => { camH(h); h.fillStyle = WH; h.globalAlpha = 0.5 * I; h.fillRect(300, 2 * HZ - LEDY - 4, 600, 9); }, 'screen');
  soft(c, 120, (h) => { camH(h); h.fillStyle = WH; h.globalAlpha = 0.16 * I; h.beginPath(); h.moveTo(300, HZ); h.lineTo(900, HZ); h.lineTo(1300, HZ + 700); h.lineTo(-100, HZ + 700); h.fill(); }, 'screen');
  const eg = c.createLinearGradient(0, 0, W, 0); eg.addColorStop(0, 'rgba(245,243,250,0)'); eg.addColorStop(0.5, `rgba(245,243,250,${0.25 + 0.35 * I})`); eg.addColorStop(1, 'rgba(245,243,250,0)');
  c.fillStyle = eg; c.fillRect(-200, HZ - 1, W + 400, 1.5);
  // a softbox streak sliding diagonally across the glass (second depth layer)
  soft(c, 70, (h) => { camH(h); h.fillStyle = WH; h.globalAlpha = 0.06; h.beginPath(); const o = 60 * Math.sin(t * 0.4); h.moveTo(-300, 1650 + o); h.lineTo(1400, 900 + o); h.lineTo(1400, 1010 + o); h.lineTo(-300, 1800 + o); h.fill(); }, 'screen');
  // the display under the glass: the phrase typed, the caret, foreshortened
  const last = TYPED.filter((k) => t >= k[0]).pop(), typed = last ? last[1] : '';
  c.save(); c.translate(0, TEXT_Y); c.scale(1, 0.6); c.font = FONT_T; c.direction = 'rtl'; c.textAlign = 'right';
  const tw = typed ? c.measureText(typed).width : 0, caretX = TEXT_R - tw - 16;
  if (typed) { c.fillStyle = 'rgba(245,243,250,0.92)'; c.fillText(typed, TEXT_R, 0); }
  const blink = last && t - last[0] < 0.45 ? 1 : 0.5 + 0.5 * Math.cos((t * Math.PI * 2) / 1.4);
  if (t < 7.05) { c.fillStyle = `rgba(245,243,250,${0.15 + 0.85 * ss(blink)})`; c.fillRect(caretX, -108, 6, 128); }
  c.restore();
  soft(c, 18, (h) => { camH(h); h.translate(0, TEXT_Y); h.scale(1, 0.6); h.font = FONT_T; h.direction = 'rtl'; h.textAlign = 'right'; h.fillStyle = WH; h.globalAlpha = 0.45; if (typed) h.fillText(typed, TEXT_R, 0); if (t < 7.05) h.fillRect(caretX, -108, 6, 128); }, 'screen');
  // fingertip (monochrome, lit) and its reflection; out of focus until it nearly touches
  const d = fingerDist(t), fb = lerp(2, 24, clamp(d / 500)), ang = -0.44, fr = 104;
  const drawFinger = (h, mirror) => {
    camH(h); h.translate(CX, CY); if (mirror) h.scale(1, -1); h.translate(0, -d - fr); h.rotate(ang);
    const fg = h.createLinearGradient(-fr, 0, fr, 0);
    fg.addColorStop(0, '#0A0A0C'); fg.addColorStop(0.35, '#17161B'); fg.addColorStop(0.72, '#3B3941'); fg.addColorStop(0.9, '#5A5862'); fg.addColorStop(1, '#2A2930');
    h.fillStyle = fg; fingertip(h, 1900, fr); h.fill();
    // skin tooth (very subtle), clipped to the finger
    h.save(); fingertip(h, 1900, fr); h.clip(); h.globalAlpha = 0.18; h.globalCompositeOperation = 'overlay'; h.drawImage(GRAPH, -fr * 1.3, -900, fr * 2.6, 1000); h.restore();
    // the nail plate on the upper side: glossier, with its free edge just short of the tip
    h.save(); fingertip(h, 1900, fr); h.clip();
    const ng = h.createLinearGradient(fr * 0.15, 0, fr * 1.05, 0); ng.addColorStop(0, 'rgba(245,243,250,0)'); ng.addColorStop(0.55, 'rgba(245,243,250,0.16)'); ng.addColorStop(0.85, 'rgba(245,243,250,0.38)'); ng.addColorStop(1, 'rgba(245,243,250,0.05)');
    h.fillStyle = ng; h.beginPath(); h.moveTo(fr * 0.2, -fr * 2.6); h.lineTo(fr * 0.2, -fr * 0.55); h.quadraticCurveTo(fr * 0.55, -fr * 0.05, fr * 1.05, -fr * 0.35); h.lineTo(fr * 1.05, -fr * 2.6); h.closePath(); h.fill();
    h.strokeStyle = 'rgba(245,243,250,0.5)'; h.lineWidth = 2.5; h.beginPath(); h.moveTo(fr * 0.22, -fr * 0.55); h.quadraticCurveTo(fr * 0.55, -fr * 0.05, fr * 1.02, -fr * 0.36); h.stroke();
    h.restore();
    // rim from the LED behind
    h.strokeStyle = 'rgba(245,243,250,0.28)'; h.lineWidth = 3; h.beginPath(); h.moveTo(fr * 1.2, -1900); h.bezierCurveTo(fr * 1.1, -760, fr, -fr * 0.6, fr, -fr * 0.1); h.stroke();
    // the pad lit from below by the display
    const ug = h.createRadialGradient(-10, 30, 10, -10, 30, fr * 1.4); ug.addColorStop(0, `rgba(245,243,250,${0.22 * (1 - clamp(d / 420))})`); ug.addColorStop(1, 'rgba(245,243,250,0)'); h.fillStyle = ug; fingertip(h, 1900, fr); h.fill();
    if (mirror) { h.globalCompositeOperation = 'source-atop'; h.fillStyle = 'rgba(4,4,5,0.55)'; h.fillRect(-400, -2200, 800, 2600); }
  };
  soft(c, fb + 6, (h) => { h.globalAlpha = 0.55; drawFinger(h, true); });
  // reflection fades as it goes "deeper" into the glass
  soft(c, fb, (h) => drawFinger(h, false));
  c.setTransform(1, 0, 0, 1, 0, 0);
  // contact: the edge is released along the contact plane and slides toward us
  if (t >= 7.0) {
    const k = eo(seg(t, 7.0, 7.4)), cy0 = ANC[1] + (CY - ANC[1]) * s, cx0 = ANC[0] + (CX - ANC[0]) * s;
    const y = lerp(cy0, 1330, eio(seg(t, 7.3, 8.0)));
    razor(c, y, cx0 - 1400 * k, cx0 + 1400 * k, 1);
    c.save(); c.globalAlpha = 0.3 * (1 - seg(t, 7.3, 8)); c.fillStyle = PU; c.fillRect(cx0 - 1400 * k, y + 8, 2800 * k, 1); c.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  dof(ctx, S, lerp(1060, 1160, seg(t, 3, 7)), 170, 460, 16);
  finish(ctx, t, 0.72);
}

// =====================================================================================
//  SCENE B · 08:00–09:60 · the line slides under frosted glass
// =====================================================================================
const LY = 1330;
function sceneFrost(t) {
  const c = sx; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#040405'; c.fillRect(0, 0, W, H);
  const q = seg(t, 8.0, 9.6), top = LY - 2900 * ss(q) - 2, bot = top + 2860, PX0 = 96, PX1 = 984;
  const inPanel = LY > top && LY < bot;
  // the pane: frosted, lit from behind by the line; the light spreads and picks up the frost grain
  c.save(); c.beginPath(); c.rect(PX0, top, PX1 - PX0, bot - top); c.clip();
  c.fillStyle = '#0E0E13'; c.fillRect(0, 0, W, H);
  if (inPanel) {
    soft(c, 200, (h) => { h.fillStyle = WH; h.globalAlpha = 0.5; h.fillRect(-50, LY - 340, W + 100, 680); }, 'screen');
    soft(c, 60, (h) => { h.fillStyle = WH; h.globalAlpha = 1; h.fillRect(-50, LY - 50, W + 100, 100); }, 'screen');
    soft(c, 18, (h) => { h.fillStyle = WH; h.globalAlpha = 1; h.fillRect(-50, LY - 12, W + 100, 24); }, 'screen');
    soft(c, 14, (h) => { h.fillStyle = PU; h.globalAlpha = 0.85; h.fillRect(-50, LY - 4, W + 100, 8); }, 'screen');
  }
  c.globalCompositeOperation = 'multiply'; c.globalAlpha = 1; c.translate(0, top % 960); c.scale(2, 2); c.fillStyle = c.createPattern(FROST, 'repeat'); c.fillRect(0, -960, W, 3000);
  c.restore();
  // pane edges: refracting, brighter where the light is
  const vg = c.createLinearGradient(0, LY - 500, 0, LY + 500); vg.addColorStop(0, 'rgba(245,243,250,0.05)'); vg.addColorStop(0.5, 'rgba(245,243,250,0.7)'); vg.addColorStop(1, 'rgba(245,243,250,0.05)');
  c.fillStyle = vg; c.fillRect(PX0 - 1, Math.max(0, top), 2, Math.min(H, bot) - Math.max(0, top)); c.fillRect(PX1 - 1, Math.max(0, top), 2, Math.min(H, bot) - Math.max(0, top));
  for (const by of [top, bot]) { const near = Math.exp(-Math.abs(by - LY) / 160); c.fillStyle = `rgba(245,243,250,${0.2 + 0.7 * near})`; c.fillRect(PX0, by - 1, PX1 - PX0, 2); }
  // a reflection gliding over the pane
  soft(c, 60, (h) => { h.beginPath(); h.rect(PX0, top, PX1 - PX0, bot - top); h.clip(); h.fillStyle = WH; h.globalAlpha = 0.06; h.translate(lerp(-300, 900, q), 0); h.rotate(-0.55); h.fillRect(0, -600, 160, 3600); }, 'screen');
  // outside the pane the line stays a razor: crisp at the sides, diffused behind the frost
