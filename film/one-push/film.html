<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>SayTamm: One Push (22 s, white)</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F6F5F9; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================================
//  ONE PUSH — «زقّة واحدة». A chain-reaction machine on white.
//  «قول.»: its full stop drops as a ball and sets the whole system in motion —
//  strategy (dominoes) → creative (a press) → media (one card becomes four screens) → measurement (a gauge rings a bell)
//  → the bell sends a second ball into a giant stamp, and the stamp lands «تم».
// =====================================================================================
const VARIANT = '__VARIANT__';
const AR = VARIANT !== 'en';
const L = (ar, en) => (AR ? ar : en);
const W = 1080, H = 1920, DUR = 22, BPM = 120, BEAT = 0.5;
window.DUR_S = DUR;
const BG = '#F6F5F9', PAPER = '#FFFFFF', OB = '#17171E', INK = '#09090D', G1 = '#E6E4EC', G2 = '#CFCCD8', G3 = '#9C99A8', MU = '#77748A', PU = '#6C35FF';
const FACE = AR ? 'Plex, Sat' : 'Sat, Plex';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, q) => a + (b - a) * q;
const ss = (x) => x * x * (3 - 2 * x);
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = (t, t0, d = 0.5, z = 0.45) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1.8) return 1; const w = 11, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z / Math.sqrt(1 - z * z) * Math.sin(wd * x)); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
function txt(c, s, x, y, font, color, align = 'center', rtl = AR) { c.font = font; c.fillStyle = color; c.textAlign = align; c.direction = rtl ? 'rtl' : 'ltr'; c.fillText(s, x, y); c.direction = 'ltr'; }
let SYMBOL = null, MARK = null, CAM_S = 1;
function shadow(c, on, k = 1) { if (on) { c.shadowColor = `rgba(30,24,60,${0.16 * k})`; c.shadowBlur = 30 * CAM_S; c.shadowOffsetY = 14 * CAM_S; } else { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; } }

// ---------------- timeline ----------------
const T_WORD = 1.15, T_D1 = 4.5;
const D_START = [T_D1, T_D1 + 0.17, T_D1 + 0.32, T_D1 + 0.45];
const T_CARD = T_D1 + 0.58, T_CARD_FALL = T_CARD + 0.42, T_CARD_LAND = T_CARD_FALL + 0.62;
const T_PRESS = 6.6, T_PRESS_HIT = 6.72, T_PRESS_UP = 7.05;
const T_PUSH = 7.8, T_OFF = 8.1, T_SLOPE = 8.35, T_SLOPE_END = 9.0, T_SPLIT = 9.2;
const LAND = [9.65, 9.9, 10.15, 10.4], T_BELL = 10.65;
const T_B2 = 10.8, T_B2_FUNNEL = 12.25, T_PULL = 11.1, T_PULL_END = 12.0, T_WHIP = 12.45, T_CUT = 12.95;
const T_STAMP = 13.5, T_LIFT = 14.1, T_TOLOCK = 15.6;
const T_NAME = 16.4, T_POS = 16.7, T_TAG = 17.3, T_CTA = 18.8;

// ---------------- the machine (world coordinates) ----------------
const R = 24;                                     // ball radius
const WORD_Y = 960;                               // baseline of «قول.»
const RAMP = [[990, 1030], [110, 1270]];          // ramp surface (down-left)
const WALL_X = 40, SHELF_Y = 1560;
const DOM = [[230, 360], [380, 510], [530, 660], [680, 810]].map(([a, b]) => ({ x0: a, x1: b, h: 260 }));
const DOM_W = AR ? ['الهدف', 'الجمهور', 'الرسالة', 'الخطة'] : ['Objective', 'Audience', 'Message', 'Plan'];
const CARD0 = { x0: 830, x1: 950, h: 170 };       // the blank card standing at the end of the shelf
const PLAT = { x0: 400, x1: 700, y: 2350 };       // press platform
const SLOPE = [[760, 2470], [590, 2760]];
const WEDGE = [540, 2930];
const SCREENS = [150, 400, 680, 930].map((x) => ({ x, y: 3370, w: 196, h: 340 }));
const GAUGE = { x: 540, y: 3990, r: 230 }, BELL = { x: 822, y: 3905 }, LEDGE = { x: 900, y: 3940 };
const RAIL = [[905, 4020], [590, 4300]], FUNNEL = { x: 540, y: 4380 };
let PERIOD = [0, 0];                              // where the full stop sits (measured)

// ball 1: the full stop
const G = 5200, ACC = 980;
let B1 = null;
function planBall1() {
  const [px, py] = PERIOD;
  const [[ax, ay], [bx, by]] = RAMP, dx = bx - ax, dy = by - ay, Lr = Math.hypot(dx, dy), ux = dx / Lr, uy = dy / Lr, nx = uy, ny = -ux;   // n points up
  const nX = -Math.abs(nx) * Math.sign(ux) * -1, nY = -Math.abs(ny);
  const n = [ny > 0 ? -nx : nx, ny > 0 ? -ny : ny];
  // contact on the ramp below the period
  const s0 = (px - ax) / ux, surf = [ax + ux * s0, ay + uy * s0], c0 = [surf[0] + n[0] * R, surf[1] + n[1] * R];
  const tFall = Math.sqrt(2 * Math.max(10, c0[1] - py) / G);
  const sEnd = Lr - 18, cEnd = [ax + ux * sEnd + n[0] * R, ay + uy * sEnd + n[1] * R];
  const Lroll = sEnd - s0, tRoll = Math.sqrt(2 * Lroll / ACC), vEnd = ACC * tRoll;
  const vx0 = ux * vEnd, vy0 = uy * vEnd;
  const tWall = (cEnd[0] - (WALL_X + R)) / -vx0;
  const pWall = [WALL_X + R, cEnd[1] + vy0 * tWall + 0.5 * G * tWall * tWall], vyW = vy0 + G * tWall, vx1 = -vx0 * 0.42;
  const yLand = SHELF_Y - R, tDrop = (-vyW + Math.sqrt(vyW * vyW + 2 * G * (yLand - pWall[1]))) / G;
  const pLand = [pWall[0] + vx1 * tDrop, yLand];
  const xHit = DOM[0].x0 - R, tRollShelf = Math.max(0.12, (xHit - pLand[0]) / (vx1 * 0.9));
  const total = tFall + tRoll + tWall + tDrop + tRollShelf;
  const tDrop0 = T_D1 - total;
  B1 = { px, py, c0, cEnd, ux, uy, tFall, tRoll, tWall, pWall, vx0, vy0, vyW, vx1, tDrop, pLand, xHit, tRollShelf, tDrop0, sEnd, s0 };
}
function ball1(t) {
  const b = B1; let t0 = b.tDrop0;
  if (t < t0) { // anticipation: the full stop jiggles, then hops
    const q = seg(t, t0 - 0.55, t0), hop = Math.sin(Math.PI * seg(t, t0 - 0.3, t0)) * 26;
    return { x: b.px, y: b.py - hop, sx: 1 + 0.18 * Math.sin(q * 30) * (1 - q) * (q > 0), sy: 1 };
  }
  let u = t - t0;
  if (u < b.tFall) return { x: b.px, y: b.py + 0.5 * G * u * u, sx: 0.9, sy: 1.12 };
  u -= b.tFall;
  if (u < b.tRoll) { const s = 0.5 * ACC * u * u, k = s / (b.sEnd - b.s0); return { x: lerp(b.c0[0], b.cEnd[0], k), y: lerp(b.c0[1], b.cEnd[1], k), sx: u < 0.06 ? 1.18 : 1, sy: u < 0.06 ? 0.84 : 1 }; }
  u -= b.tRoll;
  if (u < b.tWall) return { x: b.cEnd[0] + b.vx0 * u, y: b.cEnd[1] + b.vy0 * u + 0.5 * G * u * u, sx: 1, sy: 1 };
  u -= b.tWall;
  if (u < b.tDrop) { const sq = u < 0.05 ? 1 : 0; return { x: b.pWall[0] + b.vx1 * u, y: b.pWall[1] + b.vyW * u + 0.5 * G * u * u, sx: sq ? 0.82 : 1, sy: sq ? 1.15 : 1 }; }
  u -= b.tDrop;
  if (u < b.tRollShelf) { const q = u / b.tRollShelf; return { x: lerp(b.pLand[0], b.xHit, q * (2 - q) * 0.5 + q * 0.5), y: SHELF_Y - R, sx: u < 0.05 ? 1.2 : 1, sy: u < 0.05 ? 0.82 : 1 }; }
  u -= b.tRollShelf; const back = Math.sin(Math.PI * clamp(u / 0.35)) * 14;
  return { x: b.xHit - back, y: SHELF_Y - R, sx: 1, sy: 1 };
}
// dominoes fall to the right, each pivoting on its bottom-right corner
const D_END = [1.08, 1.1, 1.12, 1.5];
const domAngle = (k, t) => D_END[k] * clamp((t - D_START[k]) / 0.55) ** 2;
// the card: tipped by the last domino, rolls over the edge, drops onto the press
function cardState(t) {
  if (t < T_CARD) return { x: (CARD0.x0 + CARD0.x1) / 2, y: SHELF_Y - CARD0.h / 2, rot: 0, piv: true, a: 0 };
  if (t < T_CARD_FALL) return { piv: true, a: (Math.PI / 2) * clamp((t - T_CARD) / (T_CARD_FALL - T_CARD)) ** 2 };
  const lyingX = CARD0.x1 + CARD0.h / 2, lyingY = SHELF_Y - (CARD0.x1 - CARD0.x0) / 2;
  const tx = (PLAT.x0 + PLAT.x1) / 2, ty = PLAT.y - (CARD0.x1 - CARD0.x0) / 2;
  if (t < T_CARD_LAND) { const q = (t - T_CARD_FALL) / (T_CARD_LAND - T_CARD_FALL); return { x: lerp(lyingX, tx, eio(q)), y: lerp(lyingY, ty, q * q), rot: Math.PI / 2 + Math.sin(q * Math.PI) * 0.35, piv: false }; }
  const bounce = Math.abs(Math.sin(Math.PI * clamp((t - T_CARD_LAND) / 0.22))) * 22 * (t < T_CARD_LAND + 0.22);
  if (t < T_PUSH) return { x: tx, y: ty - bounce, rot: Math.PI / 2, piv: false };
  // pushed off the right edge, then slides down the slope, then flies onto the wedge
  if (t < T_OFF) { const q = eio((t - T_PUSH) / (T_OFF - T_PUSH)); return { x: lerp(tx, PLAT.x1 + 20, q), y: ty, rot: Math.PI / 2, piv: false }; }
  const [[sx0, sy0], [sx1, sy1]] = SLOPE, ang = Math.atan2(sy1 - sy0, sx1 - sx0);
  if (t < T_SLOPE) { const q = (t - T_OFF) / (T_SLOPE - T_OFF); return { x: lerp(PLAT.x1 + 20, sx0, q), y: lerp(ty, sy0 - 60, q * q), rot: lerp(Math.PI / 2, ang + Math.PI / 2 - Math.PI, q), piv: false }; }
  if (t < T_SLOPE_END) { const q = ((t - T_SLOPE) / (T_SLOPE_END - T_SLOPE)) ** 1.6; return { x: lerp(sx0, sx1, q), y: lerp(sy0 - 60, sy1 - 60, q), rot: ang + Math.PI / 2 - Math.PI, piv: false }; }
  if (t < T_SPLIT) { const q = (t - T_SLOPE_END) / (T_SPLIT - T_SLOPE_END); return { x: lerp(sx1, WEDGE[0], q), y: lerp(sy1 - 60, WEDGE[1] - 50, q), rot: lerp(ang - Math.PI / 2, -Math.PI / 2, q), piv: false }; }
  return null;
}
// ball 2: waits on the ledge by the bell, knocked onto the rail, into the funnel
function ball2(t) {
  const [[ax, ay], [bx, by]] = RAIL, dx = bx - ax, dy = by - ay, Ln = Math.hypot(dx, dy), ux = dx / Ln, uy = dy / Ln, n = [uy, -ux];
  const nn = n[1] > 0 ? [-n[0], -n[1]] : n;
  if (t < T_B2) return { x: LEDGE.x, y: LEDGE.y - R, sx: 1, sy: 1 };
  const c0 = [ax + nn[0] * R, ay + nn[1] * R], c1 = [bx + nn[0] * R, by + nn[1] * R];
  if (t < T_B2 + 0.2) { const q = (t - T_B2) / 0.2; return { x: lerp(LEDGE.x, c0[0], q), y: lerp(LEDGE.y - R, c0[1], q) - Math.sin(Math.PI * q) * 30, sx: 1, sy: 1 }; }
  if (t < T_B2_FUNNEL) { const q = ((t - T_B2 - 0.2) / (T_B2_FUNNEL - T_B2 - 0.2)) ** 1.7; return { x: lerp(c0[0], c1[0], q), y: lerp(c0[1], c1[1], q), sx: 1, sy: 1 }; }
  const q = clamp((t - T_B2_FUNNEL) / 0.32); return { x: lerp(c1[0], FUNNEL.x, eio(q)), y: lerp(c1[1], FUNNEL.y + 100, q * q), sx: 1, sy: 1, s: 1 - 0.4 * q };
}

// ---------------- camera ----------------
const CAMK = [[0, 540, 940, 1.15], [3.0, 540, 960, 1.15], [4.3, 520, 1330, 1.25], [4.6, 560, 1420, 1.4], [5.4, 690, 1480, 1.3], [6.3, 560, 2190, 1.35], [7.9, 560, 2200, 1.35], [8.9, 620, 2620, 1.25], [9.35, 540, 3220, 1.04], [9.8, 540, 3590, 1.0], [T_PULL, 540, 3590, 1.0], [T_PULL_END, 540, 2444, 0.38]];
function cam(t) {
  if (t >= T_WHIP) {
    const q = seg(t, T_WHIP, T_CUT), e = q * q * (3 - 2 * q), s = 0.38 * Math.exp(Math.log(70 / 0.38) * e * e);
    const sy0 = 960 + (FUNNEL.y + 120 - 2444) * 0.38, syq = lerp(sy0, 960, eio(clamp(q * 1.4)));
    return { cx: 540, cy: FUNNEL.y + 120 - (syq - 960) / s, s, rot: 0 };
  }
  let k = 0; while (k < CAMK.length - 1 && t > CAMK[k + 1][0]) k++;
  const a = CAMK[k], b = CAMK[Math.min(k + 1, CAMK.length - 1)], q = a === b ? 0 : eio(seg(t, a[0], b[0]));
  const sh = (t > T_PRESS_HIT && t < T_PRESS_HIT + 0.3 ? (1 - (t - T_PRESS_HIT) / 0.3) * 10 : 0) + (t > D_START[0] && t < D_START[3] + 0.5 ? 2 : 0);
  // a living camera: slow drift, the faintest roll, a jolt on impacts
  return { cx: lerp(a[1], b[1], q) + Math.sin(t * 0.7) * 5 + Math.sin(t * 83) * sh, cy: lerp(a[2], b[2], q) + Math.cos(t * 0.53) * 6 + Math.cos(t * 71) * sh, s: lerp(a[3], b[3], q), rot: Math.sin(t * 0.41) * 0.004 };
}

// ---------------- drawing the machine ----------------
function ballDraw(c, b, extra = 1) {
  if (!b) return;
  const r = R * (b.s || 1) * extra;
  shadow(c, true, 1.2);
  c.save(); c.translate(b.x, b.y); c.scale(b.sx, b.sy);
  const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r); g.addColorStop(0, '#9B78FF'); g.addColorStop(0.55, PU); g.addColorStop(1, '#4A1FD0');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); shadow(c, false);
  c.fillStyle = 'rgba(255,255,255,0.75)'; c.beginPath(); c.ellipse(-r * 0.35, -r * 0.42, r * 0.22, r * 0.14, -0.6, 0, 7); c.fill();
  c.restore();
}
function rail(c, a, b, w = 16) {
  shadow(c, true, 0.8); c.strokeStyle = G2; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); shadow(c, false);
  c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3; c.beginPath(); c.moveTo(a[0], a[1] - w * 0.3); c.lineTo(b[0], b[1] - w * 0.3); c.stroke();
}
function post(c, x, y0, y1) { c.fillStyle = G1; c.fillRect(x - 6, y0, 12, y1 - y0); c.fillStyle = G2; c.fillRect(x - 6, y0, 4, y1 - y0); }
function drawCardBody(c, w, h, designed) {
  shadow(c, true); c.fillStyle = PAPER; rr(c, -w / 2, -h / 2, w, h, 14); c.fill(); shadow(c, false);
  c.strokeStyle = G2; c.lineWidth = 3; rr(c, -w / 2, -h / 2, w, h, 14); c.stroke();
  if (designed > 0) {
    c.save(); c.globalAlpha *= designed; rr(c, -w / 2, -h / 2, w, h, 14); c.clip();
    c.fillStyle = OB; c.beginPath(); c.arc(-w * 0.18, -h * 0.05, Math.min(w, h) * 0.22, 0, 7); c.fill();
    c.save(); c.translate(w * 0.2, 0); c.rotate(-Math.PI / 4); c.fillStyle = PU; c.fillRect(-w * 0.06, -h, w * 0.12, h * 2); c.restore();
    c.fillStyle = G2; c.fillRect(-w * 0.38, h * 0.28, w * 0.42, h * 0.07); c.fillRect(-w * 0.38, h * 0.4 - 0, w * 0.26, h * 0.06);
    c.restore();
  }
}
function drawMachine(t) {
  const c = ctx;
  // --- hook words ---
  const hq = spring(t, 0.1, 0.45), hout = 1 - ss(seg(t, 2.4, 2.9));
  if (hq > 0 && hout > 0) { c.save(); c.globalAlpha = clamp(hq * 1.6) * hout; c.translate(540, 700); const k = lerp(0.9, 1, Math.min(1, hq)); c.scale(k, k); txt(c, L('عندك هدف؟', 'Have an objective?'), 0, 0, `600 ${AR ? 76 : 66}px ${FACE}`, MU); c.restore(); }
  const wq = spring(t, T_WORD, 0.5);
  if (wq > 0) {
    c.save(); c.globalAlpha = clamp(wq * 1.6) * (1 - ss(seg(t, 3.7, 4.2)) + ss(seg(t, T_PULL, T_PULL + 0.5))); const k = lerp(1.25, 1, Math.min(1, wq)); c.translate(540, WORD_Y); c.scale(k, k); c.translate(-540, -WORD_Y);
    txt(c, L('قول', 'Say it'), 540 + (AR ? 26 : -26), WORD_Y, `700 220px ${FACE}`, INK); c.restore();
  }
  // --- ramp, wall, shelf ---
  [[300, 1170], [640, 1080], [930, 1050]].forEach(([x, y]) => post(c, x, y + 8, y + 340));
  rail(c, RAMP[0], RAMP[1], 18);
  shadow(c, true); c.fillStyle = OB; rr(c, WALL_X - 14, 1150, 14, SHELF_Y - 1150 + 30, 4); c.fill(); shadow(c, false);
  shadow(c, true); c.fillStyle = G1; rr(c, 20, SHELF_Y, 950, 30, 6); c.fill(); shadow(c, false); c.fillStyle = G2; c.fillRect(20, SHELF_Y + 22, 950, 8);
  // dominoes
  DOM.forEach((d, k) => {
    const a = domAngle(k, t);
    c.save(); c.translate(d.x1, SHELF_Y); c.rotate(a); c.translate(-d.x1, -SHELF_Y);
    shadow(c, true); const g = c.createLinearGradient(d.x0, 0, d.x1, 0); g.addColorStop(0, '#26252F'); g.addColorStop(1, OB); c.fillStyle = g; rr(c, d.x0, SHELF_Y - d.h, d.x1 - d.x0, d.h, 10); c.fill(); shadow(c, false);
    c.fillStyle = 'rgba(255,255,255,0.08)'; rr(c, d.x0 + 6, SHELF_Y - d.h + 6, d.x1 - d.x0 - 12, 8, 4); c.fill();
    c.save(); c.translate((d.x0 + d.x1) / 2, SHELF_Y - d.h * 0.62); txt(c, '0' + (k + 1), 0, -52, '700 22px Sat', G3, 'center', false); txt(c, DOM_W[k], 0, 10, `700 ${AR ? 30 : 21}px ${FACE}`, PAPER); c.restore();
    c.restore();
  });
  // the card on the shelf / in flight / on the press
  const cs = cardState(t), cw = CARD0.x1 - CARD0.x0, ch = CARD0.h, designed = ss(seg(t, T_PRESS_HIT, T_PRESS_HIT + 0.12));
  if (cs) {
    c.save();
    if (cs.piv) { c.translate(CARD0.x1, SHELF_Y); c.rotate(cs.a); c.translate(-cw / 2, -ch / 2); drawCardBody(c, cw, ch, 0); }
    else { c.translate(cs.x, cs.y); c.rotate(cs.rot); drawCardBody(c, cw, ch, designed); }
    c.restore();
  }
  // --- chute + press ---
  c.strokeStyle = G2; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(1010, 1700); c.lineTo(760, 2150); c.stroke(); c.beginPath(); c.moveTo(880, 1700); c.lineTo(660, 2090); c.stroke();
  shadow(c, true); c.fillStyle = OB; rr(c, PLAT.x0, PLAT.y, PLAT.x1 - PLAT.x0, 70, 10); c.fill(); shadow(c, false);
  post(c, PLAT.x0 + 40, PLAT.y + 70, PLAT.y + 260); post(c, PLAT.x1 - 40, PLAT.y + 70, PLAT.y + 260);
  const pdown = t < T_PRESS ? 0 : t < T_PRESS_HIT ? ((t - T_PRESS) / (T_PRESS_HIT - T_PRESS)) ** 2 : t < T_PRESS_UP ? 1 : 1 - eo(seg(t, T_PRESS_UP, T_PRESS_UP + 0.5));
  const headY = lerp(2060, PLAT.y - cw - 2, pdown);   // bottom of the press head
  c.fillStyle = G2; c.fillRect(540 - 14, 1840, 28, headY - 90 - 1840 + 10);
  shadow(c, true); c.fillStyle = OB; rr(c, 400, 1800, 300, 70, 12); c.fill(); rr(c, 420, headY - 90, 260, 90, 12); c.fill(); shadow(c, false);
  c.fillStyle = PU; c.fillRect(430, headY - 12, 240, 6);
