<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>SayTamm: The Dot (Day 14 launch film, 28 s)</title>
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #09090D; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================================
//  THE DOT — SayTamm's Day 14 launch film.
//  The market talks in ellipses ("…"): typing, "we'll get back to you", postponed meetings, 40-page reports.
//  One dot ends the sentence. It closes every open loop, runs the system (objective → strategy → creative →
//  media → measurement) and lands as the two dots of «تم». Less talk. More Tamm.
// =====================================================================================
const VARIANT = '__VARIANT__';                 // 'ar' | 'en'  (separate masters, never both scripts in one crowded frame)
const AR = VARIANT !== 'en';
const L = (ar, en) => (AR ? ar : en);
const W = 1080, H = 1920, DUR = 28, BPM = 120, BEAT = 60 / BPM;
window.DUR_S = DUR;
const OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = '#96939F', PU = '#6C35FF';
const FACE = AR ? 'Plex, Sat' : 'Sat, Plex';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, q) => a + (b - a) * q;
const ss = (x) => x * x * (3 - 2 * x);
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const ei3 = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = (t, t0, d = 0.5) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1.6) return 1; const z = 0.5, w = 11, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z / Math.sqrt(1 - z * z) * Math.sin(wd * x)); };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
function txt(c, s, x, y, font, color, align = 'center', rtl = AR) { c.font = font; c.fillStyle = color; c.textAlign = align; c.direction = rtl ? 'rtl' : 'ltr'; c.fillText(s, x, y); c.direction = 'ltr'; }
let SYMBOL = null, CARD = null;

// ---------------- the timeline (120 BPM; the hit at 6.75 s sits on a downbeat) ----------------
const T_FREEZE = 5.6, T_DROP1 = 6.0, T_DROP2 = 6.3, T_HIT = 6.75;
const T_CASCADE = 12.0, T_SUCK = 12.75, T_LESS = 13.25, T_SYS = 14.75;
const STOPS_T = [14.75, 15.75, 16.75, 17.75, 18.75], T_PULL = 19.25, T_FLY = 20.25, T_TAMM = 21.75;
const T_LOCK = 22.9, T_LINE = 24.2, T_CTA = 25.4;

// ---------------- the talk: every item of noise, and what it becomes ----------------
const POOL = AR
  ? [['هنرجعلك', '…', 'رجعنالك.'], ['في جديد', '؟', 'نزل.'], ['خليها لبكرة', '…', 'خلصت النهارده.'], ['لسه بنراجع', '…', 'اتراجع.'], ['نتكلم بعدين', '…', 'اتعمل.'], ['وش صار', '؟', 'صار.'], ['نأجلها للأسبوع الجاي', '…', 'النهارده.'], ['ابعتلي تاني', '…', 'اتبعت.'], ['مستنيين الموافقة', '…', 'اتوافق.'], ['باقي شوي', '…', 'تم.']]
  : [["Let's circle back", '…', 'Done.'], ['Any update', '?', 'Live.'], ['Pushing to next week', '…', 'Today.'], ['Still reviewing', '…', 'Approved.'], ["Let's take it offline", '…', 'Sorted.'], ['Quick sync', '?', 'Shipped.'], ['Per my last email', '…', 'Delivered.'], ['Can you resend', '?', 'Sent.'], ['Waiting on approval', '…', 'Approved.'], ['Following up', '…', 'Done.']];
const ITEMS = [];
const add = (o) => { ITEMS.push(Object.assign({ s: 1, rot: 0, side: 'in' }, o)); return ITEMS.length - 1; };
// center typing bubble (it becomes THE dot)
const CENTER = add({ type: 'typing', x: 540, y: 960, s: 2.1, spawn: -1, close: Infinity, hero: true });
const mi = (k, x, y, spawn, s = 1, side = 'in') => add({ type: 'msg', p: POOL[k], x, y, spawn, s, side });
const I1 = mi(0, 330, 560, -1);
const I2 = mi(1, 770, 1390, -1, 1, 'out');
const I3 = add({ type: 'meeting', x: 320, y: 1600, spawn: 0.75 });
const I4 = add({ type: 'voice', x: 760, y: 330, spawn: -1, dur: '2:47', side: 'out' });
const I5 = mi(2, 700, 770, 1.5, 0.92, 'out');
const I6 = add({ type: 'spinner', x: 270, y: 1230, spawn: 1.85 });
const I7 = add({ type: 'doc', x: 760, y: 1700, spawn: 2.15 });
const I8 = mi(3, 330, 300, 2.45, 0.9);
const I9 = add({ type: 'typing', x: 830, y: 1100, s: 0.9, spawn: 2.7, side: 'out' });
const I10 = mi(4, 300, 880, 2.95, 0.85);
mi(5, 800, 560, 3.15, 0.8, 'out');
mi(6, 560, 180, 3.4, 0.78);
mi(7, 820, 1240, 3.6, 0.8, 'out');
add({ type: 'voice', x: 330, y: 1420, spawn: 3.8, dur: '1:58', s: 0.85 });
mi(8, 560, 650, 4.0, 0.75);
add({ type: 'typing', x: 210, y: 1050, s: 0.7, spawn: 4.15 });
mi(9, 860, 900, 4.3, 0.72, 'out');
mi(0, 470, 1820, 4.45, 0.8);
add({ type: 'typing', x: 880, y: 220, s: 0.65, spawn: 4.6, side: 'out' });
// the flood: faster and smaller, deeper in the frame
for (let i = 0; i < 14; i++) {
  const sp = 4.75 + i * 0.058, k = Math.floor(hash(i + 40) * POOL.length);
  if (i % 4 === 3) add({ type: 'typing', x: 120 + hash(i + 9) * 840, y: 150 + hash(i + 19) * 1650, s: 0.5 + hash(i + 3) * 0.2, spawn: sp, side: i % 2 ? 'out' : 'in' });
  else mi(k, 140 + hash(i + 7) * 800, 140 + hash(i + 17) * 1660, sp, 0.5 + hash(i + 29) * 0.25, i % 2 ? 'out' : 'in');
}
// the dot visits these, one per beat and faster; everything else closes in one cascade
const SOLO = [[I1, 7.75], [I4, 8.75], [I5, 9.5], [I2, 10.0], [I7, 10.5], [I3, 11.0], [I6, 11.25], [I10, 11.5], [I8, 11.75]];
SOLO.forEach(([i, t]) => (ITEMS[i].close = t));

// ---------------- item geometry (after fonts load) ----------------
const MSG_F = (s) => `600 ${Math.round(46 * s)}px ${FACE}`;
function measureItems() {
  const c = ctx;
  for (const it of ITEMS) {
    const s = it.s;
    if (it.type === 'msg') {
      c.font = MSG_F(1); c.direction = AR ? 'rtl' : 'ltr';
      it.tw = c.measureText(it.p[0]).width; it.pw = it.p[1] === '…' ? 50 : c.measureText(it.p[1]).width;
      it.dw = c.measureText(it.p[2]).width;
      it.w = Math.max(it.tw + it.pw + 14, it.dw + 60) + 76; it.h = 104;
    } else if (it.type === 'typing') { it.w = 150; it.h = 92; }
    else if (it.type === 'voice') { it.w = 430; it.h = 104; }
    else if (it.type === 'meeting') { it.w = 520; it.h = 176; }
    else if (it.type === 'spinner') { it.w = 400; it.h = 150; }
    else if (it.type === 'doc') { it.w = 470; it.h = 160; }
    // the anchor: where the dot strikes (the ellipsis, the question mark, the chip, the stack)
    let ax = 0, ay = 0;
    if (it.type === 'msg') { const x0 = AR ? it.w / 2 - 38 - it.tw - 7 : -it.w / 2 + 38 + it.tw + 7; ax = AR ? x0 - it.pw / 2 : x0 + it.pw / 2; ay = it.p[1] === '…' ? 8 : -6; }
    if (it.type === 'voice') { ax = it.w / 2 - 70; ay = 0; }
    if (it.type === 'meeting') { ax = AR ? -it.w / 2 + 110 : it.w / 2 - 110; ay = 44; }
    if (it.type === 'spinner') { ax = AR ? it.w / 2 - 75 : -it.w / 2 + 75; ay = 0; }
    if (it.type === 'doc') { ax = AR ? -it.w / 2 + 70 : it.w / 2 - 70; ay = -20; }
    it.ax = ax * s; it.ay = ay * s;
  }
}
// float in Act 1 (frozen from T_FREEZE on)
const ta = (t) => Math.min(t, T_FREEZE);
function itemPos(it, t) {
  const u = ta(t), k = ITEMS.indexOf(it);
  return [it.x + Math.sin(u * 1.3 + k) * 6 * it.s, it.y + Math.cos(u * 1.1 + k * 1.7) * 9 * it.s];
}
const anchorOf = (it, t) => { const [x, y] = itemPos(it, t); return [x + it.ax, y + it.ay]; };
function closeTime(it) {
  if (it.close !== undefined && it.close !== Infinity) return it.close;
  if (it.hero) return Infinity;
  const [x, y] = itemPos(it, T_FREEZE + 1), [dx, dy] = DOT_AT_CASCADE, d = Math.hypot(x - dx, y - dy);
  return T_CASCADE + d / 2600;          // the wave runs out from the dot
}
let DOT_AT_CASCADE = [540, 960];

// ---------------- the dot ----------------
const DOT_R = 22;
const DOT_KEYS = [];    // [t, x, y] arrival points in Act 3
function buildDotPath() {
  DOT_KEYS.length = 0; DOT_KEYS.push([T_HIT + 0.4, 540, 960]);
  for (const [i, t] of SOLO) { const [x, y] = anchorOf(ITEMS[i], t); DOT_KEYS.push([t, x, y]); }
  DOT_AT_CASCADE = [DOT_KEYS[DOT_KEYS.length - 1][1], DOT_KEYS[DOT_KEYS.length - 1][2]];
  DOT_KEYS.push([T_CASCADE + 0.25, DOT_AT_CASCADE[0], DOT_AT_CASCADE[1]]);
  DOT_KEYS.push([T_SUCK - 0.05, 540, 960]);
}
function dotAct3(t) {
  if (t <= DOT_KEYS[0][0]) return [540, 960, 0];
  for (let i = 1; i < DOT_KEYS.length; i++) {
    const [t1, x1, y1] = DOT_KEYS[i], [t0, x0, y0] = DOT_KEYS[i - 1];
    if (t <= t1) {
      const travel = Math.min(0.42, (t1 - t0) * 0.75), q = clamp((t - (t1 - travel)) / travel), e = eio(q);
      return [lerp(x0, x1, e), lerp(y0, y1, e), Math.sin(Math.PI * q)];
    }
  }
  return [540, 960, 0];
}

// ---------------- drawing the items ----------------
function dots3(c, x, y, r, gap, phase, rtl, still) {
  for (let k = 0; k < 3; k++) {
    const b = still ? 0 : Math.max(0, Math.sin(phase * 7 - k * 0.9)) * r * 1.1;
    c.beginPath(); c.arc(x + (rtl ? -k : k) * gap, y - b, r, 0, 7); c.fill();
  }
}
function bubble(c, it, done, a) {
  const w = it.w, h = it.h, r = 40;
  if (done > 0) { c.fillStyle = `rgba(245,243,250,${0.95 * done})`; rr(c, -w / 2, -h / 2, w, h, r); c.fill(); }
  if (done < 1) {
    c.save(); c.globalAlpha *= 1 - done;
    const g = c.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, it.side === 'out' ? 'rgba(60,58,76,0.92)' : 'rgba(36,35,46,0.92)'); g.addColorStop(1, it.side === 'out' ? 'rgba(46,44,60,0.92)' : 'rgba(26,25,34,0.92)');
    c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, r); c.fill(); c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 2; c.stroke(); c.restore();
  }
}
function check(c, x, y, r, a = 1) {
  c.save(); c.globalAlpha *= a; c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = PU; c.fill();
  c.strokeStyle = WH; c.lineWidth = r * 0.28; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(x - r * 0.42, y + r * 0.02); c.lineTo(x - r * 0.1, y + r * 0.34); c.lineTo(x + r * 0.45, y - r * 0.3); c.stroke(); c.restore();
}
function drawItem(c, it, t) {
  const tc = closeTime(it), done = it.hero ? 0 : ss(seg(t, tc, tc + 0.16));
  const born = it.spawn < 0 ? 1 : spring(t, it.spawn, 0.38);
  if (born <= 0.001) return;
  let [x, y] = itemPos(it, t), sc = it.s * (0.55 + 0.45 * born), alpha = clamp(born * 1.6);
  // freeze: everything unresolved dims; resolved items come back bright with a pop
  const dim = t > T_FREEZE ? 1 - 0.66 * ss(seg(t, T_FREEZE, T_FREEZE + 0.25)) : 1;
  alpha *= done > 0 ? lerp(dim, 1, done) : dim;
  if (done > 0) sc *= 1 + 0.12 * Math.sin(Math.PI * clamp((t - tc) / 0.3));
  // suction: into the dot
  if (t > T_SUCK && !it.hero) {
    const [x0, y0] = itemPos(it, t), d0 = Math.hypot(x0 - 540, y0 - 960), st = T_SUCK + (1 - d0 / 1200) * 0.15 + hash(ITEMS.indexOf(it)) * 0.18;
    const q = ei3(clamp((t - st) / 0.42));
    if (q >= 1) return;
    x = lerp(x0, 540, q); y = lerp(y0, 960, q); sc *= 1 - q; alpha *= 1 - ss(seg(q, 0.7, 1));
  }
  if (it.hero) { if (t > T_HIT) { const q = seg(t, T_HIT, T_HIT + 0.32); sc *= 1 - eo(q) * 0.9; alpha *= 1 - q; if (q >= 1) return; } }
  c.save(); c.translate(x, y); c.rotate(it.rot); c.scale(sc, sc); c.globalAlpha = alpha;
  const u = ta(t), ph = u + ITEMS.indexOf(it) * 0.37, ink = done > 0.5 ? OB : WH;
  if (it.type === 'msg') {
    bubble(c, it, done);
    const rx = AR ? it.w / 2 - 38 : -it.w / 2 + 38;
    if (done < 1) {
      c.save(); c.globalAlpha *= 1 - done; txt(c, it.p[0], rx, 16, MSG_F(1), WH, AR ? 'right' : 'left');
      c.fillStyle = WH;
      if (it.p[1] === '…') { const x0 = AR ? rx - it.tw - 14 : rx + it.tw + 14; dots3(c, AR ? x0 - 2 : x0 + 2, 8, 5.5, 17, 0, AR, true); }
      else txt(c, it.p[1], AR ? rx - it.tw - 2 : rx + it.tw + 2, 16, MSG_F(1), WH, AR ? 'right' : 'left');
      c.restore();
    }
    if (done > 0) { c.save(); c.globalAlpha *= done; txt(c, it.p[2], rx, 16, `700 ${46}px ${FACE}`, OB, AR ? 'right' : 'left'); check(c, AR ? -it.w / 2 + 6 : it.w / 2 - 6, -it.h / 2 + 6, 20, done); c.restore(); }
  }
  if (it.type === 'typing') {
    bubble(c, it, done);
    c.fillStyle = WH;
    if (done < 1) { c.save(); c.globalAlpha *= 1 - done; const still = t > T_FREEZE; let drops = it.hero ? [seg(t, T_DROP1, T_DROP1 + 0.6), 0, seg(t, T_DROP2, T_DROP2 + 0.6)] : [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        const b = still ? 0 : Math.max(0, Math.sin(ph * 7 - k * 0.9)) * 9, dq = drops[k];
        if (dq >= 1) continue;
        c.save(); c.globalAlpha *= 1 - ss(seg(dq, 0.55, 1)); c.beginPath(); c.arc((k - 1) * 30 + dq * (k - 1) * 30, -b + 900 * dq * dq, 10, 0, 7);
        if (it.hero && k === 1 && t > T_HIT - 0.02) c.fillStyle = PU;
        c.fill(); c.restore();
      }
      if (it.hero) txt(c, L('بيكتب…', 'typing…'), 0, -it.h / 2 - 24, `500 24px ${FACE}`, MU);
      c.restore(); }
    if (done > 0) { c.save(); c.globalAlpha *= done; txt(c, L('تم.', 'Done.'), 0, 15, `700 44px ${FACE}`, OB); check(c, it.w / 2 - 6, -it.h / 2 + 6, 18, done); c.restore(); }
  }
  if (it.type === 'voice') {
    bubble(c, it, done);
    const col = done > 0.5 ? OB : WH, play = it.w / 2 - 60, prog = done > 0 ? 1 : clamp(u / 9);
    c.fillStyle = col; c.beginPath(); c.moveTo(-it.w / 2 + 46, -20); c.lineTo(-it.w / 2 + 46, 20); c.lineTo(-it.w / 2 + 78, 0); c.closePath(); c.fill();
    const bars = done > 0.5 ? 5 : 26, bx0 = -it.w / 2 + 100, bw = (it.w - 210) / bars;
    for (let k = 0; k < bars; k++) { const hh = 10 + hash(k * 3.1 + ITEMS.indexOf(it)) * 46; c.globalAlpha = (k / bars < prog ? 1 : 0.45) * alpha; c.fillRect(bx0 + k * bw, -hh / 2, Math.max(4, bw * 0.55), hh); }
    c.globalAlpha = alpha; txt(c, done > 0.5 ? '0:03' : it.dur, play + 22, 14, `600 30px Sat`, col, 'center', false);
    if (done > 0) check(c, it.w / 2 - 6, -it.h / 2 + 6, 20, done);
  }
  if (it.type === 'meeting') {
    bubble(c, it, done);
    const col = done > 0.5 ? OB : WH, ix = AR ? it.w / 2 - 70 : -it.w / 2 + 70;
    c.strokeStyle = col; c.lineWidth = 4; rr(c, ix - 30, -52, 60, 56, 8); c.stroke(); c.fillStyle = col; c.fillRect(ix - 30, -52, 60, 14); c.fillRect(ix - 16, -62, 5, 16); c.fillRect(ix + 11, -62, 5, 16);
    const tx = AR ? ix - 56 : ix + 56;
    txt(c, L('اجتماع المتابعة', 'Weekly sync'), tx, -20, `700 40px ${FACE}`, col, AR ? 'right' : 'left');
    txt(c, L('الخميس · 10:00', 'Thu · 10:00'), tx, 22, `500 28px ${FACE}`, done > 0.5 ? '#4A4756' : MU, AR ? 'right' : 'left');
    // the chip: postponed, again and again → done
    const cx = AR ? -it.w / 2 + 110 : it.w / 2 - 110, n = 1 + (u > 3.4) + (u > 4.6);
    if (done < 0.5) {
      rr(c, cx - 88, 22, 176, 48, 24); c.fillStyle = 'rgba(245,243,250,0.12)'; c.fill(); txt(c, L('اتأجل', 'Postponed'), cx, 56, `600 28px ${FACE}`, WH);
      if (n > 1) { const q = spring(t, n === 2 ? 3.4 : 4.6, 0.3); c.save(); c.translate(cx + (AR ? -100 : 100), -30); c.scale(q, q); c.rotate(-0.15); rr(c, -44, -24, 88, 48, 12); c.strokeStyle = WH; c.lineWidth = 3; c.stroke(); txt(c, '×' + n, 0, 12, '700 30px Sat', WH, 'center', false); c.restore(); }
    } else { rr(c, cx - 88, 22, 176, 48, 24); c.fillStyle = PU; c.fill(); txt(c, L('تم ✓', 'Done ✓'), cx, 56, `700 28px ${FACE}`, WH); }
  }
  if (it.type === 'spinner') {
    bubble(c, it, done);
    const col = done > 0.5 ? OB : WH, cx = AR ? it.w / 2 - 75 : -it.w / 2 + 75;
    c.lineWidth = 8; c.lineCap = 'round'; c.strokeStyle = done > 0.5 ? 'rgba(9,9,13,0.15)' : 'rgba(245,243,250,0.15)'; c.beginPath(); c.arc(cx, 0, 34, 0, 7); c.stroke();
    if (done < 0.5) { const a0 = u * 7; c.strokeStyle = WH; c.beginPath(); c.arc(cx, 0, 34, a0, a0 + 1.6); c.stroke(); }
    else check(c, cx, 0, 34);
    txt(c, done > 0.5 ? L('جاهز.', 'Ready.') : L('جاري التحميل…', 'Loading…'), AR ? cx - 60 : cx + 60, 14, `600 40px ${FACE}`, col, AR ? 'right' : 'left');
  }
  if (it.type === 'doc') {
    const pages = done > 0.5 ? 0 : 5;
    for (let k = pages; k > 0; k--) { c.fillStyle = `rgba(${k % 2 ? '60,58,76' : '46,44,60'},0.9)`; rr(c, -it.w / 2 + k * 9, -it.h / 2 - k * 9, it.w, it.h, 26); c.fill(); }
    bubble(c, it, done);
    const col = done > 0.5 ? OB : WH, ix = AR ? it.w / 2 - 62 : -it.w / 2 + 62;
    rr(c, ix - 28, -40, 56, 72, 6); c.fillStyle = done > 0.5 ? OB : 'rgba(245,243,250,0.9)'; c.fill(); txt(c, 'PDF', ix, 8, '700 18px Sat', done > 0.5 ? WH : OB, 'center', false);
    const tx = AR ? ix - 50 : ix + 50;
    txt(c, 'Report_FINAL_v7.pdf', tx, -8, '600 32px Sat', col, AR ? 'right' : 'left', false);
    txt(c, done > 0.5 ? L('صفحة واحدة. قرار واحد.', '1 page. 1 decision.') : L('40 صفحة', '40 pages'), tx, 36, `${done > 0.5 ? 700 : 500} 28px ${FACE}`, done > 0.5 ? OB : MU, AR ? 'right' : 'left');
    if (done > 0) check(c, AR ? -it.w / 2 + 6 : it.w / 2 - 6, -it.h / 2 + 6, 20, done);
  }
  c.restore();
  // the ellipsis falls away when the dot strikes
  if (it.type === 'msg' && it.p[1] === '…' && t > tc && t < tc + 0.9 && t < T_SUCK) {
    const [axp, ayp] = anchorOf(it, t), q = (t - tc) / 0.9;
    c.save(); c.fillStyle = WH; c.globalAlpha = (1 - q) * 0.9;
    [-1, 1].forEach((sgn) => { c.beginPath(); c.arc(axp + sgn * 17 * it.s + sgn * q * 40, ayp + 600 * q * q, 5.5 * it.s, 0, 7); c.fill(); });
    c.restore();
  }
}

// ---------------- the system (Act 5): one dot runs the whole chain ----------------
