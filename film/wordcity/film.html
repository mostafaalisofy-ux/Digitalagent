<body><canvas id="c"></canvas>
<script>
'use strict';
// «مدينة الكلمات» (Word City) — a new SayTamm intro film. Arabic, IBM Plex Sans Arabic only, 120 BPM, 38 s.
// Idea: everything starts with a word. Each service is said as one word; the word falls from the sky and lands as a building
// in an isometric city, then comes alive with what that service does. Strategy lands first and draws the roads; analytics
// lands last and the data flows to it. The city stands; the Gulf «قول…» plays; the last and biggest word, «تمّ», lands on «تم».
// The blade wipes to the end card: the symbol (original file), www.saytamm.com. window.seek(t) is async.
const CFG = __CFG__, W = CFG.w, H = CFG.h, VERT = H > W;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const DUR = 38, BEAT = 0.5; window.DUR_S = DUR;
const COL = { ob: '#09090D', gr: '#17171E', soft: '#F5F3FA', mu: '#96939F', pu: '#6C35FF', pi: '#A78BFA' };
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), eo = (t) => 1 - Math.pow(1 - t, 3), eo5 = (t) => 1 - Math.pow(1 - t, 5);
const back = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => { const A = hex(a), B2 = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B2[i], k))).join(',')})`; };
const rgba = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
let SYMBOL;

// ---------- the city: nine words around an empty centre plot ----------
const B = [
  { w: 'استراتيجية', s: 'استراتيجية التسويق الرقمي', d: 'الاستراتيجية والاستشارات', x: -900, y: -600, f: 'y', fs: 150, life: 'roads' },
  { w: 'هوية', s: 'الهوية والعلامة التجارية', d: 'الإبداع والمحتوى', x: -250, y: -1000, f: 'x', fs: 190, life: 'brand' },
  { w: 'تواصل', s: 'التسويق عبر منصات التواصل', d: 'الإبداع والمحتوى', x: 400, y: -1050, f: 'y', fs: 175, life: 'social' },
  { w: 'محتوى', s: 'تسويق المحتوى', d: 'الإبداع والمحتوى', x: 1050, y: -450, f: 'x', fs: 175, life: 'content' },
  { w: 'إنتاج', s: 'الإنتاج الإعلامي', d: 'الإبداع والمحتوى', x: 1050, y: 250, f: 'y', fs: 185, life: 'prod' },
  { w: 'إعلانات', s: 'التسويق بالأداء والإعلانات الممولة', d: 'الإعلانات والأداء', x: 650, y: 950, f: 'x', fs: 165, life: 'ads' },
  { w: 'بحث', s: 'تحسين محركات البحث', d: 'التقنية والقنوات الرقمية', x: -100, y: 1100, f: 'y', fs: 200, life: 'search' },
  { w: 'مواقع', s: 'تطوير المواقع وتحسين التحويل', d: 'التقنية والقنوات الرقمية', x: -800, y: 850, f: 'x', fs: 180, life: 'web' },
  { w: 'تحليلات', s: 'التحليلات والنمو', d: 'التقنية والقنوات الرقمية', x: -1150, y: 150, f: 'y', fs: 160, life: 'data' },
];
const IMP = [4.0, 6.5, 8.5, 10.5, 12.5, 14.5, 16.5, 18.5, 20.5]; B.forEach((b, i) => { b.t = IMP[i]; b.i = i; });
const TAMM = { w: 'تمّ', x: 100, y: 100, f: 'y', fs: 780, t: 28.5, big: true };
const ALL = [...B, TAMM];
const FACE = { y: { U: [C30, S30], E: [C30, -S30], u: [1, 0], n: [0, 1], e: [0, -1] }, x: { U: [C30, -S30], E: [-C30, -S30], u: [0, -1], n: [1, 0], e: [-1, 0] } };
const DEPTH = 0.3;
const T_CUT = 2.4, T_WORLD = 2.45, T_STRAT = 4.0, T_OVER = 21.3, T_LINE = 22.3, T_WIPE = 31.6, T_END = 32.25;

// ---------- camera ----------
const ZF = VERT ? 1.12 : 1.3, ZO = VERT ? 0.36 : 0.48;
let cam = { x: 0, y: 0, z: 1 }, shX = 0, shY = 0;
const isoXY = (x, y, z = 0) => [(x - y) * C30, (x + y) * S30 - z];
const P = (x, y, z = 0) => { const [ix, iy] = isoXY(x, y, z); return [(ix - cam.x) * cam.z + W / 2 + shX, (iy - cam.y) * cam.z + H / 2 + shY]; };
function focus(b, extra = 0) {   // the iso point at the middle of a standing word
  const F = FACE[b.f], [ix, iy] = isoXY(b.x, b.y, 0), h = b.fs * 0.62, D = b.fs * DEPTH;
  return [ix + F.E[0] * D * 0.5 + (VERT ? 0 : 150), iy - h * 0.55 + F.E[1] * D * 0.5 - extra + (VERT ? 40 : 60)];
}
let KEYS = [];
function buildKeys() {
  const k = (t, xy, z) => KEYS.push({ t, x: xy[0], y: xy[1], z });
  const mid = (a, b2, w = 0.5) => [lerp(a[0], b2[0], w), lerp(a[1], b2[1], w)];
  const p0 = focus(B[0]);
  k(0, p0, ZF * 0.24); k(T_WORLD, p0, ZF * 0.28); k(3.55, p0, ZF); k(4.55, p0, ZF * 1.02);
  k(5.45, mid(p0, [0, -150], 0.55), ZO * 1.05);                                   // strategy pulls back to show the plan
  for (let i = 1; i < B.length; i++) { const f = focus(B[i], B[i].life === 'search' ? 60 : 0); k(B[i].t - 0.46, f, ZF); k(B[i].t + 0.95, f, ZF * 1.06); }
  const ov = VERT ? [0, -110] : [0, -250];
  k(T_OVER, focus(B[8]), ZF * 1.1); k(22.4, ov, ZO); k(26.2, ov, ZO * 1.06); k(27.6, [0, ov[1] + 20], ZO * 1.1);
  k(28.5, [0, ov[1] + 20], ZO * 1.13); k(31.5, [0, -280], ZO * 1.55); k(DUR, [0, -280], ZO * 1.6);
}
function camAt(t) {
  let a = KEYS[0], b2 = KEYS[KEYS.length - 1];
  for (let i = 0; i < KEYS.length - 1; i++) if (t >= KEYS[i].t && t <= KEYS[i + 1].t) { a = KEYS[i]; b2 = KEYS[i + 1]; break; }
  if (t > KEYS[KEYS.length - 1].t) a = b2;
  const u = a === b2 ? 0 : eio(seg(t, a.t, b2.t));
  cam.x = lerp(a.x, b2.x, u); cam.y = lerp(a.y, b2.y, u); cam.z = Math.exp(lerp(Math.log(a.z), Math.log(b2.z), u));
  shX = 0; shY = 0;
  for (const b of ALL) { const dt = t - b.t; if (dt < 0 || dt > 0.8) continue; const A = (b.big ? 30 : b.i === 0 ? 11 : 7) * Math.exp(-8 * dt); shX += A * Math.sin(dt * 58 + b.fs); shY += A * Math.cos(dt * 47 + b.fs * 0.5); }
}

// ---------- drawing helpers ----------
function poly(pts, fill, stroke, lw = 1) { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function box(x, y, z0, w, d, h, top, left, right) {   // world box x..x+w, y..y+d, z0..z0+h; three visible faces
  const z1 = z0 + h;
  poly([P(x + w, y, z0), P(x + w, y + d, z0), P(x + w, y + d, z1), P(x + w, y, z1)], right);
  poly([P(x, y + d, z0), P(x + w, y + d, z0), P(x + w, y + d, z1), P(x, y + d, z1)], left);
  poly([P(x, y, z1), P(x + w, y, z1), P(x + w, y + d, z1), P(x, y + d, z1)], top);
}
function planeQuad(b, u0, u1, z0, z1, off = 0) {   // a rectangle on a word's face plane (off: along the facing normal)
  const F = FACE[b.f], pt = (u, z) => P(b.x + F.u[0] * u + F.n[0] * off, b.y + F.u[1] * u + F.n[1] * off, z);
  return [pt(u0, z0), pt(u1, z0), pt(u1, z1), pt(u0, z1)];
}
function groundPt(b, u, n) { const F = FACE[b.f]; return [b.x + F.u[0] * u + F.n[0] * n, b.y + F.u[1] * u + F.n[1] * n]; }
function ellipse(x, y, r, stroke, lw, fill) { const [sx, sy] = P(x, y, 0); ctx.beginPath(); ctx.ellipse(sx, sy, r * 1.2247 * cam.z, r * 0.7071 * cam.z, 0, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
const font = (wt, px, fam = 'Plex') => `${wt} ${px}px ${fam}`;

// the word as a building: the face drawn on its plane, extruded backwards in layers
function word(b, o = {}) {
  const F = FACE[b.f], z = cam.z, lift = o.lift || 0, sq = o.sq || 1;
  const [ox, oy] = P(b.x, b.y, lift), Ux = F.U[0] * z, Uy = F.U[1] * z, Vy = z * sq;
  const D = b.fs * DEPTH * (o.depth ?? 1), n = Math.max(4, Math.min(160, Math.ceil(D * z / 0.85)));
  ctx.font = font(o.wt || 700, b.fs); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.direction = 'rtl';
  const near = o.near || (b.f === 'y' ? '#8D899B' : '#77738A'), far = o.far || '#1C1B24', base = -b.desc;
  ctx.globalAlpha = o.alpha ?? 1;
  if (D > 0 && !o.outline) for (let i = n; i >= 1; i--) {
    const k = i / n; ctx.setTransform(Ux, Uy, 0, Vy, ox + F.E[0] * D * k * z, oy + F.E[1] * D * k * z * sq);
    ctx.fillStyle = mix(near, far, Math.pow(k, 0.8)); ctx.fillText(b.w, 0, base);
  }
  ctx.setTransform(Ux, Uy, 0, Vy, ox, oy);
  if (o.outline) { ctx.strokeStyle = o.front || COL.soft; ctx.lineWidth = 2.2 / z; ctx.strokeText(b.w, 0, base); }
  else { ctx.fillStyle = o.front || (b.f === 'y' ? COL.soft : '#E4E1EC'); ctx.fillText(b.w, 0, base); }
  if (o.fill !== undefined && o.fill > 0) {   // the outline fills from the ground up
    ctx.save(); ctx.beginPath(); ctx.rect(-b.wd, base - b.asc * o.fill, b.wd * 2, b.asc + b.desc + 20); ctx.clip();
    for (let i = n; i >= 1; i--) { const k = i / n; ctx.setTransform(Ux, Uy, 0, Vy, ox + F.E[0] * D * k * z, oy + F.E[1] * D * k * z); ctx.fillStyle = mix(near, far, Math.pow(k, 0.8)); ctx.fillText(b.w, 0, base); }
    ctx.setTransform(Ux, Uy, 0, Vy, ox, oy); ctx.fillStyle = COL.soft; ctx.fillText(b.w, 0, base); ctx.restore();
  }

}
function shadow(b, lift, a) {
  if (a <= 0.01) return;
  const F = FACE[b.f], z = cam.z, [ox, oy] = P(b.x, b.y, 0), kx = -0.55, ky = 0.35, s = 1 + lift / 900;
  ctx.font = font(700, b.fs); ctx.textAlign = 'center'; ctx.direction = 'rtl'; ctx.globalAlpha = a; ctx.fillStyle = '#000'; ctx.filter = `blur(${Math.round(4 + lift * z / 60)}px)`;
  ctx.setTransform(F.U[0] * z * s, F.U[1] * z * s, (kx - ky) * C30 * z * s, (kx + ky) * S30 * z * s, ox, oy); ctx.fillText(b.w, 0, -b.desc);
  ctx.filter = 'none'; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

// ---------- the plan: a ring road and spokes to the centre, drawn by strategy ----------
let ROADS = [], PLOTS = [];
function anchor(b) { const F = FACE[b.f]; const g = (v) => Math.round(v / 50) * 50; return [g(b.x + F.n[0] * 110), g(b.y + F.n[1] * 110)]; }
function buildRoads() {
  const A = B.map(anchor);
  for (let i = 0; i < A.length; i++) { const a = A[i], c = A[(i + 1) % A.length]; ROADS.push({ pts: [a, [c[0], a[1]], c], ring: true, to: (i + 1) % A.length }); }
  for (let i = 0; i < A.length; i++) { const a = A[i]; ROADS.push({ pts: [a, [a[0], 260 * Math.sign(a[1] || 1)], [0, 260 * Math.sign(a[1] || 1)], [0, 200 * Math.sign(a[1] || 1)]], spoke: true, from: i }); }
  for (const r of ROADS) { r.len = []; let L = 0; for (let i = 1; i < r.pts.length; i++) { L += Math.hypot(r.pts[i][0] - r.pts[i - 1][0], r.pts[i][1] - r.pts[i - 1][1]); r.len.push(L); } r.L = L; }
}
function roadPath(r, frac) {
  const end = r.L * frac; ctx.beginPath(); let p = P(r.pts[0][0], r.pts[0][1]); ctx.moveTo(p[0], p[1]);
  for (let i = 1; i < r.pts.length; i++) {
    const L0 = i === 1 ? 0 : r.len[i - 2], L1 = r.len[i - 1];
    if (end >= L1) { p = P(r.pts[i][0], r.pts[i][1]); ctx.lineTo(p[0], p[1]); continue; }
    const k = (end - L0) / (L1 - L0); p = P(lerp(r.pts[i - 1][0], r.pts[i][0], k), lerp(r.pts[i - 1][1], r.pts[i][1], k)); ctx.lineTo(p[0], p[1]); break;
  }
}
function plotOutline(b, a, pad = 50) {
  const F = FACE[b.f], D = b.fs * DEPTH, u0 = -b.wd / 2 - pad, u1 = b.wd / 2 + pad, n0 = -D - pad, n1 = pad + 20;
  const c = [[u0, n0], [u1, n0], [u1, n1], [u0, n1]].map(([u, n]) => P(...groundPt(b, u, n)));
  ctx.setLineDash([7, 9]); poly(c, null, rgba(COL.mu, a), 1.4); ctx.setLineDash([]);
}

// ---------- each service comes alive ----------
const LIFE = {
  roads(b, lt) {},
  brand(b, lt) {   // the brand palette lands in front of the word
    const cols = [COL.ob, COL.gr, COL.soft, COL.mu, COL.pu];
    cols.forEach((c, i) => { const p = back(seg(lt, 0.45 + i * 0.07, 0.75 + i * 0.07)); if (p <= 0) return; const s = 70 * p, [gx, gy] = groundPt(b, -170 + i * 85, 200);
      box(gx - s / 2, gy - s / 2, 0, s, s, 14 * p, c, mix(c, '#000000', 0.25), mix(c, '#000000', 0.4)); if (c === COL.ob) poly([P(gx - s / 2, gy - s / 2, 14 * p), P(gx + s / 2, gy - s / 2, 14 * p), P(gx + s / 2, gy + s / 2, 14 * p), P(gx - s / 2, gy + s / 2, 14 * p)], null, rgba(COL.soft, 0.3), 1); });
  },
  social(b, lt, front) {   // a feed of cards rising out of the roof, with reactions
    if (!front) return; const top = b.asc + 40;
    for (let k = 0; k < 5; k++) {
      const s = lt * 1.2 - k * 0.22; if (s < 0) continue; const zc = top + s * 260, a = clamp(1 - (s - 0.9) / 0.6) * clamp(s * 6);
      if (a <= 0) continue; const off = (k % 2 ? 1 : -1) * 70;
      ctx.globalAlpha = a; poly(planeQuad(b, off - 90, off + 90, zc, zc + 110, 30), rgba(COL.soft, 0.94), null);
      const q = planeQuad(b, off + 40, off + 72, zc + 66, zc + 98, 31); poly(q, COL.pu);
      poly(planeQuad(b, off - 70, off + 25, zc + 82, zc + 92, 31), '#3A3846'); poly(planeQuad(b, off - 70, off + 5, zc + 62, zc + 70, 31), '#8D899B');
      poly(planeQuad(b, off - 70, off + 70, zc + 14, zc + 50, 31), '#D8D5E0');
      ctx.globalAlpha = 1;
    }
  },
  content(b, lt) {   // pages fly out of the word and land around it
    for (let k = 0; k < 7; k++) {
      const s = seg(lt, 0.12 + k * 0.08, 0.72 + k * 0.08); if (s <= 0) continue;
      const ang = -0.6 + k * 0.55, R = 260 + (k % 3) * 70, [sx0, sy0] = groundPt(b, 0, -40), [ex, ey] = groundPt(b, Math.cos(ang) * R, Math.sin(ang) * R * 0.6 + 120);
      const x = lerp(sx0, ex, eo(s)), y = lerp(sy0, ey, eo(s)), zc = Math.sin(Math.PI * s) * 320 + (1 - s) * b.asc * 0.6, w = 60, d = 80;
      poly([P(x - w / 2, y - d / 2, zc), P(x + w / 2, y - d / 2, zc), P(x + w / 2, y + d / 2, zc), P(x - w / 2, y + d / 2, zc)], rgba(COL.soft, 0.95), null);
      for (let l = 0; l < 3; l++) { const yy = y - d / 2 + 18 + l * 18; ctx.beginPath(); const a1 = P(x - w / 2 + 10, yy, zc), a2 = P(x + w / 2 - 10 - (l === 2 ? 18 : 0), yy, zc); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.strokeStyle = l ? '#8D899B' : COL.pu; ctx.lineWidth = Math.max(1, 3 * cam.z); ctx.stroke(); }
    }
  },
  prod(b, lt) {},   // drawn as an overlay (viewfinder) and a light cone
  ads(b, lt, front) {   // billboards pop up and an arrow launches from the roof
    if (front) {
      [[-330, 0.2], [330, 0.32]].forEach(([u, t0]) => { const p = back(seg(lt, t0, t0 + 0.35)); if (p <= 0) return;
        const pole = planeQuad(b, u - 6, u + 6, 0, 150 * p, 60); poly(pole, '#3A3846');
        poly(planeQuad(b, u - 110, u + 110, 150 * p, 150 * p + 130 * p, 60), COL.gr, rgba(COL.soft, 0.5), 1.5);
        const bars = [0.35, 0.55, 0.8]; bars.forEach((h, i) => { const g = eo(seg(lt, t0 + 0.3 + i * 0.08, t0 + 0.6 + i * 0.08)); poly(planeQuad(b, u - 80 + i * 60, u - 40 + i * 60, 150 * p + 18, 150 * p + 18 + 95 * h * g, 61), i === 2 ? COL.pu : '#8D899B'); }); });
      const s = seg(lt, 0.55, 1.25); if (s > 0) {
        const z0 = b.asc + 30, z1 = z0 + 900 * eo(s), F = FACE[b.f], a = 1 - seg(lt, 1.3, 1.7);
        const p0 = P(b.x, b.y, z0), p1 = P(b.x, b.y, z1); ctx.globalAlpha = a; ctx.strokeStyle = COL.pu; ctx.lineWidth = Math.max(2, 7 * cam.z); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); const ah = 40 * cam.z;
        ctx.beginPath(); ctx.moveTo(p1[0] - ah, p1[1] + ah); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p1[0] + ah, p1[1] + ah); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineCap = 'butt';
      }
    }
  },
  search(b, lt, front) {   // the search bar appears; the word rises on its column above its neighbours
    if (!front) return; const p = back(seg(lt, 0.05, 0.4)); if (p <= 0) return; const z0 = b.asc + 70 + rise(b, lt);
    const q = planeQuad(b, -230 * p, 230 * p, z0, z0 + 70, 40); poly(q, rgba(COL.soft, 0.96));
    const c = planeQuad(b, 150 * p, 190 * p, z0 + 18, z0 + 52, 41); ctx.lineWidth = Math.max(1.5, 4 * cam.z); poly(c, null, COL.pu, Math.max(1.5, 4 * cam.z));
    const typed = clamp((lt - 0.3) / 0.5); if (typed > 0) poly(planeQuad(b, 120 - 300 * typed, 120, z0 + 30, z0 + 40, 41), '#8D899B');
  },
  web(b, lt, front) {},   // the frame is drawn behind the word
  data(b, lt) {   // a radar sweeps at its base; three bars grow beside it
    const [gx, gy] = groundPt(b, 0, 180), r = 280, a = clamp(lt * 3) * (1 - seg(lt, 3.5, 4.5) * 0.4);
