<script>
'use strict';
// «رحلة العميل معانا» — 9:16, Arabic, Plex only, 120 BPM, 56 s.
// Eight stations from the brief to the report; real client footage (Altopiano, Tech Hive, Niimee), hands-only Pexels stock,

const W = 1080, H = 1920, BEAT = 0.5, DUR = 56;
window.DUR_S = DUR;
const PU = '#6C35FF', OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = '#96939F', LI = '#C9C6D2';
const SEQ = '__SEQ__', SEQN = __SEQN__;

const CACHE = new Map();

  if (!CACHE.has(key)) { const im = new Image(); im.src = `${SEQ}/${id}/${String(k).padStart(3, '0')}.jpg`; CACHE.set(key, im.decode().then(() => im)); if (CACHE.size > 100) CACHE.delete(CACHE.keys().next().value); }
  return CACHE.get(key);
}
function font(px, w, latin) { c.font = `${w} ${px}px ${latin ? 'PlexL' : 'Plex, PlexL'}`; c.direction = latin ? 'ltr' : 'rtl'; }
function T(s, x, y, px, { w = 700, col = WH, al = 'center', a = 1, latin = false } = {}) {
  if (a <= 0 || !s) return;
  font(px, w, latin); c.textAlign = al; c.fillStyle = col; c.globalAlpha = a; c.fillText(s, x, y); c.globalAlpha = 1; c.direction = 'ltr';
}
const tw = (s, px, w = 700, latin = false) => { font(px, w, latin); const v = c.measureText(s).width; c.direction = 'ltr'; return v; };

let SYMBOL;

  if (w < 2 || h < 2) return;

  const s = Math.max(w / im.width, h / im.height) * zoom, dw = im.width * s, dh = im.height * s;
  c.save(); c.beginPath(); c.roundRect(x, y, w, h, r); c.clip();

}
// kinetic line: rises into its band on a spring
function line(s, y, px, t0, t, o = {}) {
  const u = spr(t - t0, 20); if (u <= 0) return;
  c.save(); c.beginPath(); c.rect(0, y - px * 1.15, W, px * 1.6); c.clip(); T(s, o.x ?? W / 2, y + px * 1.3 * (1 - u), px, o); c.restore();
}
function chip(s, x, y, t0, t, col = PU, px = 34, txt = WH) {
  const u = spr(t - t0, 22); if (u <= 0) return;

  c.save(); c.translate(x, y); c.scale(u, u); RR(-w / 2, -h / 2, w, h, h / 2, col); T(s, 0, px * 0.36, px, { col: txt }); c.restore();
}
function topShade(a = 0.8) { const g = c.createLinearGradient(0, 180, 0, 640); g.addColorStop(0, `rgba(9,9,13,${a})`); g.addColorStop(1, 'rgba(9,9,13,0)'); c.fillStyle = g; c.fillRect(0, 180, W, 460); }
function botShade(a = 0.85) { const g = c.createLinearGradient(0, 1250, 0, 1700); g.addColorStop(0, 'rgba(9,9,13,0)'); g.addColorStop(1, `rgba(9,9,13,${a})`); c.fillStyle = g; c.fillRect(0, 1250, W, 450); }
function bracketsREC(t, t0) {   // a viewfinder: corner brackets, REC and running timecode

  for (const [x, y, sx, sy] of [[X0, Y0, 1, 1], [X1, Y0, -1, 1], [X0, Y1, 1, -1], [X1, Y1, -1, -1]]) { c.beginPath(); c.moveTo(x + sx * L, y); c.lineTo(x, y); c.lineTo(x, y + sy * L); c.stroke(); }
  c.globalAlpha = 1;
  if ((t - t0) % 0.5 < 0.32) circle(X0 + 40, Y0 + 52, 12, PU);
  T('REC', X0 + 64, Y0 + 64, 32, { al: 'left', latin: true });
  const s = Math.floor(t), f = Math.floor((t % 1) * 30);
  T(`00:00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, X1 - 30, Y0 + 64, 28, { al: 'right', latin: true, w: 500 });
}

// ---------- the journey ----------
const ST = [
  { a: 3.5, b: 9, name: 'البريف' }, { a: 9, b: 16, name: 'التحضير' }, { a: 16, b: 21, name: 'الفكرة' }, { a: 21, b: 28, name: 'التصوير والإنتاج' },
  { a: 28, b: 33, name: 'المحتوى والفيجوالز' }, { a: 33, b: 41, name: 'الميديا باينج والأداء' }, { a: 41, b: 46, name: 'SEO' }, { a: 46, b: 51.5, name: 'التقارير' }];
const BLADES = [3.5, 9, 16, 21, 28, 33, 41, 46, 51.5];

// the map: a winding path with eight stations (intro)
const MAP = ST.map((s, i) => [i % 2 ? 620 : 460, 520 + i * 130]);
function intro(t) {
  bg();
  if (t < 1.6) { line('كل عميل بيبدأ بجملة.', 870, 84, 0.05, t); line('والباقي رحلة.', 1010, 104, 0.6, t, { col: PU }); return; }
  const u = E(t, 1.6, 2.9, (x) => x);
  T('رحلة العميل معانا', W / 2, 400, 64, { a: E(t, 1.6, 1.9) });
  c.save(); c.strokeStyle = PU; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath();
  const n = MAP.length - 1, d = u * n, k = Math.floor(d);
  c.moveTo(...MAP[0]); for (let i = 1; i <= Math.min(k, n); i++) c.lineTo(...MAP[i]);
  if (k < n) c.lineTo(lerp(MAP[k][0], MAP[k + 1][0], d - k), lerp(MAP[k][1], MAP[k + 1][1], d - k)); c.stroke(); c.restore();
  MAP.forEach(([x, y], i) => {
    const s = spr(t - 1.6 - i * (1.3 / n), 24); if (s <= 0) return;
    circle(x, y, 30 * s, WH); T(String(i + 1), x, y + 11, 30 * s, { col: OB, latin: true });
    T(ST[i].name, i % 2 ? x + 56 : x - 56, y + 14, 40, { al: i % 2 ? 'left' : 'right', a: s, w: 700 });
  });
}
function hud(t) {   // station counter and progress, in the safe zone
  const i = ST.findIndex((s) => t >= s.a && t < s.b); if (i < 0) return;
  const s = ST[i], u = E(t, s.a, s.a + 0.35);
  c.save(); c.beginPath(); c.rect(0, 220, W, 80); c.clip(); T(s.name, 1000, 285 + 70 * (1 - u), 44, { al: 'right' }); c.restore();
  T(`${String(i + 1).padStart(2, '0')} / 08`, 80, 282, 28, { al: 'left', latin: true, w: 500, col: LI });
  for (let k = 0; k < 8; k++) { const x = 80 + k * 117; RR(x, 312, 105, 8, 4, k <= i ? PU : WH, k < i ? 1 : k === i ? 1 : 0.3); }
}
// 1 · the brief
const BRIEF = [['البراند', 'متجر إلكتروني'], ['الهدف', 'مبيعات أكتر'], ['الجمهور', '؟'], ['المنصات', '؟']];
async function brief(t) {
  if (t < 7.0) {
    await clip('s_type', t - 3.5, 0, 0, W, H, 0, { dim: 0.45 });
    const u = spr(t - 3.7, 16); RR(90, 640 + 80 * (1 - u), 900, 640, 36, OB, 0.9 * u);
    if (u > 0.3) {
      T('البريف', 930, 740, 52, { al: 'right', col: PU });
      BRIEF.forEach(([k, v], i) => {
        const t0 = 4.1 + i * 0.55, n = Math.max(0, Math.min(v.length, Math.floor((t - t0 - 0.15) / 0.045)));
        if (t < t0) return; const y = 860 + i * 110;
        T(k, 930, y, 40, { al: 'right', col: MU, w: 500 }); T(v.slice(0, n), 650, y, 44, { al: 'right', col: v === '؟' ? PU : WH });
        c.fillStyle = WH; c.globalAlpha = 0.12; c.fillRect(150, y + 34, 780, 2); c.globalAlpha = 1;
      });
      const hl = E(t, 6.3, 6.6); if (hl > 0) { const w = tw('مبيعات أكتر', 44); c.fillStyle = PU; c.fillRect(650 - w * hl, 1004, w * hl, 6); }
    }
    return;
  }
  bg(); line('مش هنبدأ بالإعلان.', 880, 84, 7.05, t); line('هنبدأ بالأسئلة.', 1020, 100, 7.6, t, { col: PU });
  ['مين بيشتري؟', 'ليه؟', 'منين؟'].forEach((q, i) => chip(q, 300 + i * 240, 1200, 8.0 + i * 0.15, t, GR, 34));
}
// 2 · preparation: four steps
async function prep(t) {
  if (t < 9.9) {
    await clip('s_cards', t - 9, 0, 0, W, H, 0, { dim: 0.78 });
    line('قبل أي تصميم…', 860, 70, 9.05, t); line('4 خطوات تحضير.', 990, 96, 9.4, t, { col: PU }); return;
  }
  const steps = [[9.9, 'بحث السوق والمنافسين'], [11.4, 'الجمهور'], [12.9, 'التموضع'], [14.4, 'الخطة']];
  const i = steps.findLastIndex((s) => t >= s[0]), t0 = steps[i][0], lt = t - t0;
  await clip('s_cards', t - 9, 0, 0, W, H, 0, { dim: 0.86, zoom: 1.15 });
  T(String(i + 1).padStart(2, '0'), 960, 560, 120, { al: 'right', latin: true, col: PU, a: spr(lt, 20) });
  line(steps[i][1], 660, 64, t0 + 0.05, t, { x: 960, al: 'right' });
  const cy = 1080;

    for (let k = 0; k < 3; k++) { const s = spr(lt - 0.1 - k * 0.12, 18); const x = 120 + k * 290; RR(x, cy - 180 + 60 * (1 - s), 260, 360, 24, GR, s);
      RR(x + 28, cy - 140, 120, 16, 8, WH, 0.7 * s); RR(x + 28, cy - 110, 180, 12, 6, MU, 0.4 * s); RR(x + 28, cy - 60, 204, 150, 14, MU, 0.12 * s); T(`منافس ${k + 1}`, x + 232, cy + 150, 30, { al: 'right', a: s, col: LI }); }
    const mx = lerp(150, 900, E(lt, 0.4, 1.4, eio)); c.strokeStyle = PU; c.lineWidth = 12; c.beginPath(); c.arc(mx, cy - 10, 70, 0, 7); c.stroke(); c.lineWidth = 16; c.lineCap = 'round'; c.beginPath(); c.moveTo(mx + 50, cy + 40); c.lineTo(mx + 110, cy + 100); c.stroke();
  }

    const p = E(lt, 0.7, 1.2, eio), ux = lerp(540, 760, p), uy = lerp(cy, cy - 220, p); circle(ux, uy, 34 * spr(lt - 0.5, 20), PU);
    if (p > 0.6) T('مكانك', ux - 50, uy + 12, 36, { al: 'right', a: E(lt, 1.0, 1.2) });

    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const n = r * cols + k, s = spr(lt - 0.05 - n * 0.022, 24); const x = x0 + k * cw, y = y0 + r * ch;

    }

  }
}
// 3 · the idea
async function idea(t) {
  if (t < 17.6) {
    await clip('t_street', t - 16, 0, 0, W, H, 0, { dim: 0.72 });
    line('فكرة واحدة…', 860, 84, 16.1, t); line('تشيل الحملة كلها.', 1000, 92, 16.6, t, { col: PU });
    T('Tech Hive · روبوت عايش مهمة', W / 2, 1120, 36, { w: 500, col: LI, a: E(t, 17.0, 17.3) }); return;
  }
  bg();
  const P = [['t_street', 'مشهد 1 · مهمة'], ['t_pc', 'مشهد 2 · مكافأة'], ['t_done', 'مشهد 3 · تمّت']], pw = 320, ph = 569, gap = 20, y0 = 640;
  const z = E(t, 20.2, 20.75, eio);
  line('ستوري بورد', 520, 56, 17.65, t, { a: 1 - z });
  for (let k = 0; k < 3; k++) {
    const s = spr(t - 17.8 - 0.45 * k, 18); if (s <= 0) continue;
    let x = W / 2 + (3 * pw + 2 * gap) / 2 - (k + 1) * pw - k * gap, y = y0 + 80 * (1 - s), w = pw, h = ph, r = 24;
    if (k === 2) { x = lerp(x, 0, z); y = lerp(y, 0, z); w = lerp(pw, W, z); h = lerp(ph, H, z); r = lerp(24, 0, z); } else y += 1000 * z;
    // the panel draws on as a sketch before the shot fills it
    const fill = E(t, 17.95 + 0.45 * k, 18.35 + 0.45 * k);
    SR(x, y, w, h, r, WH, 4, 0.7 * (1 - fill));
    if (fill > 0) { c.save(); c.beginPath(); c.rect(x, y + h * (1 - fill), w, h * fill); c.clip(); await clip(P[k][0], t - 17.8 - 0.45 * k, x, y, w, h, r); c.restore(); }
    if (z < 0.2) T(P[k][1], x + pw / 2, y + ph + 60, 30, { a: s, col: k === 2 ? PU : LI });
  }
}
// 4 · shooting and production
async function prod(t) {
  if (t < 22.6) {
    bg(); const h = 820;
    await clip('s_cam1', t - 21, 60, 500, 470, h, 30); await clip('s_cam2', t - 21, 550, 500 + 120 * (1 - spr(t - 21.1, 16)), 470, h, 30);
    line('تصوير على مقاس المنصة', 1460, 52, 21.3, t); return;
  }
  if (t < 24.6) {
    const u = E(t, 22.6, 23.0, eio), sx = lerp(W, W / 2, u);
    await clip('a_day', t - 22.6, 0, 0, sx, H, 0); await clip('a_night', t - 22.6, sx, 0, W - sx + 1, H, 0);
    c.fillStyle = OB; c.fillRect(sx - 4, 0, 8, H); botShade(0.8);
    chip('نهار', W * 0.25, 1420, 22.8, t, OB); chip('ليل', W * 0.75, 1420, 23.1, t, OB);
    T('Altopiano · مكان بمودين', W / 2, 1560, 40, { a: E(t, 23.3, 23.6) }); return;
  }
  const S = [['a_dough', 'عجينة'], ['a_sauce', 'صوص'], ['a_oven', 'فرن'], ['a_table', 'على الطاولة']];
  const i = Math.min(3, Math.floor((t - 24.6) / 0.85)), lt = t - 24.6 - i * 0.85;
  await clip(S[i][0], lt, 0, 0, W, H, 0, { zoom: 1 + 0.06 * (1 - spr(lt, 14)) });
  bracketsREC(t, 24.6);
  chip(`${i + 1}  ${S[i][1]}`, W / 2, 1460, 24.6 + i * 0.85, t, OB);
}
// 5 · content and visuals
async function content(t) {
  if (t < 30.4) {
    bg();
    const z = E(t, 28.0, 28.55, eio), cw = 315, ch = 560, gap = 18, x0 = (W - (3 * cw + 2 * gap)) / 2, y0 = 400, ids = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'];
    for (let k = 5; k >= 0; k--) {
      const col = k % 3, row = Math.floor(k / 3);
      let x = x0 + col * (cw + gap), y = y0 + row * (ch + gap), w = cw, h = ch, r = 24;
      if (k === 0) { x = lerp(0, x, z); y = lerp(0, y, z); w = lerp(W, cw, z); h = lerp(H, ch, z); r = lerp(0, 24, z); } else if (z < 0.6) continue;

    }
    line('حملة كاملة لموسم واحد', 1612, 46, 28.7, t); return;
  }
  bg();
  const pw = 440, ph = 782, y = 560, s1 = spr(t - 30.4, 16), s2 = spr(t - 30.6, 16);
  await clip('a_end', t - 30.4, 70, y + 140 * (1 - s1), pw, ph, 44); SR(70, y + 140 * (1 - s1), pw, ph, 44, '#2A2A33', 8);
  c.fillStyle = '#EEE9E0'; RR(570, y + 140 * (1 - s2), pw, ph, 44, '#EEE9E0'); await clip('n_feed', t - 30.4 + 0.3, 570, y + 140 * (1 - s2) + 116, pw, 550, 0, { speed: 2.4 }); SR(570, y + 140 * (1 - s2), pw, ph, 44, '#2A2A33', 8);
  chip('ريلز', 290, y - 50, 30.6, t, GR, 30); chip('بوست', 790, y - 50, 30.75, t, GR, 30);
  line('لكل منصة لغتها.', 1460, 60, 31.0, t);
}
// 6 · media buying and performance
const CH6 = ['Meta', 'Google', 'Snapchat', 'TikTok'];
async function perf(t) {
  if (t < 36.2) {
    bg(); line('هوكين لنفس الإعلان', 470, 60, 33.1, t);
    const pw = 440, ph = 782, y = 590;
    for (let k = 0; k < 2; k++) {
      const s = spr(t - 33.3 - 0.25 * k, 18), x = k === 0 ? W - 70 - pw : 70;
      await clip(k === 0 ? 't_hookA' : 't_hookB', t - 33.3 - 0.25 * k, x, y + 120 * (1 - s), pw, ph, 36);
      chip(k === 0 ? 'A' : 'B', x + pw / 2, y - 6 + 120 * (1 - s), 33.5 + 0.25 * k, t, PU, 34);
    }
    line('نختبر… والأرقام تختار.', 1470, 48, 34.6, t, { col: LI, w: 500 }); return;
