<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>Client work</title>
<style>

<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// Client work reel (9:16, Arabic, Plex only). Real client ads cut on the beat (120 BPM), chapters joined by the 45° blade.
// Shots avoid real faces and the clients' contact end cards (shots.json). window.seek(t) is async (frames load on demand).
const W = 1080, H = 1920, BEAT = 0.5, DUR = 36;
window.DUR_S = DUR;
const PU = '#6C35FF', OB = '#09090D', GR = '#17171E', WH = '#F5F3FA', MU = '#96939F';
const SEQ = '__SEQ__', SEQN = __SEQN__;
const c = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x), lerp = (a, b, u) => a + (b - a) * u, inv = (a, b, x) => clamp((x - a) / (b - a));

const E = (t, a, b, f = eo) => f(inv(a, b, t));
const CACHE = new Map();
function frameImg(id, k) {
  k = Math.max(1, Math.min(SEQN[id], k)); const key = id + '/' + k;
  if (!CACHE.has(key)) { const im = new Image(); im.src = `${SEQ}/${id}/${String(k).padStart(3, '0')}.jpg`; CACHE.set(key, im.decode().then(() => im)); if (CACHE.size > 90) CACHE.delete(CACHE.keys().next().value); }

function T(s, x, y, px, { w = 700, col = WH, al = 'center', a = 1, latin = false } = {}) {

}
const RR = (x, y, w, h, r, fill, a = 1) => { c.beginPath(); c.roundRect(x, y, w, h, r); c.globalAlpha = a; c.fillStyle = fill; c.fill(); c.globalAlpha = 1; };
let SYMBOL;
async function clip(id, lt, x, y, w, h, r = 0, { speed = 1, dim = 0, zoom = 1 } = {}) {   // a clip, cover-fit in a rounded rect, at its own local time

  const s = Math.max(w / im.width, h / im.height) * zoom, dw = im.width * s, dh = im.height * s;

}
function line(s, y, px, t0, t, o = {}) { const u = spr(t - t0, 20); if (u <= 0) return; c.save(); c.beginPath(); c.rect(0, y - px * 1.15, W, px * 1.55); c.clip(); T(s, o.x ?? W / 2, y + px * 1.3 * (1 - u), px, o); c.restore(); }

function chip(s, x, y, t0, t, col = PU) {

function intro(t) {
  bg();
  line('إزاي فكرة', 860, 112, 0.05, t);
  line('بتبقى إعلان؟', 1010, 120, 0.55, t, { col: PU });

function card(n, service, who, t0, t) {

async function alto(t) {

async function niimee(t) {

}

  bg();

  T('وكالة تسويق رقمي وأداء', W / 2, 1100, 40, { w: 500, col: MU, a: E(t, 34.3, 34.6) });
  T('saytamm.com', W / 2, 1180, 38, { w: 500, a: E(t, 34.3, 34.6), latin: true });

async function sceneAt(t) {
  if (t < 2) return intro(t);
  if (t < 14.5) return alto(t);
  if (t < 27) return tech(t);
  if (t < 32) return niimee(t);

}
const BLADES = [2, 14.5, 27, 32];
async function draw(t) {
  await sceneAt(t);
  for (const t0 of BLADES) {
    const u = E(t, t0 - 0.22, t0 + 0.06, eio); if (u <= 0 || u >= 1) continue;

window.seek = async (t) => { await draw(Math.max(0, Math.min(DUR - 1e-4, t))); return true; };
