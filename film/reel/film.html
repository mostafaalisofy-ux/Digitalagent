<!doctype html>
<html><head><meta charset="utf-8">
<!-- SayTamm showreel, 30 s, cut to an original 128 BPM track. Work by the SayTamm team; no other agency's marks appear. -->
<style>
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-500.woff2); font-weight: 500; }
  @font-face { font-family: Sat; src: url(__SAT__/Satoshi-700.woff2); font-weight: 700; }
  @font-face { font-family: Plex; src: url(__PLEX__/ibm-plex-sans-arabic-arabic-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; background: #09090D; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, BPM = 128, B = 60 / BPM, DUR = 64 * B; window.DUR_S = DUR;   // 64 beats = 30 s
const PU = '#6C35FF', OB = '#09090D', WH = '#F5F3FA', MU = 'rgba(245,243,250,0.62)', MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), SEQ = '__SEQ__', NIIMEE_N = __NN__;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, q) => a + (b - a) * q;
const ss = (x) => x * x * (3 - 2 * x), eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (t, t0, d = 0.5, z = 0.5) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1.8) return 1; const w = 11, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z / Math.sqrt(1 - z * z) * Math.sin(wd * x)); };
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
function txt(s, x, y, font, color, align = 'center', rtl = false) { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.direction = rtl ? 'rtl' : 'ltr'; ctx.fillText(s, x, y); ctx.direction = 'ltr'; }
const tw = (s, font) => { ctx.font = font; return ctx.measureText(s).width; };
let SYMBOL;
// ---------- textures ----------
const CACHE = new Map(); let MISS = [];
function img(url) { let im = CACHE.get(url); if (im && im.complete && im.naturalWidth) return im; if (!im) { im = new Image(); im.src = url; CACHE.set(url, im); if (CACHE.size > 400) CACHE.delete(CACHE.keys().next().value); } MISS.push(im); return null; }
const still = (id) => img(`${SEQ}/img/${id}.jpg`);
const niimee = (t) => img(`${SEQ}/niimee/${String(Math.min(NIIMEE_N, Math.max(1, Math.floor(t * 30) + 1))).padStart(4, '0')}.jpg`);
async function loadMissing() { await Promise.all([...new Set(MISS)].map((im) => (im.complete ? null : new Promise((r) => { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); })))); }
function cover(im, x, y, w, h, z = 1, fx = 0.5, fy = 0.5) { if (!im) return; const s = Math.max(w / im.naturalWidth, h / im.naturalHeight) * z, dw = im.naturalWidth * s, dh = im.naturalHeight * s; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.drawImage(im, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh); ctx.restore(); }
function contain(im, cx, cy, maxW, maxH, z = 1, r = 26, shadow = true) { if (!im) return; const s = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight) * z, w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.save(); if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; rr(cx - w / 2, cy - h / 2, w, h, r); ctx.fillStyle = OB; ctx.fill(); ctx.shadowColor = 'transparent'; }
  rr(cx - w / 2, cy - h / 2, w, h, r); ctx.clip(); ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h); ctx.restore(); }
function blurBg(im, a = 0.45) { if (!im) return; ctx.filter = `blur(40px) brightness(${a})`; cover(im, -80, -80, W + 160, H + 160, 1.1); ctx.filter = 'none'; }

// ---------- the cut list (in beats) ----------
// kinds: full (cinematic, full-bleed) · card (the post shown whole, over its own blurred colour) · grid2/grid3/grid4 · video
const S = [];
const add = (b0, len, kind, ids, word) => S.push({ a: b0 * B, b: (b0 + len) * B, kind, ids, word });
// A · campaigns: Chery, full-bleed, one per beat, then three brand visuals
['chery_4', 'chery_2', 'chery_5', 'chery_3'].forEach((id, i) => add(4 + i, 1, 'full', [id], 'Campaigns.'));
add(8, 2, 'card', ['016_001'], 'Campaigns.'); add(10, 2, 'grid3', ['chery_1', '016_000', '021_009'], 'Campaigns.');
// B · content
['022_012', '023_013', '021_010', '023_014'].forEach((id, i) => add(12 + i, 1, 'card', [id], 'Content.'));
add(16, 2, 'grid4', ['041_066', '041_067', '037_057', '042_070'], 'Content.'); add(18, 2, 'grid2', ['041_068', '022_011'], 'Content.');
// C · motion: the niimee piece
add(20, 8, 'video', [], 'Motion.');
// D · food and hospitality
['032_041', '034_047', '036_053', '038_059'].forEach((id, i) => add(28 + i, 1, 'card', [id], 'Taste.'));
add(32, 2, 'grid2', ['035_051', '034_049'], 'Taste.'); add(34, 2, 'card', ['033_043'], 'Taste.');
// E · events
['mix_123', 'mix_124', 'mix_125', 'mix_127'].forEach((id, i) => add(36 + i * 2, 2, 'card', [id], 'Events.'));
// F · retail, home, beauty, travel
['030_035', '031_040', '045_081', '043_073', '039_062', '051_089', '029_034', '030_036'].forEach((id, i) => add(44 + i, 1, 'card', [id], 'Brands.'));
// G · the rush: half-beat flashes into the lockup
['016_001', 'chery_4', '023_013', '041_066', '038_059', '051_090', '024_017', '045_080'].forEach((id, i) => add(52 + i * 0.5, 0.5, 'card', [id], ''));

function shotDraw(s, t) {
  const lt = t - s.a, punch = 1 + 0.07 * (1 - eo(clamp(lt / 0.35)));
  if (s.kind === 'full') { cover(still(s.ids[0]), 0, 0, W, H, punch * (1 + 0.04 * lt), 0.5, 0.5); ctx.fillStyle = 'rgba(9,9,13,0.12)'; ctx.fillRect(0, 0, W, H); return; }
  if (s.kind === 'card') { const im = still(s.ids[0]); blurBg(im); contain(im, 540, 900, 960, 1280, punch); return; }
  if (s.kind === 'video') { ctx.fillStyle = 'rgb(242,238,227)'; ctx.fillRect(0, 0, W, H); const im = niimee(lt * 1.0 + 2.0); if (im) { const h = 1350 * punch; ctx.drawImage(im, 540 - 540 * punch, 860 - h / 2, 1080 * punch, h); } return; }
  const n = s.ids.length, ims = s.ids.map(still); blurBg(ims[0], 0.35);
  const slots = { grid2: [[540, 520, 900, 760], [540, 1330, 900, 760]], grid3: [[540, 350, 760, 480], [540, 870, 760, 480], [540, 1390, 760, 480]],
                  grid4: [[290, 560, 470, 600], [790, 560, 470, 600], [290, 1240, 470, 600], [790, 1240, 470, 600]] }[s.kind];
  slots.forEach(([x, y, w, h], i) => { const q = spring(t, s.a + i * B / 4, 0.4), dy = 160 * (1 - Math.min(1, q)) * (i % 2 ? 1 : -1); ctx.save(); ctx.globalAlpha = clamp(q * 2); contain(ims[i], x, y + dy, w, h, 1); ctx.restore(); });
}
// the section word: big, bottom-left, with the brand's slash; the command chip at the top
function word(t) {
  const s = S.find((x) => t >= x.a && t < x.b); if (!s || !s.word) return;
  const first = S.find((x) => x.word === s.word), q = spring(t, first.a, 0.45), last = [...S].reverse().find((x) => x.word === s.word), out = 1 - ss(seg(t, last.b - 0.15, last.b));
  ctx.save(); ctx.globalAlpha = out; const g = ctx.createLinearGradient(0, 1380, 0, 1920); g.addColorStop(0, 'rgba(9,9,13,0)'); g.addColorStop(1, 'rgba(9,9,13,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 1380, W, 540);
  ctx.save(); ctx.globalAlpha *= clamp(q * 1.6); ctx.translate(-80 * (1 - Math.min(1, q)), 0); ctx.fillStyle = PU; ctx.fillRect(80, 1640, 90 * Math.min(1, q), 12); txt(s.word, 70, 1790, '700 150px Sat', WH, 'left'); ctx.restore();
  const chip = '/make ' + s.word.toLowerCase().replace('.', ''), f = `500 32px ${MONO}`, w = tw(chip, f) + 60; rr(70, 86, w, 60, 30); ctx.fillStyle = 'rgba(9,9,13,0.7)'; ctx.fill(); txt('/', 100, 127, `700 32px ${MONO}`, PU, 'left'); txt(chip.slice(1), 100 + tw('/', `700 32px ${MONO}`), 127, f, WH, 'left');
  ctx.restore();
}
// open: "Say it." then "Tamm it." on the first bar, a hard drop on beat 4
function open(t) {
  if (t >= 4 * B) return; ctx.fillStyle = OB; ctx.fillRect(0, 0, W, H);
  const q1 = spring(t, 0.02, 0.35), q2 = spring(t, 2 * B, 0.35);
  if (q1 > 0) { ctx.save(); ctx.globalAlpha = clamp(q1 * 2); ctx.translate(540, 860); const k = lerp(1.4, 1, Math.min(1, q1)); ctx.scale(k, k); txt('Say it.', 0, 0, '700 190px Sat', WH); ctx.restore(); }
  if (q2 > 0) { ctx.save(); ctx.globalAlpha = clamp(q2 * 2); ctx.translate(540, 1090); const k = lerp(1.4, 1, Math.min(1, q2)); ctx.scale(k, k); txt('Tamm it.', 0, 0, '700 190px Sat', PU); ctx.restore(); }
  if (t > 3 * B) { const r = seg(t, 3 * B, 4 * B); ctx.fillStyle = `rgba(245,243,250,${0.0 + 0.9 * Math.pow(r, 3)})`; ctx.fillRect(0, 0, W, H); }   // the build into the drop
}
// lockup on beat 56
function lockup(t) {
  const a0 = 56 * B; if (t < a0) return; ctx.fillStyle = OB; ctx.fillRect(0, 0, W, H);
  const fl = 1 - seg(t, a0, a0 + 0.25); if (fl > 0) { ctx.fillStyle = `rgba(245,243,250,${0.8 * fl})`; ctx.fillRect(0, 0, W, H); }
  const show = (t0, f) => { const q = spring(t, t0, 0.45); if (q <= 0) return; ctx.save(); ctx.globalAlpha = clamp(q * 1.6); ctx.translate(0, 26 * (1 - Math.min(1, q))); f(); ctx.restore(); };
  show(a0 + 0.05, () => { const SH = 250, SW = SH * 600 / 721; ctx.drawImage(SYMBOL, 540 - SW / 2, 620 - SH / 2, SW, SH); });
  show(a0 + B, () => txt('SayTamm', 540, 950, '700 130px Sat', WH));
  show(a0 + 1.5 * B, () => txt('قول تم', 540, 1050, '700 70px Plex', MU, 'center', true));
  show(a0 + 3 * B, () => { const s = 'Say it. Tamm it', f = '700 76px Sat', w = tw(s, f); txt(s, 528, 1220, f, WH); ctx.fillStyle = PU; ctx.beginPath(); ctx.arc(528 + w / 2 + 18, 1212, 11, 0, 7); ctx.fill(); });
  show(a0 + 4.5 * B, () => { txt('A digital marketing & performance agency', 540, 1330, '500 38px Sat', MU); txt('saytamm.com', 540, 1420, '700 44px Sat', WH); });
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = OB; ctx.fillRect(0, 0, W, H);
  const s = S.find((x) => t >= x.a && t < x.b); if (s) shotDraw(s, t);
  // a short flash on each section's first cut
  if (s && S.find((x) => x.word === s.word) === s && s.word) { const f = 1 - seg(t, s.a, s.a + 0.12); if (f > 0) { ctx.fillStyle = `rgba(245,243,250,${0.55 * f})`; ctx.fillRect(0, 0, W, H); } }
  word(t); open(t); lockup(t);
}
window.seek = async (t) => { for (let p = 0; p < 4; p++) { MISS = []; draw(t); if (!MISS.length) return; await loadMissing(); } };

// ---------- score: original, 128 BPM ----------
window.renderAudio = async () => {
  const SR = 48000, ac = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const master = ac.createDynamicsCompressor(); master.threshold.value = -12; master.ratio.value = 4; master.attack.value = 0.003; master.release.value = 0.12; master.connect(ac.destination);
  const bus = ac.createGain(); bus.connect(master);
  const rev = ac.createConvolver(); { const len = SR * 1.8, ir = ac.createBuffer(2, len, SR); for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let s = 9 + ch; for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 1073741823.5 - 1) * Math.pow(1 - i / len, 3.4); } } rev.buffer = ir; }
  const revIn = ac.createGain(), revOut = ac.createGain(); revOut.gain.value = 0.25; revIn.connect(rev); rev.connect(revOut); revOut.connect(master);
  const nb = (() => { const b = ac.createBuffer(1, SR, SR), d = b.getChannelData(0); let s = 3; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; } return b; })();
  const env = (g, t, a, pk, d) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const osc = (t, type, f0, f1, a, d, pk, pan = 0, send = 0, lp = 0) => { const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + a + d * 0.6);
    let n = o; if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; } env(g, t, a, pk, d); p.pan.value = pan; n.connect(g); g.connect(p); p.connect(bus); if (send) { const sg = ac.createGain(); sg.gain.value = send; p.connect(sg); sg.connect(revIn); } o.start(t); o.stop(t + a + d + 0.05); };
  const noise = (t, type, f, q, a, d, pk, pan = 0, f1 = 0, send = 0) => { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner(); s.buffer = nb; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + a + d); fl.Q.value = q; env(g, t, a, pk, d); p.pan.value = pan; s.connect(fl); fl.connect(g); g.connect(p); p.connect(bus); if (send) { const sg = ac.createGain(); sg.gain.value = send; p.connect(sg); sg.connect(revIn); } s.start(t, (t * 0.37) % 0.8); s.stop(t + a + d + 0.05); };
  const kick = (t, g = 1) => { osc(t, 'sine', 160, 42, 0.002, 0.34, 0.95 * g); noise(t, 'lowpass', 1800, 0.7, 0.001, 0.02, 0.25 * g); };
  const clap = (t, g = 1) => { [0, 0.011, 0.022].forEach((d) => noise(t + d, 'bandpass', 1500, 1.1, 0.001, 0.09, 0.22 * g, 0, 0, 0.3)); };
  const hat = (t, g = 1, open = false) => noise(t, 'highpass', 8500, 0.7, 0.001, open ? 0.14 : 0.035, 0.07 * g, (t * 7) % 1 - 0.5);
  // A minor progression: Am · F · C · G, a bar each; bass in eighths, stabs on the off-beats
  const ROOT = [55, 43.65, 65.41, 49], CH = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  // bar 1: the hook, quiet, with a riser; then the drop on beat 4
  osc(0.02, 'sine', 90, 40, 0.002, 0.7, 0.8); noise(0.02, 'lowpass', 2500, 0.6, 0.001, 0.3, 0.3, 0, 0, 0.6); osc(2 * B, 'sine', 100, 40, 0.002, 0.7, 0.85); noise(2 * B, 'lowpass', 2500, 0.6, 0.001, 0.3, 0.3, 0, 0, 0.6);
  noise(0.3, 'bandpass', 300, 1.5, 4 * B - 0.35, 0.05, 0.12, 0, 7000);
  for (let beat = 4; beat < 56; beat++) {
    const t = beat * B, bar = Math.floor(beat / 4), c = bar % 4, inBar = beat % 4, breakdown = beat >= 20 && beat < 24;
    if (!breakdown) kick(t); if (inBar === 1 || inBar === 3) clap(t, breakdown ? 0.6 : 1);
    for (let k = 0; k < 4; k++) hat(t + k * B / 4, k === 2 ? 1.2 : 0.7, k === 2 && beat % 2 === 1);
    for (let k = 0; k < 2; k++) osc(t + k * B / 2, 'sawtooth', ROOT[c] * (k ? 2 : 1), 0, 0.005, B * 0.42, 0.16, 0, 0, 380);
    CH[c].forEach((f, i) => osc(t + B / 2, 'square', f, 0, 0.004, 0.16, 0.022, (i - 1) * 0.4, 0.3, 2600));
    if (inBar === 0 && beat % 8 === 4) CH[c].forEach((f) => osc(t, 'triangle', f * 2, 0, 0.004, 0.5, 0.02, 0, 0.5));
  }
  // section hits (each section's first cut) and a whoosh into each
  [4, 12, 20, 28, 36, 44, 52].forEach((b) => { const t = b * B; osc(t, 'sine', 130, 38, 0.002, 0.5, 0.6); noise(t, 'lowpass', 4000, 0.5, 0.001, 0.4, 0.22, 0, 0, 0.6); noise(t - 0.5, 'bandpass', 400, 1.3, 0.45, 0.05, 0.1, 0, 6000); });
  // the rush: snare roll and riser into the lockup
  for (let k = 0; k < 16; k++) noise(52 * B + k * B / 4, 'bandpass', 1800, 1.2, 0.001, 0.07, 0.07 + k * 0.011, 0, 0, 0.2);
  noise(52 * B, 'bandpass', 400, 1.6, 4 * B - 0.05, 0.05, 0.16, 0, 8000);
  // lockup: one big hit, then a held chord
  const L = 56 * B; kick(L, 1.2); osc(L, 'sine', 110, 36, 0.002, 1.2, 0.9); noise(L, 'lowpass', 5000, 0.5, 0.001, 0.8, 0.3, 0, 0, 0.8);
  [220, 277.2, 329.6, 440].forEach((f) => [-6, 6].forEach((dt) => { const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt; fl.type = 'lowpass'; fl.frequency.value = 1300; g.gain.setValueAtTime(0, L); g.gain.linearRampToValueAtTime(0.014, L + 0.4); g.gain.setValueAtTime(0.014, DUR - 1.2); g.gain.linearRampToValueAtTime(0, DUR - 0.05); o.connect(fl); fl.connect(g); g.connect(bus); const sg = ac.createGain(); sg.gain.value = 0.6; g.connect(sg); sg.connect(revIn); o.start(L); o.stop(DUR); }));
  [[L + B, 880], [L + 1.5 * B, 1318.5], [L + 3 * B, 1108.7]].forEach(([t, f]) => osc(t, 'triangle', f, 0, 0.002, 1.2, 0.04, 0, 0.6));
  const buf = await ac.startRendering(), Lc = buf.getChannelData(0), Rc = buf.getChannelData(1), n = Lc.length, ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => [...s].forEach((ch, i) => dv.setUint8(o + i, ch.charCodeAt(0)));
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, Lc[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, Rc[i])) * 32767, true); }
  let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(bin);
};
window.ready = (async () => {
  await Promise.all(['500 40px Sat', '700 40px Sat', '700 40px Plex'].map((f) => document.fonts.load(f, 'قول تم Say it 0123'))); await document.fonts.load(`500 32px ${MONO}`, '/make'); await document.fonts.ready;
  SYMBOL = new Image(); SYMBOL.src = '__SYMBOL__'; await SYMBOL.decode(); await window.seek(0); return true;
})();
</script></body></html>
